function pickItem(i){   // えらんだら すぐ使わず、せつめい＋かくにん画面へ
  if(battle.phase!=='command'||battle.sub!==2)return;
  const k=itemKeys()[i];
  if(!k)return;
  battle.itemIdx=i;battle.confirmKey=k;battle.confirmSel=0;battle.sub=3;
}
function itemDescText(k){
  const it=ITEM_DB[k];
  if(it.kind==='rage')return 'このターン ダメージ1.5ばい／うけるダメージ2ばい';
  if(it.kind==='shield')return 'このターン うけるダメージが '+it.value+' へる';
  if(it.kind==='counter')return 'つぎの '+it.value+'ターン パリィすると うけるダメージを あいてに あたえる';
  if(it.kind==='hpsp')return 'HPと SPを '+it.hp+' ずつ かいふくする';
  if(it.kind==='holm')return 'つかうと '+it.dmg+'ダメージ／つぎの'+it.turns+'ターン はじめに HP'+it.heal+'かいふく';
  return it.kind==='heal'?'HPを '+it.value+' かいふくする':(it.kind==='sp'?'SPを '+it.value+' かいふくする':'さいだいHPが '+it.value+' ふえる');
}
function confirmItemUse(){
  if(battle.phase!=='command'||battle.sub!==3)return;
  const k=battle.confirmKey,it=ITEM_DB[k];
  if(!it||!(player.items[k]>0)){battle.sub=2;return;}
  if(it.kind==='sp'&&player.sp>=player.maxSp){
    battle.floats.push({x:480,y:330,text:'SPは まんたんだ！',color:'#ffb3b3',life:1.0,vy:-40});
    battle.sub=2;
    return;
  }
  if(it.kind==='hpsp'&&player.hp>=player.maxHp&&player.sp>=player.maxSp){
    battle.floats.push({x:480,y:330,text:'HPも SPも まんたんだ！',color:'#ffb3b3',life:1.0,vy:-40});
    battle.sub=2;
    return;
  }
  if(it.kind==='holm'){
    const warn=t=>{battle.floats.push({x:480,y:330,text:t,color:'#ffb3b3',life:1.0,vy:-40});battle.sub=2;};
    if(battle.holm>0)return warn('もう ホルミシス中だ！');
    if(battle.shield)return warn('シールド中は つかえない！');
    if(battle.rage)return warn('かんしゃく中は つかえない！');
    if(battle.counter)return warn('カウンター中は つかえない！');
    if(player.hp<=it.dmg)return warn('HPが たりない！');   // 自分のダメージで たおれないように
    player.items[k]--;
    player.hp-=it.dmg;
    battle.holm=it.turns;
    playSfx('damage');sfxSilent=true;
    battle.shake=Math.max(battle.shake,8);
    battle.floats.push({x:330,y:150,text:'-'+it.dmg,color:'#ff6b6b',life:1.1,vy:-45});
    battle.sub=0;battle.phase='enemyWarn';battle.t=0;   // ターンは進む
    return;
  }
  if(it.kind==='counter'){
    const warn=t=>{battle.floats.push({x:480,y:330,text:t,color:'#ffb3b3',life:1.0,vy:-40});battle.sub=2;};
    if(battle.counter)return warn('もう カウンターしている！');
    if(battle.holm>0)return warn('ホルミシス中は つかえない！');
    if(battle.shield)return warn('シールド中は つかえない！');
    if(battle.rage)return warn('かんしゃく中は つかえない！');
    player.items[k]--;
    battle.counter=it.value;   // のこりターン数
    playSfx('guard');sfxSilent=true;
    battle.floats.push({x:330,y:150,text:'カウンター！',color:'#ffb347',life:1.1,vy:-45});
    battle.sub=0;   // ターンは進まない
    return;
  }
  if(it.kind==='shield'){
    if(battle.holm>0){
      battle.floats.push({x:480,y:330,text:'ホルミシス中は つかえない！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    if(battle.counter){
      battle.floats.push({x:480,y:330,text:'カウンター中は つかえない！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    if(battle.shield||battle.rage){   // もう使っている／かんしゃく中は重ねがけ不可：消費せずに戻る
      battle.floats.push({x:480,y:330,text:battle.rage?'かんしゃく中は つかえない！':'もう シールドしている！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    player.items[k]--;
    battle.shield=true;
    playSfx('guard');sfxSilent=true;
    battle.floats.push({x:330,y:150,text:'シールド！',color:'#7fd9ff',life:1.1,vy:-45});
    battle.sub=0;   // ターンは進まない
    return;
  }
  if(it.kind==='rage'){
    if(battle.holm>0){
      battle.floats.push({x:480,y:330,text:'ホルミシス中は つかえない！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    if(battle.shield){
      battle.floats.push({x:480,y:330,text:'シールド中は つかえない！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    if(battle.counter){
      battle.floats.push({x:480,y:330,text:'カウンター中は つかえない！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    if(battle.rage){   // もう使っている：消費せずに戻る
      battle.floats.push({x:480,y:330,text:'もう かんしゃくしている！',color:'#ffb3b3',life:1.0,vy:-40});
      battle.sub=2;
      return;
    }
    player.items[k]--;
    battle.rage=true;
    playSfx('guard');sfxSilent=true;
    battle.floats.push({x:330,y:150,text:'かんしゃく！',color:'#ff7a5a',life:1.1,vy:-45});
    battle.sub=0;   // ターンは進まない：そのままコマンドにもどる
    return;
  }
  player.items[k]--;
  playSfx('heal');sfxSilent=true;   // かいふく音（このときは menu 音を鳴らさない）
  if(it.kind==='heal'){
    const heal=Math.min(it.value,player.maxHp-player.hp);
    player.hp+=heal;
    battle.floats.push({x:330,y:150,text:'+'+heal,color:'#7dffb0',life:1.1,vy:-45});
  }else if(it.kind==='sp'){
    const g=Math.min(it.value,player.maxSp-player.sp);
    player.sp+=g;
    battle.floats.push({x:330,y:150,text:'SP+'+g,color:'#7fe4ff',life:1.1,vy:-45});
  }else if(it.kind==='hpsp'){
    const h=Math.min(it.hp,player.maxHp-player.hp),g=Math.min(it.sp,player.maxSp-player.sp);
    player.hp+=h;player.sp+=g;
    battle.floats.push({x:330,y:150,text:'+'+h,color:'#7dffb0',life:1.1,vy:-45});
    battle.floats.push({x:330,y:128,text:'SP+'+g,color:'#7fe4ff',life:1.1,vy:-45});
  }else if(it.kind==='maxhp'){
    player.maxHp+=it.value;player.hp+=it.value;
    battle.floats.push({x:330,y:150,text:'MAXHP +'+it.value,color:'#ffb060',life:1.1,vy:-45});
  }
  battle.sub=0;battle.phase='enemyWarn';battle.t=0;
}
function keepVisible(sel,n){
  battle.scroll=clamp(battle.scroll||0,0,Math.max(0,n-3));
  if(sel<battle.scroll)battle.scroll=sel;
  if(sel>battle.scroll+2)battle.scroll=sel-2;
}

/* ---- 心電図：敵の行動のあと コマンドにもどったとき 黒い背景に1度だけ流れる（HP 51%以上＝緑／21%以上＝黄／1〜20%＝赤） ---- */
const ECG_DUR=1.9;
function ecgColor(){
  const pct=player.maxHp>0?player.hp/player.maxHp*100:0;
  return pct>=51?'#2cff5a':pct>=21?'#ffe14d':'#ff3b3b';
}
function ecgY(k,mid){   // 1拍ぶんの波形（0〜1）
  if(k<0.10)return 0;
  if(k<0.20)return -5*Math.sin((k-0.10)/0.10*Math.PI);          // P波
  if(k<0.28)return 0;
  if(k<0.32)return 4*(k-0.28)/0.04;                              // Q
  if(k<0.38)return 4-(4+26)*(k-0.32)/0.06;                       // R（高くとがる）
  if(k<0.44)return -26+(26+9)*(k-0.38)/0.06;                     // S
  if(k<0.48)return 9-9*(k-0.44)/0.04;
  if(k<0.60)return 0;
  if(k<0.78)return -8*Math.sin((k-0.60)/0.18*Math.PI);          // T波
  return 0;
}
function drawEcg(){
  const e=battle.ecg;if(!e||e.t>=ECG_DUR)return;
  const col=ecgColor(),mid=236,x0=8,x1=472,bw=116;                // 1拍の幅（ドット）
  const prog=clamp(e.t/(ECG_DUR*0.8),0,1);                        // 左から右へ ペンが進む
  const headX=x0+(x1-x0)*prog;
  const fadeA=e.t>ECG_DUR*0.8?1-(e.t-ECG_DUR*0.8)/(ECG_DUR*0.2):1;
  ctx.save();
  ctx.globalAlpha=0.9*fadeA;
  const pts=[];
  for(let x=x0;x<=headX;x++){
    const k=(((x-x0)%bw)+bw)%bw/bw;
    pts.push([x,mid+Math.round(ecgY(k))]);
  }
  for(let i=0;i<pts.length;i++){   // 線（ペンの近くほど明るく、後ろはうすく）
    const a=0.35+0.65*Math.max(0,1-(headX-pts[i][0])/150);
    ctx.globalAlpha=0.9*fadeA*a;
    const y0=i?pts[i-1][1]:pts[i][1],y1=pts[i][1],ya=Math.min(y0,y1),yb=Math.max(y0,y1);
    uR(pts[i][0],ya,1,yb-ya+2,col);
  }
  if(pts.length){   // ペンの先の光
    const hp=pts[pts.length-1];
    ctx.globalAlpha=0.35*fadeA;uR(hp[0]-2,hp[1]-2,6,6,col);
    ctx.globalAlpha=fadeA;uR(hp[0],hp[1],2,2,'#fff');
  }
  ctx.restore();
}
function drawCommandPanel(){
  const sub=battle.sub;
  drawEcg();   // ボタンのうしろ（黒い背景）
  drawHpSp(sub!==0);
  if(sub===3){drawItemConfirm();return;}
  if(sub===4){drawTargetSelect();return;}
  if(sub===0){
    const defs=[
      {label:'アイテム',icon:(x,y)=>iconPotion(x+48,y+31,'#00e040')},
      {label:'逃げる',icon:(x,y)=>iconRun(x+47,y+33)},
      {label:'たたかう',icon:(x,y)=>iconSword(x+41,y+37)},
    ];
    for(let i=0;i<3;i++){
      drawFrameBtn(BX[i],BY,defs[i].label,battle.menuIdx===i,i===1&&(isBigFoe(battle.enemy.def)||player.sp<RUN_COST),{icon:defs[i].icon,sub:i===1?(isBigFoe(battle.enemy.def)?'ボスは ムリ':'SP '+RUN_COST):undefined,subCol:'#feb103'});
      uiHits.push({x:BX[i],y:BY,w:BW,h:BH,fn:()=>{battle.menuIdx=i;menuMain(i);}});
    }
    return;
  }
  // サブメニュー：3枚ずつ横スクロール
  let entries=[],selIdx=0,onPick=null,title='';
  if(sub===1){
    title='わざ';
    entries=player.moves.map(nm=>{
      const m=MOVE_DB[nm],cost=moveSp(nm),ok=player.sp>=cost;
      const dc={EASY:'#7dffb0',NORMAL:'#7fe4ff',HARD:'#ffe14d',EXPERT:'#ff5c8a',ONI:'#ff5c8a'}[m.diff]||'#aaa';
      const file=BAG_ICON_FILES.moves[nm];
      return {label:m.name,sub:'SP '+cost,subCol:'#fff',sub2:m.diff,sub2Col:dc,dim:!ok,
        icon:(x,y)=>{
          if(bagImg(file)){
            if(!ok)ctx.globalAlpha=0.4;   // SPが足りない技はうすく
            drawBagIcon(file,null,x+40,y+22,34,30);
            ctx.globalAlpha=1;
          }else iconSpark(x+58,y+38,ok?m.color:'#666');
        }};
    });
    selIdx=battle.moveIdx;onPick=pickMove;
  }else{
    title='どうぐ';
    const keys=itemKeys();
    entries=keys.map(k=>{
      const it=ITEM_DB[k];
      const liq=itemLiq(it),file=BAG_ICON_FILES.items[k];
      return {label:k,sub:'×'+player.items[k],subCol:'#fff',dim:false,
        icon:(x,y)=>{if(bagImg(file))drawBagIcon(file,null,x+40,y+22,34,30);else iconPotion(x+48,y+31,liq);}};
    });
    selIdx=battle.itemIdx||0;onPick=pickItem;
  }
  const n=entries.length;
  // もどる
  uBox(8,177,64,16,'#fff');
  uText('もどる',40,180,9,'#fff','center');
  uiHits.push({x:0,y:170,w:80,h:30,fn:()=>{if(battle.phase==='command')battle.sub=0;}});
  if(n===0){
    uText('なにも もっていない',240,228,14,'#fff','center');
    return;
  }
  keepVisible(selIdx,n);
  const off=n<3?(3-n)*60:0;
  for(let k=0;k<3;k++){
    const idx=battle.scroll+k;if(idx>=n)break;
    const e=entries[idx],x=BX[k]+off;
    drawFrameBtn(x,BY,e.label,idx===selIdx,e.dim,e);
    uiHits.push({x:x,y:BY,w:BW,h:BH,fn:()=>{onPick(idx);}});
  }
  if(battle.scroll>0){
    uBox(10,222,56,30,'#fff');iconArrow(29,229,-1);
    uiHits.push({x:0,y:205,w:80,h:61,fn:()=>{battle.scroll=Math.max(0,battle.scroll-3);if(battle.sub===1)battle.moveIdx=battle.scroll;else battle.itemIdx=battle.scroll;}});
  }
  if(battle.scroll+3<n){
    uBox(414,222,56,30,'#fff');iconArrow(433,229,1);
    uiHits.push({x:400,y:205,w:80,h:61,fn:()=>{battle.scroll=Math.min(n-3,battle.scroll+3);if(battle.sub===1)battle.moveIdx=battle.scroll;else battle.itemIdx=battle.scroll;}});
  }
}

function drawAuraFist(f,pw){
  const sp=fistSprite(f.col).cv,r=f.size;

  }

function drawShineFx(){   // 暗転 → 敵の真上からスポットライト → 当たった瞬間にドーン（ランクが高いほど豪華）

  // --- 光に照らされた敵（暗い画面の上に くっきり重ねる）---

  ctx.beginPath();ctx.moveTo(cx-topHW,-10);ctx.lineTo(cx+topHW,-10);ctx.lineTo(cx+bw*1.05,feet+10);ctx.lineTo(cx-bw*1.05,feet+10);ctx.closePath();ctx.clip();
  drawFoeBody(battle.enemy,true);
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  // --- 光のすじ ---
  shineBeam(cx,topHW,cx,bw,feet,ba,n>=3?rb(0):col);
  if(n>=2){   // GREAT〜：左右からも スポットライトが集まる
    const offs=n>=3?[-110,110,-260,260]:[-190,190],sa=clamp((t-0.3)/0.15,0,1);
    for(let i=0;i<offs.length;i++)shineBeam(cx+offs[i],4,cx+offs[i]*0.12,bw*0.45,feet,ba*0.65*sa,n>=3?rb(i+1):col);
  }
  // --- 足もとの光だまり ---
  ctx.save();ctx.translate(cx,feet);ctx.scale(1,0.28);
  const R=Math.max(10,bw*1.15),pg=ctx.createRadialGradient(0,0,2,0,0,R);
  pg.addColorStop(0,'#ffffff');pg.addColorStop(0.45,col);pg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=ba*0.9;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // --- ヒット前：光のわっかが ぎゅっと縮まる（当たるタイミングの合図）---
  if(st<0){
    for(let j=0;j<(n>=2?2:1);j++){
      const v=clamp(warm-j*0.12,0,1),rr=R0*(2.2-1.2*v);
      ctx.strokeStyle=n>=3?rb(j*3):col;ctx.lineWidth=2+n;ctx.globalAlpha=(0.2+0.6*v)*appear;
      ctx.beginPath();ctx.ellipse(cx,feet,rr,rr*0.28,0,0,Math.PI*2);ctx.stroke();
    }
  }
  // --- 光のなかを のぼる きらめき ---
  const cnt=8+6*n;
  for(let i=0;i<cnt;i++){
    const v=(G.time*0.7+i/cnt)%1,y=feet-(feet+10)*v,x=cx+Math.sin(i*7.3+G.time*2)*0.8*hwAt(y);
    ctx.globalAlpha=Math.sin(v*Math.PI)*ba;ctx.fillStyle=(i%2)?'#fff':col;
    if(n>=2){starPath(x,y,2.5+P*2.5,G.time*2+i);ctx.fill();}else{const z=2+P*1.5;ctx.fillRect(x-z/2,y-z/2,z,z);}
  }
  // --- GREAT〜：足もとで ゆっくりまわる 光の筋 ---
  if(n>=2){
    const rays=n>=3?14:8;
    for(let i=0;i<rays;i++){
      const a=G.time*0.9+i*Math.PI*2/rays,len=R0*(1.7+0.4*n);
      ctx.globalAlpha=ba*0.3;ctx.fillStyle=n>=3?rb(i):col;
      ctx.beginPath();ctx.moveTo(cx,feet);
      ctx.lineTo(cx+Math.cos(a-0.07)*len,feet+Math.sin(a-0.07)*len*0.28);
      ctx.lineTo(cx+Math.cos(a+0.07)*len,feet+Math.sin(a+0.07)*len*0.28);
      ctx.closePath();ctx.fill();
    }
  }
  // --- 光が当たった瞬間 ---
  if(st>=0){
    const mid=tp.y;
    // 画面のフラッシュ
    const fa=(0.22+0.1*n)*(1-clamp(st/0.2,0,1));
    if(fa>0){ctx.globalAlpha=fa;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
    // 足もとに ひろがる 衝撃リング（ランクで本数がふえる）
    const nr=1+(n>=2?1:0)+(n>=3?1:0);
    for(let j=0;j<nr;j++){
      const s2=st-j*0.08;if(s2<=0||s2>=0.55)continue;
      const v=s2/0.55,rr=bw*(1+(1.6+0.5*n)*Math.sqrt(v));
      ctx.strokeStyle=n>=3?rb(j*2):col;ctx.lineWidth=(5+2*n)*(1-v)+1;ctx.globalAlpha=1-v;
      ctx.beginPath();ctx.ellipse(cx,feet,rr,rr*0.28,0,0,Math.PI*2);ctx.stroke();
    }
    // とびちる ひかりのつぶ
    for(let i=0;i<fx.n;i++){
      const ang=i*2.399,sp=(110+((i*37)%90))*P,rr=sp*st;
      const x=cx+Math.cos(ang)*rr*0.7,y=feet-Math.abs(Math.sin(ang))*sp*st*1.3+260*st*st,sz=(3+(i%3))*P*0.8+1;
      ctx.globalAlpha=Math.max(0,1-st/0.6);ctx.fillStyle=(i%2)?'#fff':(n>=3?rb(i):col);
      if(n>=2){starPath(x,y,sz*1.6,i+st*6);ctx.fill();}else ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    }
    // 敵の体に ひろがる ひかりのトゲ（GOOD〜）
    if(n>=1&&st<0.45){
      const a2=1-st/0.45,nSp=8+4*n;
      ctx.globalAlpha=a2;ctx.fillStyle=(Math.floor(st*40)%2)?'#fff':col;
      for(let i=0;i<nSp;i++){
        const ang=i/nSp*Math.PI*2+0.3,r0=12+st*50,r1=r0+(40+50*P)*a2+10,wd=0.09;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang-wd)*r0,mid+Math.sin(ang-wd)*r0);
        ctx.lineTo(cx+Math.cos(ang)*r1,mid+Math.sin(ang)*r1);
        ctx.lineTo(cx+Math.cos(ang+wd)*r0,mid+Math.sin(ang+wd)*r0);
        ctx.closePath();ctx.fill();
      }
    }
    // EXCELLENT：画面いっぱいに 光の放射線 ＋ 大きな星
    if(n>=3&&st<0.6){
      const a3=1-st/0.6;
      for(let i=0;i<16;i++){
        const a=i*Math.PI/8+0.2,len=W,wd=0.035;
        ctx.globalAlpha=a3*0.28;ctx.fillStyle=(i%2)?'#fff':rb(i);
        ctx.beginPath();ctx.moveTo(cx,mid);
        ctx.lineTo(cx+Math.cos(a-wd)*len,mid+Math.sin(a-wd)*len);
        ctx.lineTo(cx+Math.cos(a+wd)*len,mid+Math.sin(a+wd)*len);
        ctx.closePath();ctx.fill();
      }
      ctx.globalAlpha=a3;ctx.fillStyle='#fff';starPath(cx,mid,60+120*Math.sqrt(st/0.6),st*3);ctx.fill();
    }
  }
  ctx.restore();
}
/* ===== りゅうせいの描画 ===== */
function metSkyDim(a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=(tierIdx()>=3)?'#0b0233':'#02000c';ctx.fillRect(0,0,W,H);ctx.restore();}
function metStars(a,n){   // 暗くなった空に またたく星
  if(a<=0.01)return;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='#fff';
  const cnt=28+10*n;
  for(let i=0;i<cnt;i++){
    const x=metHash(i,7)*W,y=metHash(i,8)*210,tw=0.5+0.5*Math.sin(G.time*(2+metHash(i,9)*4)+i),s=1+metHash(i,11)*1.8;
    ctx.globalAlpha=a*tw*(0.3+0.5*metHash(i,10))*(1-y/260);
    if(n>=2&&i%5===0){starPath(x,y,s*3.2,i);ctx.fill();}else ctx.fillRect(x,y,s,s);
  }
  ctx.restore();
}
function metAurora(a){   // EXCELLENT：空にオーロラ
  if(a<=0.01)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let b=0;b<2;b++){
    for(let x=0;x<W;x+=12){
      const y0=26+b*40+Math.sin(x*0.012+G.time*1.3+b*2)*18+Math.sin(x*0.031-G.time*0.8)*7;
      ctx.fillStyle='hsl('+(((x*0.25+G.time*60+b*90)%360)|0)+',100%,65%)';
      for(let k=0;k<5;k++){ctx.globalAlpha=a*0.14*Math.sin((k+0.5)/5*Math.PI);ctx.fillRect(x,y0+k*9,12,9);}
    }
  }
  ctx.restore();
}
function metConstellation(a,prog){   // EXCELLENT：プレイヤーの上空に 星座（五芒星）がうかぶ
  if(a<=0.01)return;
  const cx=HERO_HOME.x,cy=78,R=62,order=[0,2,4,1,3,0],pts=[];
  for(let i=0;i<5;i++){const ang=-Math.PI/2+i*Math.PI*2/5;pts.push({x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R});}
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineWidth=2;
  const segs=5*prog;
  for(let s=0;s<5;s++){
    const k=clamp(segs-s,0,1);if(k<=0)break;
    const p0=pts[order[s]],p1=pts[order[s+1]];
    ctx.strokeStyle='hsl('+(((G.time*200+s*60)%360)|0)+',100%,75%)';ctx.globalAlpha=a*0.85;
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p0.x+(p1.x-p0.x)*k,p0.y+(p1.y-p0.y)*k);ctx.stroke();
  }
  ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){ctx.globalAlpha=a*(0.6+0.4*Math.sin(G.time*8+i));starPath(pts[i].x,pts[i].y,9,G.time+i);ctx.fill();}
  ctx.restore();
}
function metTrail(x0,y0,x1,y1,w,col,a){   // さきが細くなる 流星のしっぽ
  const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);if(L<1)return;
  const nx=-dy/L*w/2,ny=dx/L*w/2,g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.55,col);g.addColorStop(1,'#ffffff');
  ctx.globalAlpha=a;ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1+nx,y1+ny);ctx.lineTo(x1-nx,y1-ny);ctx.closePath();ctx.fill();
}
function metHead(x,y,r,col,fin){   // 流星の頭
  const g=ctx.createRadialGradient(x,y,0,x,y,r*3);
  g.addColorStop(0,'#fff');g.addColorStop(0.3,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.9;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r*0.85,0,Math.PI*2);ctx.fill();
  if(fin){ctx.globalAlpha=0.8;ctx.fillStyle=col;starPath(x,y,r*2.3,G.time*4);ctx.fill();}
}
function drawMeteorCharge(){   // ためている間：空が暗くなっていく ＋ 魔法陣 ＋ 星のたま（ランクごとに強くなる）
  const t=battle.t,hm=HERO_HOME,stg=punchStage(t),si=Math.max(0,stg),n=tierIdx();
  const col=TIER_FX[TIER_ORDER[si]].col,dur=chargeDur();
  const k=easeO(clamp(t/(dur*0.85),0,1)),sh=stg>=0?0.6+(stg+1)*0.9:0;
  const local=stg>=0?t-MET_LEAD-stg*PUNCH_STAGE:0;
  metSkyDim(metDim()*k);
  metStars(k,n);
  if(stg>=3)metAurora(0.8*k);
  for(const f of battle.foes)drawFoeBody(f);
  if(stg>=3)metConstellation(1,clamp(local/0.45,0,1));
  // 足もとの魔法陣
  if(stg>=0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const cx=hm.x,cy=hm.y+26,rx=40+14*si,ry=rx*0.28;
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=0.75;
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
    if(si>=2){ctx.globalAlpha=0.5;ctx.beginPath();ctx.ellipse(cx,cy,rx*1.35,ry*1.35,0,0,Math.PI*2);ctx.stroke();}
    ctx.globalAlpha=0.8;ctx.beginPath();
    for(let i=0;i<=5;i++){const a=G.time*1.2+(i%5)*Math.PI*4/5;const px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
    ctx.stroke();
    ctx.restore();
  }
  drawHero(ctx,hm.x+(Math.random()-0.5)*sh,hm.y+(Math.random()-0.5)*sh*0.5,1,0,battle.enemyAnim,2.2);
  if(stg<0)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  // からだのオーラ
  ctx.globalAlpha=0.16+0.07*si;ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(hm.x,hm.y+4,(30+16*si)*(1+0.06*Math.sin(G.time*30)),44+12*si,0,0,Math.PI*2);ctx.fill();
  // 立ちのぼる きらめき
  ctx.fillStyle=col;
  for(let i=0;i<6+si*4;i++){
    const v=(t*(1.4+0.4*si)+i*0.171)%1,ox=Math.sin(i*5.1+v*6)*(20+7*si),oy=36-v*(90+20*si);
    ctx.globalAlpha=Math.sin(v*Math.PI)*0.85;starPath(hm.x+ox,hm.y+oy,(3+1.2*si)*(1-v*0.4),G.time*3+i);ctx.fill();
  }
  // 空へのびる 光のすじ ＆ 頭の上の 星のたま
  const ox=hm.x,oy=hm.y-64-3*si,pop=0.5+0.5*easeO(clamp(local/0.2,0,1));
  const r=(9+7*si)*pop*(1+0.08*Math.sin(G.time*26));
  const bg=ctx.createLinearGradient(0,oy,0,-10);bg.addColorStop(0,col);bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.55;ctx.fillStyle=bg;const bwid=3+3*si;ctx.fillRect(ox-bwid/2,-10,bwid,oy+10);
  const g=ctx.createRadialGradient(ox,oy,1,ox,oy,r*3);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.25,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.85;ctx.fillStyle=g;ctx.beginPath();ctx.arc(ox,oy,r*3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle='#fff';starPath(ox,oy,r*1.6,G.time*1.5);ctx.fill();
  if(si>=2){ctx.globalAlpha=0.7;ctx.fillStyle=col;starPath(ox,oy,r*2.4,-G.time*2+0.8);ctx.fill();}
  // 空を ながれる ちいさな流星（ランクが高いほど おおい）
  for(let j=0;j<si+(si>=3?2:0);j++){
    const s=(G.time*0.7+j*0.29)%1,hx=60+j*150+s*330,hy=-10+s*250;
    ctx.globalAlpha=Math.sin(s*Math.PI);metTrail(hx-64,hy-48,hx,hy,5,si>=3?'hsl('+(((G.time*200+j*70)%360)|0)+',100%,70%)':col,0.9);
  }
  // ランクアップの しゅんかん：リング＋ひかり
  if(local<0.45){
    const v=local/0.45;
    ctx.strokeStyle=col;ctx.lineWidth=6*(1-v)+1;ctx.globalAlpha=(1-v)*0.95;
    ctx.beginPath();ctx.arc(ox,oy,r+(60+40*si)*v,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=(1-v)*0.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hm.x,hm.y,40+40*v,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawMeteorFx(){   // 空が暗くなる → プレイヤーの上空から 敵へ流星 → 当たった瞬間にダメージ（ランクが高いほど豪華）

  const tp=foePos(battle.enemy),box=enemyImgBox(battle.enemyDef,foeScale(battle.enemyDef));

  // --- プレイヤーのオーラ ---
  ctx.globalAlpha=(0.2+0.06*n)*fade;ctx.fillStyle=n>=3?rb(0):col;

  for(let i=0;i<pl.length;i++){

    const pos=(u)=>{const v=Math.pow(u,m.fin?1.9:1.5);return{x:m.sx+(m.tx-m.sx)*v,y:m.sy+(m.ty-m.sy)*v};};
    const hd=pos(tau),tl=pos(Math.max(0,tau-(m.fin?0.42:0.34))),w=m.r*(m.fin?2.4:2.0);
    metTrail(tl.x,tl.y,hd.x,hd.y,w*2.2,mc,0.35);
    metTrail(tl.x,tl.y,hd.x,hd.y,w*1.3,mc,0.7);
    if(n>=3)metTrail(tl.x,tl.y,hd.x,hd.y,w*1.9,rb(i*2+5,60),0.4);
    metTrail(tl.x,tl.y,hd.x,hd.y,w*0.6,'#ffffff',0.95);
    ctx.fillStyle=(i%2)?'#fff':mc;
    for(let j=0;j<(m.fin?9:3);j++){
      const p=pos(Math.max(0,tau-j*0.035-0.02));
      ctx.globalAlpha=0.85*(1-j/9);
      ctx.fillRect(p.x+(metHash(i*9+j,5)-0.5)*m.r*4,p.y+(metHash(i*9+j,6)-0.5)*m.r*4,2.5,2.5);
    }
    metHead(hd.x,hd.y,m.r,mc,m.fin);
  }
  // --- ちいさな流星の着弾 ---
  for(let i=0;i<pl.length-1;i++){
    const m=pl[i],s=t-m.hit;if(s<0||s>0.45)continue;

    const g=ctx.createRadialGradient(m.tx,m.ty,0,m.tx,m.ty,24+36*v);
    g.addColorStop(0,'#fff');g.addColorStop(0.4,mc);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=(1-v)*0.95;ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.tx,m.ty,24+36*v,0,Math.PI*2);ctx.fill();

  }
  // --- 大きな流星が当たった瞬間 ---
  if(st>=0){
    // 画面のフラッシュ
    const fa=(0.35+0.15*n)*(1-clamp(st/0.22,0,1));
    if(fa>0){ctx.globalAlpha=fa;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}
    // ばくはつの中心
    {const rr=(60+50*n)*(0.4+0.6*easeO(clamp(st/0.15,0,1))),g=ctx.createRadialGradient(cx,my,0,cx,my,rr);
     g.addColorStop(0,'#fff');g.addColorStop(0.35,n>=3?rb(1):col);g.addColorStop(1,'rgba(0,0,0,0)');
     ctx.globalAlpha=clamp(1-st/0.55,0,1);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,my,rr,0,Math.PI*2);ctx.fill();}
    // 地面にひろがる 衝撃リング（ランクで本数がふえる）
    for(let j=0;j<1+n;j++){
      const s2=st-j*0.07;if(s2<=0||s2>=0.65)continue;
      const v=s2/0.65,rr=40+R0*(0.7+(1.6+0.6*n)*Math.sqrt(v));
      ctx.strokeStyle=n>=3?rb(j*2):col;ctx.lineWidth=(6+2*n)*(1-v)+1;ctx.globalAlpha=1-v;
      ctx.beginPath();ctx.ellipse(cx,feet,rr,rr*0.28,0,0,Math.PI*2);ctx.stroke();
    }
    // とびちる ひかりのつぶ
    for(let i=0;i<fx.n;i++){
      const ang=i*2.399,sp=(130+((i*37)%110))*P,rr=sp*st;
      const x=cx+Math.cos(ang)*rr*0.9,y=my+Math.sin(ang)*rr*0.8+300*st*st,sz=(3+(i%3))*P*0.8+1;
      ctx.globalAlpha=Math.max(0,1-st/0.7);ctx.fillStyle=(i%2)?'#fff':(n>=3?rb(i):col);
      if(n>=2){starPath(x,y,sz*1.7,i+st*6);ctx.fill();}else ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
    }

    if(n>=1&&st<0.45){
      const a2=1-st/0.45,nSp=8+4*n;
      ctx.globalAlpha=a2;ctx.fillStyle=(Math.floor(st*40)%2)?'#fff':(n>=3?rb(3):col);
      for(let i=0;i<nSp;i++){
        const ang=i/nSp*Math.PI*2+0.3,r0=12+st*60,r1=r0+(50+60*P)*a2+10,wd=0.09;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang-wd)*r0,my+Math.sin(ang-wd)*r0);
        ctx.lineTo(cx+Math.cos(ang)*r1,my+Math.sin(ang)*r1);
        ctx.lineTo(cx+Math.cos(ang+wd)*r0,my+Math.sin(ang+wd)*r0);
        ctx.closePath();ctx.fill();
      }
    }
    // GREAT〜：天までとどく 光の柱 ＋ 横にはしる 閃光
    if(n>=2&&st<0.6){
      const a3=1-st/0.6,pw=(26+16*n)*(1-st/1.2);
      const pg=ctx.createLinearGradient(0,-10,0,feet);pg.addColorStop(0,'rgba(0,0,0,0)');pg.addColorStop(0.6,n>=3?rb(4):col);pg.addColorStop(1,'#fff');
      ctx.globalAlpha=a3*0.8;ctx.fillStyle=pg;ctx.fillRect(cx-pw,-10,pw*2,feet+10);
      ctx.globalAlpha=a3;ctx.fillStyle='#fff';ctx.fillRect(cx-pw*0.35,-10,pw*0.7,feet+10);
      const fh=(n>=3?10:5)*(1-st/0.6);
      ctx.globalAlpha=a3*0.9;ctx.fillRect(0,my-fh/2,W,fh);
    }
    // EXCELLENT：画面いっぱいの 光の放射線 ＋ 大きな星 ＋ ふりそそぐ星くず ＋ 余韻の光
    if(n>=3){
      if(st<0.7){
        const a4=1-st/0.7;
        for(let i=0;i<20;i++){
          const a=i*Math.PI/10+0.2+st*0.4,len=W*1.2,wd=0.03;
          ctx.globalAlpha=a4*0.32;ctx.fillStyle=(i%2)?'#fff':rb(i);
          ctx.beginPath();ctx.moveTo(cx,my);
          ctx.lineTo(cx+Math.cos(a-wd)*len,my+Math.sin(a-wd)*len);
          ctx.lineTo(cx+Math.cos(a+wd)*len,my+Math.sin(a+wd)*len);
          ctx.closePath();ctx.fill();
        }
        ctx.globalAlpha=a4;ctx.fillStyle='#fff';starPath(cx,my,70+150*Math.sqrt(st/0.7),st*3);ctx.fill();
        ctx.globalAlpha=a4*0.7;ctx.fillStyle=rb(6);starPath(cx,my,40+100*Math.sqrt(st/0.7),-st*4);ctx.fill();
      }
      if(st>0.1&&st<1.4){   // 星くずが 空から ふりそそぐ
        const a5=Math.min(1,(st-0.1)/0.2)*(1-clamp((st-1.0)/0.4,0,1));
        for(let i=0;i<46;i++){
          const x=metHash(i,20)*W,y=-20-metHash(i,21)*160+(st-0.1)*(240+metHash(i,22)*240);
          ctx.globalAlpha=a5*0.9;ctx.fillStyle=(i%3)?rb(i,75):'#fff';starPath(x,y,3+metHash(i,23)*4,G.time*3+i);ctx.fill();
        }
      }
      const cg=ctx.createRadialGradient(cx,feet,2,cx,feet,R0*2);   // 地面にのこる 光
      cg.addColorStop(0,'#fff');cg.addColorStop(0.4,rb(8));cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save();ctx.translate(0,feet);ctx.scale(1,0.28);ctx.translate(0,-feet);
      ctx.globalAlpha=0.7*fade*clamp(1-st/1.4,0,1);ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,feet,R0*2,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
  ctx.restore();
}

function blueFlame(x,y,sz,rot,ph,a){   // 青い炎ひとつ（さきが細いしずく型を 3まい重ねる）。ctx は lighter で呼ぶ
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  const f=1+0.25*Math.sin(G.time*28+ph),cols=['#2a62ff','#4fb4ff','#eafcff'],ks=[1,0.66,0.34];
  for(let i=0;i<3;i++){
    const k=ks[i]*sz;ctx.globalAlpha=a*(i===0?0.75:i===1?0.85:0.95);ctx.fillStyle=cols[i];
    ctx.beginPath();ctx.moveTo(-k*0.55,0);
    ctx.quadraticCurveTo(-k*0.7,-k*0.9*f,0,-k*2.0*f);
    ctx.quadraticCurveTo(k*0.7,-k*0.9*f,k*0.55,0);
    ctx.quadraticCurveTo(0,k*0.3,-k*0.55,0);ctx.fill();
  }
  ctx.restore();
}
function drawSword(px,py,ang,L,col,glow,flame){   // 刀（柄・鍔・反りのある刃）。ang=0 でまっすぐ前（右）
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  if(glow>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5*glow;ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(L*0.5+4,0,L*0.6,7+6*glow,0,0,Math.PI*2);ctx.fill();ctx.restore();}
  ctx.fillStyle='#24103d';ctx.fillRect(-17,-3.5,20,7);ctx.fillStyle='#7a4a2a';ctx.fillRect(-16,-2.5,18,5);   // 柄
  ctx.fillStyle='#24103d';ctx.fillRect(1,-9,6,18);ctx.fillStyle='#e0b84a';ctx.fillRect(2,-8,4,16);            // 鍔
  ctx.beginPath();ctx.moveTo(6,-3.5);ctx.quadraticCurveTo(L*0.6,-8,L+10,-1.5);ctx.lineTo(L,2.5);ctx.lineTo(6,3.5);ctx.closePath();
  ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#24103d';ctx.stroke();
  const g=ctx.createLinearGradient(0,-4,0,4);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#a9b8da');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,-0.5);ctx.lineTo(L*0.92,-1.5);ctx.stroke();   // はなやかな ハイライト
  if(flame){   // 刃にまとう 青い炎
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<10;i++){const s=10+(L-10)*i/9;blueFlame(s,-3,6+4*Math.abs(Math.sin(G.time*9+i)),0,i,0.9);blueFlame(s,3,4+3*Math.abs(Math.sin(G.time*8+i*1.7)),Math.PI,i+3,0.7);}
    blueFlame(L+8,0,8,Math.PI/2,5,0.9);
  }
  ctx.restore();
}
function sweepGeom(){   // 敵ぜんいんが ふくまれる位置から ヒーローの立つ場所と 斬撃の通り道を決める
  const fs=aliveFoes(),list=fs.length?fs:[battle.enemy];
  let minEdge=1e9,sy=0,maxX=0,minX=1e9,feet=0;
  for(const f of list){
    const pp=foePos(f),b=enemyImgBox(f.def,foeScale(f.def));
    minEdge=Math.min(minEdge,pp.x-b/2);minX=Math.min(minX,pp.x);maxX=Math.max(maxX,pp.x+b/2);sy+=pp.y;feet=Math.max(feet,pp.y+Math.min(b*0.42,56));
  }
  return{standX:Math.max(HERO_HOME.x,minEdge-150),standY:sy/list.length+4,minX:minX,maxX:maxX,cy:sy/list.length,feet:feet,list:list};
}
function sweepHeroAt(phase,t){   // ヒーローの位置（敵の前へ走る → ふりかぶる → ふみこむ → もどる）
  const g=sweepGeom(),h0=HERO_HOME;let x,y;
  if(phase==='charge'){const p=easeO(clamp(t/SW_LEAD,0,1));x=h0.x+(g.standX-h0.x)*p;y=h0.y+(g.standY-h0.y)*p;}
  else{
    const T=swT();
    if(t<T.w){x=g.standX-14*easeO(t/T.w);y=g.standY;}
    else if(t<T.back){const v=clamp((t-T.w)/(T.hit-T.w),0,1);x=g.standX-14+48*easeO(v);y=g.standY;}
    else{const v=easeO(clamp((t-T.back)/(T.end-T.back),0,1));x=g.standX+34+(h0.x-g.standX-34)*v;y=g.standY+(h0.y-g.standY)*v;}
  }
  return{x:x,y:y,g:g};
}
function drawSweepCharge(){   // ためている間：敵の前で 刀をかまえる。ランクが上がるたびに 刀が光って のびる
  const t=battle.t,stg=punchStage(t),si=Math.max(0,stg),h=sweepHeroAt('charge',t),col=SW_COL[si];
  if(t<SW_LEAD){for(let i=4;i>=1;i--){const q=sweepHeroAt('charge',Math.max(0,t-i*0.02));ctx.save();ctx.globalAlpha=0.2*(1-i/5);drawHero(ctx,q.x,q.y,1,0,0,2.2);ctx.restore();}}   // 走っている間の 残像
  const sh=stg>=0?0.6+(stg+1)*0.9:0;
  drawHero(ctx,h.x+(Math.random()-0.5)*sh,h.y+(Math.random()-0.5)*sh*0.5,1,0,battle.enemyAnim,2.2);
  const L=58+9*si,ang=-1.75+0.05*Math.sin(G.time*10),hx=h.x+16,hy=h.y+4;
  const tc=t-SW_LEAD,local=tc-stg*PUNCH_STAGE,tipx=hx+Math.cos(ang)*L,tipy=hy+Math.sin(ang)*L;
  if(stg>=0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.16+0.07*si;ctx.fillStyle=col;   // からだのオーラ
    ctx.beginPath();ctx.ellipse(h.x,h.y+4,(30+16*si)*(1+0.06*Math.sin(G.time*30)),44+12*si,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=2+si;   // 足もとリング
    for(let j=0;j<2;j++){const v=(t*1.1+j*0.5)%1;ctx.globalAlpha=(1-v)*0.7;ctx.beginPath();ctx.ellipse(h.x,h.y+26,14+(50+14*si)*v,5+(14+4*si)*v,0,0,Math.PI*2);ctx.stroke();}
    ctx.restore();

  drawSword(hx,hy,ang,L*(local<0.12&&stg>=0?1+0.12*(1-local/0.12):1),col,stg>=0?0.4+0.3*si:0,si>=3);
  if(stg>=0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    if(si>=1){ctx.fillStyle=si>=3?'#bfe9ff':col;for(let i=0;i<4+si*3;i++){   // 刃から のぼる きらめき
      const v=(t*1.6+i*0.19)%1,s2=L*((i*0.37)%1);
      ctx.globalAlpha=Math.sin(v*Math.PI)*0.9;
      starPath(hx+Math.cos(ang)*s2+Math.sin(i*4.3)*5,hy+Math.sin(ang)*s2-v*34,2.5+si*0.8,G.time*3+i);ctx.fill();}}
    if(local<0.45){   // ランクアップの しゅんかん：刃のさきに リング＋ひかり
      const v=local/0.45;ctx.strokeStyle=col;ctx.lineWidth=6*(1-v)+1;ctx.globalAlpha=(1-v)*0.95;
      ctx.beginPath();ctx.arc(tipx,tipy,10+(50+34*si)*v,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=(1-v)*0.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x,h.y,40+40*v,0,Math.PI*2);ctx.fill();
    }
    const dur=chargeDur();   // ためおわり：ピカッ
    if(t>dur-0.1){ctx.globalAlpha=(t-(dur-0.1))/0.1*0.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tipx,tipy,30,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

function swCrescent(x,y,h,w,col,a){   // 三日月の斬撃（まえにふくらむ）
  ctx.save();ctx.translate(x,y);ctx.rotate(-0.18);
  const g=ctx.createLinearGradient(w*0.2,0,w*0.85,0);g.addColorStop(0,col);g.addColorStop(1,'#ffffff');
  ctx.beginPath();ctx.moveTo(0,-h);ctx.quadraticCurveTo(w*1.6,0,0,h);ctx.quadraticCurveTo(w*0.5,0,0,-h);ctx.closePath();
  ctx.globalAlpha=0.35*a;ctx.fillStyle=col;ctx.lineWidth=10;ctx.strokeStyle=col;ctx.stroke();   // ふちのグロー
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fill();
  ctx.restore();
}
function drawSweepStrike(){   // ふりかぶる → なぎはらう → 斬撃が画面の敵ぜんいんを切る（ランクが高いほど 大きく豪華）
  const n=tierIdx(),T=swT(),t=battle.t,st=t-T.hit,col=SW_COL[n],P=TIER_FX[TIER_ORDER[n]].pow;
  const g=sweepGeom(),h=sweepHeroAt('strike',t),blue=n>=3;
  // --- GREAT〜：画面が少し暗くなる（EXCELLENT はこい青）---
  if(n>=2){
    const a=(blue?0.36:0.2)*easeO(clamp(t/(T.w*0.9),0,1))*(1-clamp((t-T.back)/(T.end-T.back),0,1));
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=blue?'#00061c':'#02000c';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  // --- ヒーロー（ふみこむ間 / もどる間は 残像）---
  if((t>T.w&&t<T.hit+0.08)||t>=T.back){
    for(let i=4;i>=1;i--){const q=sweepHeroAt('strike',Math.max(0,t-i*0.02));ctx.save();ctx.globalAlpha=0.2*(1-i/5);drawHero(ctx,q.x,q.y,1,0,0,2.2);ctx.restore();}

  let ang;
  if(t<T.w)ang=-1.75-0.95*easeO(t/T.w);
  else if(t<T.s1){const v=(t-T.w)/(T.s1-T.w);ang=-2.7+3.1*v*v;}
  else if(t<T.back)ang=0.4;
  else ang=0.4-1.6*easeO(clamp((t-T.back)/(T.end-T.back),0,1));
  const L=60+9*n,hx=h.x+16,hy=h.y+4;
  if(t>=T.w&&t<T.s1+0.06){   // ふっている間の 刀の残像（かたなの軌跡）

      const tt=t-j*0.012;if(tt<T.w)break;

  }
  drawSword(hx,hy,ang,L,col,t>=T.w&&t<T.back?0.7+0.2*n:0.3,blue&&t<T.back+0.1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  // --- 斬撃（三日月）---
  const hs=[70,85,100,125][n],ws=[40,55,70,90][n],x0=g.standX+70;
  const sp=Math.max(500,(g.minX-20-x0)/(T.hit-T.launch));

  // はやさを 感じる 横すじ（GREAT〜）
  if(n>=2&&t>=T.launch&&t<T.hit+0.15){
    const a=1-clamp((t-T.launch)/0.3,0,1);ctx.fillStyle=blue?'#bfe9ff':'#fff';
    for(let i=0;i<7;i++){const yy=g.cy-110+i*36+((i*53)%17),xx=g.standX+50+((i*71)%90);ctx.globalAlpha=0.32*a;ctx.fillRect(xx,yy,W-xx,2);}
  }
  // EXCELLENT：斬撃の通ったあとの地面に 青い炎
  if(blue&&t>=T.launch){
    const fade=1-clamp((t-T.hit-0.15)/0.45,0,1);
    for(let xx=x0;xx<Math.min(W,g.maxX+60);xx+=16){
      const pass=T.launch+(xx-x0)/sp;if(t<pass)continue;
      const a=clamp(1-(t-pass)/0.6,0,1)*fade;if(a<=0)continue;
      blueFlame(xx,g.feet-2,6+7*Math.abs(Math.sin(xx*0.2+G.time*18)),0,xx,a);

  }
  for(let ci=0;ci<cres.length;ci++){

    swCrescent(x,g.cy,h2,w2,col,a);

      for(let i=0;i<6+4*n;i++){const u=(i*0.618)%1;ctx.globalAlpha=(1-u)*a;starPath(x-10-u*90,g.cy+Math.sin(i*12.9)*h2*0.9,2+P*1.5,i+t*6);ctx.fill();}

    if(fa>0){ctx.globalAlpha=fa;ctx.fillStyle=blue?'#bfe9ff':'#fff';ctx.fillRect(0,0,W,H);}   // 画面のフラッシュ
    for(const f of g.list){

      }

      for(let i=0;i<8+4*n;i++){
        const ang2=i*2.399,spd=(90+((i*37)%80))*P,rr=spd*st;
        const x=cx+Math.cos(ang2)*rr*0.8,y=cy+Math.sin(ang2)*rr*0.8+120*st*st,z=(3+(i%3))*P*0.8+1;
        ctx.globalAlpha=Math.max(0,1-st/0.55);
        if(n>=2){starPath(x,y,z*1.5,i+st*6);ctx.fill();}else ctx.fillRect(x-z/2,y-z/2,z,z);
      }
      if(blue&&st<0.7){   // 敵のあしもとから 青い炎の柱
        const fa2=1-st/0.7,fy=cy+Math.min(enemyImgBox(f.def,foeScale(f.def))*0.42,56);
        for(let i=0;i<9;i++){
          const ox=(i-4)*9+Math.sin(i*3.7+G.time*10)*3,hh=(14+10*Math.abs(Math.sin(i*2.9+G.time*14)))*(1+2.2*Math.min(1,st/0.25));
          blueFlame(cx+ox,fy,hh*0.8,0,i,fa2);

      }
    }
  }

}
function drawChargeFx(){
  const fx=TIER_FX[battle.atkTier];if(!fx)return;
  const ch=battle.phase==='charge';
  const u=ch?clamp(battle.t/CHARGE_T,0,1):1;           // ための進み具合 0→1
  const k=ch?1:Math.max(0,1-battle.t/STRIKE_T);          // 発射中は消えていく
  const hx=337,hy=182,col=fx.col;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  // 光のたま
  const r=(34+70*u*fx.pow)*(1+0.05*Math.sin(G.time*22));
  const g=ctx.createRadialGradient(hx,hy,4,hx,hy,r);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=(0.25+0.4*u)*k;ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(hx,hy,r,0,Math.PI*2);ctx.fill();
  // ひろがるリング
  ctx.strokeStyle=col;ctx.lineWidth=3;
  for(let j=0;j<2;j++){
    const v=(battle.t*1.3+j*0.5)%1;
    ctx.globalAlpha=(1-v)*0.8*k*(ch?1:0.5);
    ctx.beginPath();ctx.arc(hx,hy,90-70*v,0,Math.PI*2);ctx.stroke();   // 外から内へ集まる
  }
  // あつまる つぶ
  ctx.fillStyle=col;
  for(let i=0;i<fx.n;i++){
    const v=((battle.t*1.5+i/fx.n)%1);
    const a=i*2.399+v*2.2,rr=150*(1-v)+8;
    const px=hx+Math.cos(a)*rr,py=hy+Math.sin(a)*rr*0.8;
    const sz=(2+3*v)*(0.7+0.5*fx.pow);
    ctx.globalAlpha=Math.min(1,v*1.6)*k;
    ctx.fillRect(px-sz/2,py-sz/2,sz,sz);
  }
  // 上にのぼる光（great以上）
  if(fx.pow>=1){
    ctx.globalAlpha=0.35*u*k;ctx.fillStyle=col;
    for(let j=-2;j<=2;j++){
      const bx=hx+j*14,hh=(60+40*Math.abs(Math.sin(G.time*8+j)))*u;
      ctx.fillRect(bx-2,hy+30-hh,4,hh);
    }
  }
  // 気弾
  if(!ch&&!isPunchMove()){
    const v=clamp(battle.t/STRIKE_T,0,1),e=v*v;
    const tp=foePos(battle.enemy);
    const ox=hx+40,ex2=tp.x;
    for(let j=5;j>=0;j--){
      const vv=Math.max(0,e-j*0.05);
      const x=ox+(ex2-ox)*vv,y=hy+(tp.y-18-hy)*vv;
      ctx.globalAlpha=(1-j/6)*0.9;
      ctx.beginPath();ctx.arc(x,y,(12+10*fx.pow)*(1-j*0.1),0,Math.PI*2);ctx.fillStyle=j===0?'#fff':col;ctx.fill();
    }
  }
  ctx.restore();
}

/* ========== 撃破演出：敵が黒い粉になって上へ消える ========== */
const DUST_STEP=4;          // 粉になる1マスの大きさ(px)
const DUST_SWEEP=0.9;       // 上から下へ崩れていくのにかかる秒数
function startEnemyDust(foe){
  const d=foe.def,fp=foePos(foe),an=battle.enemyAnim+foe.slot*1.1;
  const ex=fp.x,ey=fp.y+Math.round(Math.sin(an*3)*2.5),eScale=foeScale(d);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d',{willReadFrequently:true});
  drawBattleEnemy(c,ex,ey,eScale,d,an);
  const SZ=340,X0=Math.max(0,ex-SZ/2),Y0=Math.max(0,ey-SZ/2);
  let px=null;
  try{px=c.getImageData(X0,Y0,SZ,SZ).data;}catch(err){px=null;}   // file:// 等で読めない場合は楕円で代用
  const cells=[];let ymin=1e9,ymax=-1e9;
  const bw=enemyImgBox(d,eScale)/2+6,bh=bw;   // 代用時の楕円の半径
  for(let y=0;y<SZ;y+=DUST_STEP)for(let x=0;x<SZ;x+=DUST_STEP){
    let has=false;
    if(px){
      for(let yy=0;yy<DUST_STEP&&!has;yy++)for(let xx=0;xx<DUST_STEP;xx++){
        if(px[((y+yy)*SZ+(x+xx))*4+3]>30){has=true;break;}
      }
    }else{
      const dx=(X0+x-ex)/bw,dy=(Y0+y-ey)/bh;
      has=dx*dx+dy*dy<=1;
    }
    if(has){cells.push({x:X0+x,y:Y0+y,t:0});if(Y0+y<ymin)ymin=Y0+y;if(Y0+y>ymax)ymax=Y0+y;}
  }
  const span=Math.max(1,ymax-ymin);
  for(const k of cells)k.t=(k.y-ymin)/span*DUST_SWEEP+Math.random()*0.35;
  cells.sort((a,b)=>a.t-b.t);
  foe.dust={cv:cv,c:c,cells:cells,i:0,t:0,parts:[]};
}
function updateEnemyDust(dt){
  for(const f of battle.foes)updateOneDust(f.dust,dt);
}
function updateOneDust(D,dt){
  if(!D)return;
  D.t+=dt;
  while(D.i<D.cells.length&&D.cells[D.i].t<=D.t){
    const k=D.cells[D.i++];
    D.c.clearRect(k.x,k.y,DUST_STEP,DUST_STEP);
    const n=Math.random()<0.5?1:2;
    for(let j=0;j<n;j++){
      D.parts.push({
        x:k.x+Math.random()*DUST_STEP,y:k.y+Math.random()*DUST_STEP,
        vx:(Math.random()-0.5)*26,vy:-(40+Math.random()*80),
        life:0,max:0.7+Math.random()*0.8,ph:Math.random()*6.28,
        s:Math.random()<0.6?4:2,col:Math.random()<0.65?'#050508':'#3b3550'
      });
    }
  }
  for(const p of D.parts){
    p.life+=dt;p.y+=p.vy*dt;
    p.x+=p.vx*dt+Math.sin(p.life*7+p.ph)*14*dt;
  }
  D.parts=D.parts.filter(p=>p.life<p.max);
}
function drawEnemyDust(D){
  if(!D)return;
  ctx.drawImage(D.cv,0,0);
  ctx.save();
  for(const p of D.parts){
    ctx.globalAlpha=Math.min(1,(1-p.life/p.max)*1.6);
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,p.s,p.s);
  }
  ctx.restore();
}

          const len=Math.hypot(x1-x0,y1-y0);
          for(let d=carry;d<len;d+=16){const k=d/len;const px=lerp(x0,x1,k),py=lerp(y0,y1,k);if(px<W-60)uR(Math.round(px/U)-1,Math.round(py/U)-1,2,2,'#ff9a9a');}
          carry=16-((len-carry)%16);
        }
        if(pose)uText(a.flash>0?'！！':'！',pose.x/U,(pose.y-50)/U,16,'#ffe14d','center','#a00000');
      }
    }else if(a.kind==='ghost'){
      a.cells.forEach((cell,i)=>{
        const x=tileX(cell.c),y=tileY(cell.r);
        if(!a.popped[i]){   // 攻撃位置は ゴーストが消えていくあいだだけ見える。消えたら かくれる
          if(a.phase!=='fade')return;
          const tt=a.t/GH_FADE;
          ctx.save();ctx.globalAlpha=tt<0.7?1:Math.max(0,(1-tt)/0.3);
          warnCell(x,y,TW,TH,pulse,false,WARN_GHOST);
          ctx.restore();return;
        }
        const el=a.t-a.pt[i];
        if(a.phase==='haunt'&&el<0.4){
          const k=1-el/0.4;
          ctx.fillStyle='rgba(200,170,255,'+(0.55*k)+')';ctx.fillRect(x,y,TW,TH);
          const cx=(x+TW/2)/U,cy=(y+TH/2)/U,r=Math.round(6+el*70);
          ctx.globalAlpha=k;
          uBox(cx-r,cy-Math.round(r*0.6),r*2,Math.round(r*1.2),'#e0d0ff');
          ctx.globalAlpha=1;
          if(el<0.34)uText('バァ！',cx,(y-14)/U-Math.round(el*24),12,'#fff','center','#3a0a80');
        }
      });
    }else if(a.kind==='knight'){
      if(a.phase==='warn'){
        const sl=a.slashes[a.i];
        for(const cell of sl.cells)warnCell(tileX(cell.c),tileY(cell.r),TW,TH,pulse,true);
        // 斬撃の通り道（てんてん）
        const len=Math.hypot(sl.p1[0]-sl.p0[0],sl.p1[1]-sl.p0[1]);
        for(let d=0;d<len;d+=14){
          const k=d/len,px=lerp(sl.p0[0],sl.p1[0],k),py=lerp(sl.p0[1],sl.p1[1],k);
          uR(Math.round(px/U)-1,Math.round(py/U)-1,2,2,'#ff9a9a');
        }
        if(a.i===0&&pose)uText('！',pose.x/U,(pose.y-78)/U,16,'#ffe14d','center','#a00000');
      }
      for(const f of a.fx)drawSlashFx(f,tileX,tileY,TW,TH);
    }
  }
}

/* ========== BGM（index.html と同じフォルダに mp3 を置く） ========== */
// dungeon.mp3=ダンジョン / battle.mp3=戦闘 / boss.mp3=ボス戦 / miniboss.mp3=中ボス戦（クマティア）/ win.mp3=勝利 / make.mp3=負け
const MUSIC_FILES={
  dungeon:['dungeon.mp3',true,0.5],
  battle :['battle.mp3',true,0.6],
  boss   :['boss.mp3',true,0.6],
  miniboss:['miniboss.mp3',true,0.6],   // 中ボス「クマティア」専用
  win    :['win.mp3',false,0.7],
  make   :['make.mp3',false,0.7],
  clear  :['win.mp3',false,0.7],
};
const music={cur:null,ready:false,els:{},fade:null};
for(const k in MUSIC_FILES){
  const [src,loop,vol]=MUSIC_FILES[k];
  const a=new Audio();a.preload='auto';a.loop=loop;a.volume=vol;a.src=src;

/* ========== 効果音（判定 nice / good / great / excellent） ==========
   index.html と同じフォルダに se_nice.mp3 / se_good.mp3 / se_great.mp3 / se_excellent.mp3 を置くと、それが鳴ります。
   ファイルが無いときは、内蔵の電子音が鳴ります。 */
const SE_FILES={nice:['se_nice.mp3',0.8],good:['se_good.mp3',0.8],great:['se_great.mp3',0.8],excellent:['se_excellent.mp3',0.9]};
const seEls={};
for(const k in SE_FILES){
  const a=new Audio();a.preload='auto';a.volume=SE_FILES[k][1];
  const o=seEls[k]={a:a,ok:false};
  a.addEventListener('loadeddata',()=>{o.ok=true;});
  a.addEventListener('error',()=>{o.ok=false;o.bad=true;});
  a.src=SE_FILES[k][0];
}
/* ========== 効果音（door / menu / heal / pali / sp / red / blue / attack / damage） ==========
   index.html と同じフォルダに door.mp3 menu.mp3 heal.mp3 pali.mp3 guard.mp3 red.mp3 blue.mp3 attack.mp3 damage.mp3 dark.mp3 を置くと鳴ります。
   連打しても重ならず切れないように、1つの音につき数個ずつ用意して順番に鳴らします。 */
const SFX_FILES={
  door  :['door.mp3',  0.9,3],
  chest :['chest.mp3', 0.9,2],   // 宝箱を開けたとき
  menu  :['menu.mp3',  0.7,3],
  heal  :['heal.mp3',  0.9,2],
  sp    :['sp.mp3',    0.9,4],   // パリィの星が SPゲージに すいこまれたとき
  pali  :['pali.mp3',  0.9,3],
  guard :['guard.mp3', 0.9,3],
  red   :['red.mp3',   0.8,8],   // 太鼓：赤も青も、これを鳴らす
  attack:['attack.mp3',0.9,3],
  damage:['damage.mp3',0.9,3],
  dark  :['dark.mp3',  0.9,2]    // 灯りの消える部屋で、火がぜんぶ消えたとき
};
const sfxPool={};
for(const k in SFX_FILES){
  const [src,vol,n]=SFX_FILES[k];
  const p=sfxPool[k]={els:[],i:0,bad:false};
  for(let j=0;j<n;j++){
    const a=new Audio();a.preload='auto';a.volume=vol;
    a.addEventListener('error',()=>{p.bad=true;});
    a.src=src;p.els.push(a);
  }
}
function playSfx(name,rate,vol){   // 鳴らせたら true（ファイルが無いときは false）。rate=音の高さ（1が元の音）
  const p=sfxPool[name];if(!p||p.bad)return false;
  const a=p.els[p.i];p.i=(p.i+1)%p.els.length;
  try{a.currentTime=0;}catch(e){}
  try{a.volume=Math.min(1,SFX_FILES[name][1]*(vol||1));}catch(e){}
  try{a.preservesPitch=false;a.webkitPreservesPitch=false;a.mozPreservesPitch=false;a.playbackRate=rate||1;}catch(e){}
  playEl(a);
  return true;
}
let sfxSilent=false;   // true のあいだは、同じ操作で menu 音を鳴らさない（回復など、専用の音があるとき）
let _menuLastT=0;
function menuSE(){   // メニュー操作：1回の押下で1回だけ（ごく短い間の二重呼び出しは無視）
  const t=performance.now();
  if(t-_menuLastT<90)return;
  _menuLastT=t;
  playSfx('menu');
}
let seCtx=null;
function unlockSE(){
  for(const k in sfxPool){   // スマホで鳴らせるように、一度だけ無音で再生
    for(const a of sfxPool[k].els){
      a.muted=true;
      let p;try{p=a.play();}catch(e){}
      Promise.resolve(p).then(()=>{a.pause();try{a.currentTime=0;}catch(e){}a.muted=false;}).catch(()=>{a.muted=false;});
    }
  }
  try{
    if(!seCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)seCtx=new AC();}
    if(seCtx&&seCtx.state==='suspended')seCtx.resume();
  }catch(e){}
  for(const k in seEls){   // スマホで鳴らせるように、一度だけ無音で再生
    const a=seEls[k].a;a.muted=true;
    let p;try{p=a.play();}catch(e){}
    Promise.resolve(p).then(()=>{a.pause();try{a.currentTime=0;}catch(e){}a.muted=false;}).catch(()=>{a.muted=false;});
  }
}
function synthSE(tier){
  const ac=seCtx;if(!ac)return;
  try{if(ac.state==='suspended')ac.resume();}catch(e){}
  const seqs={
    nice     :[[660,0,0.14,'triangle']],
    good     :[[660,0,0.10,'triangle'],[880,0.09,0.18,'triangle']],
    great    :[[523,0,0.10,'square'],[659,0.08,0.10,'square'],[784,0.16,0.24,'square']],
    excellent:[[523,0,0.09,'square'],[659,0.07,0.09,'square'],[784,0.14,0.09,'square'],[1047,0.21,0.45,'square'],[2093,0.21,0.30,'triangle']]
  };
  const t0=ac.currentTime;
  for(const [f,dt,dur,type] of seqs[tier]||[]){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0+dt);
    g.gain.exponentialRampToValueAtTime(0.13,t0+dt+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t0+dt);o.stop(t0+dt+dur+0.02);
  }
}
function playSE(tier){
  const o=seEls[tier];
  if(o&&o.ok&&!o.bad){try{o.a.currentTime=0;}catch(e){}playEl(o.a);return;}
  synthSE(tier);
}
function playEl(a){try{const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
// スタートボタンのタップ中に呼ぶ（スマホで音を鳴らせるようにする）
function unlockMusic(){
  unlockSE();
  music.ready=false;
  const jobs=Object.keys(music.els).map(k=>{
    const a=music.els[k];
    a.muted=true;
    let p;try{p=a.play();}catch(e){}
    return Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(r,1500))]).then(()=>{
      if(music.cur!==k){a.pause();try{a.currentTime=0;}catch(e){}}
    }).catch(()=>{}).then(()=>{a.muted=false;});
  });
  Promise.all(jobs).then(()=>{music.ready=true;});
}
function musicWanted(){
  if(G.mode==='dungeon')return 'dungeon';
  if(G.mode==='battle'){
    if(battle.phase==='lose')return 'make';
    if(battle.phase==='win'||battle.phase==='levelup')return 'win';
    if(battle.enemy&&battle.enemy.def&&battle.enemy.def.mid)return 'miniboss';   // 中ボス（クマティア）
    return (battle.enemy&&isBigFoe(battle.enemy.def))?'boss':'battle';
  }
  if(G.mode==='gameover')return 'make';
  if(G.mode==='clear')return 'clear';
  return null;
}
// 勝利BGM → ダンジョンBGM：フェードアウトしてから、フェードイン
const FADE_OUT=0.8,FADE_IN=1.4;
let musicLastT=performance.now();
function cancelMusicFade(){
  const f=music.fade;if(!f)return;
  f.from.pause();f.from.volume=f.fromVol;
  f.to.volume=f.toVol;
  music.fade=null;
}
function tickMusicFade(dt){
  const f=music.fade;if(!f)return;
  f.t+=dt;
  if(f.phase===0){
    const k=Math.min(1,f.t/FADE_OUT);
    f.from.volume=Math.max(0,f.fromVol*(1-k));
    if(k>=1){
      f.from.pause();f.from.volume=f.fromVol;
      f.phase=1;f.t=0;
      f.to.volume=0;playEl(f.to);
    }
  }else{
    const k=Math.min(1,f.t/FADE_IN);
    f.to.volume=f.toVol*k;
    if(k>=1)music.fade=null;
  }
}
function updateMusic(){
  const nowT=performance.now(),dt=Math.min(0.1,(nowT-musicLastT)/1000);musicLastT=nowT;
  if(!music.ready||document.hidden)return;
  tickMusicFade(dt);
  const want=musicWanted();
  if(want===music.cur)return;
  const prev=music.cur;
  cancelMusicFade();
  if(prev==='win'&&want==='dungeon'){   // 戦闘終了：フェードアウト → dungeon フェードイン
    music.cur=want;
    const from=music.els[prev],to=music.els[want];
    to.pause();to.volume=0;   // ダンジョン曲は続きから
    music.fade={from,to,fromVol:MUSIC_FILES[prev][2],toVol:MUSIC_FILES[want][2],phase:from.paused||from.ended?1:0,t:0};
    if(music.fade.phase===1){to.volume=0;playEl(to);}   // 勝利曲がもう終わっていたらすぐフェードイン
    return;
  }
  if(prev)music.els[prev].pause();
  music.cur=want;
  if(!want)return;
  const a=music.els[want];
  a.volume=MUSIC_FILES[want][2];
  // ダンジョン曲は戦闘から戻ったとき続きから。負け／クリア後は最初から
  const resume=want==='dungeon'&&prev&&prev!=='make'&&prev!=='clear';
  if(!resume){try{a.currentTime=0;}catch(e){}}
  playEl(a);
}
document.addEventListener('visibilitychange',()=>{
  const f=music.fade;
  if(f){
    if(document.hidden){f.from.pause();f.to.pause();}
    else playEl(f.phase===0?f.from:f.to);
    return;
  }
  const a=music.cur&&music.els[music.cur];if(!a)return;
  if(document.hidden)a.pause();else if(!a.ended)playEl(a);
});

/* ========== メインループ ========== */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;G.time+=dt;
  ctx.setTransform(RES,0,0,RES,0,0);
  if(G.started){
    if(isTouchDevice){
      const hideTc=(G.mode==='battle'&&['intro','command','attack','charge','strike','attackResult','win','levelup'].includes(battle.phase))||(G.mode==='dungeon'&&bag.open);
      touchControls.classList.toggle('hidden',hideTc);
      touchControls.classList.toggle('dungeonMode',G.mode==='dungeon');
    }
    if(G.mode==='dungeon'){
      updateDungeon(dt);
      if(G.mode==='dungeon')drawDungeon();
      else if(G.mode==='battle')drawBattle();
    }else if(G.mode==='battle'){
      updateBattle(dt);
      drawBattle();
    }else if(G.mode==='gameover'){
      drawGameOver();
    }else if(G.mode==='clear'){
      G.clearT=(G.clearT||0)+dt;
      drawClear(G.clearT);
    }
    updateMusic();
    checkGfx(false);
  }
  for(const k in hit)delete hit[k];
  requestAnimationFrame(frame);
}


/* ========== 中断セーブ ==========
   バッグの「中断」ボタン（キーボードは Q）を2回おすと、いまの冒険をセーブしてタイトルへもどる。
   タイトルの「つづきから」で、そのままの場所から再開できる（ダンジョンの形・敵・宝箱・持ち物ぜんぶ）。
   ・戦闘中・部屋の移動中・ドアが開くとちゅうは中断できない
   ・SUSPEND_ERASE_ON_LOAD が true のあいだは、再開したらセーブデータは消える（本物の「中断」）。
     false にすると、再開してもデータが残る（やり直しOK） */
const SUSPEND_KEY='plusDungeon_suspend_v1';
const SUSPEND_ERASE_ON_LOAD=true;
let runUsed=false;   // 一度でも遊んだ（中断した）あとは、STARTで最初から作りなおす
function suspendStore(){try{return window.localStorage||null;}catch(e){return null;}}
function canSuspend(){
  return !!(G.started&&G.mode==='dungeon'&&!G.fade&&curRoom&&roomList.indexOf(curRoom)>=0&&
    !(curRoom.doorAnim&&Object.keys(curRoom.doorAnim).length)&&!(curRoom.mine&&curRoom.mine.pulled&&!curRoom.mine.done));
}
function serializeRun(){
  // "_" で始まる名前（絵のキャッシュなど）は保存しない。Set は配列にして保存
  const rep=function(k,v){
    if(typeof k==='string'&&k.charAt(0)==='_')return undefined;
    if(v instanceof Set)return{__set:Array.from(v)};
    return v;
  };
  return JSON.stringify({
    v:1,floor:G.floor,time:Date.now(),
    player:player,
    grid:floorRooms.map(r=>r?roomList.indexOf(r):-1),
    cur:roomList.indexOf(curRoom),
    rooms:roomList
  },rep);
}
function parseRun(raw){
  const d=JSON.parse(raw,function(k,v){
    return(v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.__set)&&Object.keys(v).length===1)?new Set(v.__set):v;
  });
  if(!d||d.v!==1||!Array.isArray(d.rooms)||!d.rooms.length||!d.rooms[d.cur]||!d.rooms[d.cur].map||
     !d.player||!Array.isArray(d.grid)||typeof d.floor!=='number')throw new Error('bad save');
  return d;
}
function peekSuspend(){   // タイトルに出す情報（なければ null）
  const st=suspendStore();if(!st)return null;
  try{
    const raw=st.getItem(SUSPEND_KEY);if(!raw)return null;
    const d=parseRun(raw);
    return{floor:d.floor,lv:d.player.lv||1};
  }catch(e){return null;}
}
function refreshContBtn(){
  const info=peekSuspend();
  contBtn.style.display=info?'':'none';
  if(info)contBtn.textContent='⏩ つづきから  (B'+info.floor+'F  Lv'+info.lv+')';
}
function doSuspend(){
  if(!canSuspend())return false;
  const st=suspendStore();
  try{
    if(!st)throw new Error('no storage');
    st.setItem(SUSPEND_KEY,serializeRun());
  }catch(e){
    bag.note='セーブに しっぱいした…';bag.noteT=2.4;
    return false;
  }
  // タイトルへもどる
  G.started=false;runUsed=true;bag.open=false;bag.susT=0;G.bigMap=false;
  if(music.cur&&music.els[music.cur])music.els[music.cur].pause();
  cancelMusicFade();music.cur=null;
  touchControls.classList.add('hidden');
  const hint=startScreen.querySelector('.hint');
  if(hint)hint.dataset.keep=hint.dataset.keep||hint.textContent;
  startScreen.classList.remove('hidden');
  refreshContBtn();
  return true;
}
function bagSuspend(){
  if(!canSuspend()){bag.note='いまは 中断できない';bag.noteT=2.0;return;}
  if(bag.susT>0){doSuspend();return;}
  bag.susT=3.0;bag.note='もういちど おすと セーブして タイトルへ';bag.noteT=3.0;
}
function loadSuspend(){   // 成功したら true
  const st=suspendStore();if(!st)return false;
  let d;
  try{d=parseRun(st.getItem(SUSPEND_KEY));}catch(e){return false;}
  try{
    roomList=d.rooms;
    floorRooms=d.grid.map(i=>(i>=0&&roomList[i])?roomList[i]:null);
    for(const r of roomList){   // 念のため：Set がこわれていたら作りなおす
      if(!(r.cellSet instanceof Set))r.cellSet=new Set(Array.isArray(r.cellSet)?r.cellSet:[]);
      r.entities=r.entities||[];r.torches=r.torches||[];
    }
    Object.assign(player,d.player);
    player.moveLv=player.moveLv||{};player.items=player.items||{};
    player.moving=false;
    G.floor=d.floor;G.mode='dungeon';
    bag.open=false;bag.susT=0;G.bigMap=false;G.fade=null;
    enterRoom(roomList[d.cur]);
    prebuildRooms(roomList);
    snapCamera();
    G.msg={text:'B'+G.floor+'F  つづきから さいかい！'};G.msgT=2.4;
  }catch(e){return false;}
  if(SUSPEND_ERASE_ON_LOAD){try{st.removeItem(SUSPEND_KEY);}catch(e){}}
  return true;
}
function newRun(){   // さいしょから（ゲームオーバー後と同じ状態）
  player.maxHp=45;player.hp=45;
  player.sp=player.maxSp=50;
  player.lv=1;player.exp=0;player.up={hp:1,sp:1,atk:1,g:1};
  player.moves=['きあいパンチ'];player.moveLv={};player.items={'チョコケーキ':2};
  player.moving=false;
  G.floor=1;initDungeon();
}

/* ========== スタート / 全画面 / 横画面 / タッチ ========== */
const startScreen=document.getElementById('startScreen');
const startBtn=document.getElementById('startBtn');
const contBtn=document.getElementById('contBtn');
const touchControls=document.getElementById('touchControls');
const isTouchDevice=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
/* ========== デバッグ開始（⚙️ → ID入力）==========
   9F・Lv6・技（9Fまでの分）・ステ振り（攻撃2・ガード3）の状態で始める */
const DEBUG_ID='9sayakadaisuki';
const DEBUG_FLOOR=15, DEBUG_LV=9;
const DEBUG_HP_PTS=3, DEBUG_ATK_PTS=4, DEBUG_G_PTS=4;
function setupDebugRun(){
  const HP_LV =1+DEBUG_HP_PTS;   // =4
  const ATK_LV=1+DEBUG_ATK_PTS;
  const G_LV  =1+DEBUG_G_PTS;
  player.up={hp:HP_LV, sp:1, atk:ATK_LV, g:G_LV};
  player.maxHp=45+8*(HP_LV-1);   // =69
  player.hp=player.maxHp;
  player.sp=player.maxSp=50;
  player.lv=DEBUG_LV;player.exp=0;
  player.moves=['きあいパンチ','きあいのいっぱつ','シャイニング','なぎはらい','りゅうせい'];
  player.moveLv={};
  player.items={'クッキー':2,'カウンター':20,'シールド':2,'かんしゃく':2,'ハンバーガー':20,'強化メダル':2};
  G.floor=DEBUG_FLOOR;initDungeon();
}
const debugGear=document.getElementById('debugGear');
const debugPanel=document.getElementById('debugPanel');
const debugId=document.getElementById('debugId');
const debugErr=document.getElementById('debugErr');
debugGear.addEventListener('click',()=>{
  debugPanel.classList.toggle('open');debugErr.textContent='';
  if(debugPanel.classList.contains('open'))debugId.focus();
});
debugId.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')tryDebugStart();});
debugId.addEventListener('keyup',e=>e.stopPropagation());
document.getElementById('debugGo').addEventListener('click',tryDebugStart);
function tryDebugStart(){
  if(debugId.value.trim()===DEBUG_ID){debugId.blur();beginGame(true);}
  else debugErr.textContent='IDが ちがいます';
}
startBtn.addEventListener('click',()=>beginGame(false));
contBtn.addEventListener('click',()=>beginGame(false,true));
async function beginGame(debug,cont){
  unlockMusic();
  try{
    const el=document.documentElement;
    if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    else if(el.webkitRequestFullScreen)el.webkitRequestFullScreen();
  }catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  if(cont){
    if(!loadSuspend()){   // よみこめなかった
      const st=suspendStore();try{if(st)st.removeItem(SUSPEND_KEY);}catch(e){}
      refreshContBtn();
      const hint=startScreen.querySelector('.hint');
      if(hint)hint.textContent='中断データを よみこめませんでした';
      return;
    }
  }else{
    if(runUsed)newRun();   // 中断のあとは さいしょから作りなおす
    if(debug)setupDebugRun();
  }
  startScreen.classList.add('hidden');
  G.started=true;
  if(isTouchDevice)touchControls.classList.remove('hidden');
  resizeCanvas();
}
addEventListener('resize',()=>resizeCanvas());
addEventListener('orientationchange',()=>{setTimeout(()=>resizeCanvas(),220);});
/* ===== スマホ：画面のどこをタップしても 全画面 ＋ 横画面（ダンジョン中でも） =====
   全画面でない／縦向きのときだけ、タップのたびにもういちど試す（ゲームの操作はじゃましない） */
let fsBusy=false;
async function goFullscreenLandscape(){
  if(fsBusy)return;fsBusy=true;
  try{
    const el=document.documentElement;
    const inFs=document.fullscreenElement||document.webkitFullscreenElement;
    if(!inFs){
      if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
      else if(el.webkitRequestFullScreen)el.webkitRequestFullScreen();
    }
  }catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  fsBusy=false;
}
if(isTouchDevice){
  const tapFs=()=>{
    const inFs=document.fullscreenElement||document.webkitFullscreenElement;
    const portrait=window.innerHeight>window.innerWidth;
    if(!inFs||portrait)goFullscreenLandscape();
  };
  addEventListener('pointerup',tapFs,{capture:true,passive:true});
  addEventListener('click',tapFs,{capture:true,passive:true});
  const hint=document.querySelector('#startScreen .hint');
  if(hint)hint.textContent='※ 画面をタップすると 全画面・横画面になります';
}
function resizeCanvas(){
  const aspect=W/H;const vw=window.innerWidth,vh=window.innerHeight;
  let cw,ch;
  if(vw/vh>aspect){ch=vh;cw=ch*aspect;}
  else{cw=vw;ch=cw/aspect;}
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=window.devicePixelRatio||1;
  RES=Math.max(1,Math.min(3,Math.ceil(cw*dpr/W-0.05)));
  if(cv.width!==W*RES){cv.width=W*RES;cv.height=H*RES;}
}
resizeCanvas();
function bindButton(btn){
  const key=btn.dataset.key;
  const downFn=e=>{
    e.preventDefault();
    if(btn.setPointerCapture){try{btn.setPointerCapture(e.pointerId);}catch(err){}}
    if(!down[key])hit[key]=true;
    down[key]=true;btn.style.transform='scale(.92)';
  };
  const upFn=e=>{e.preventDefault();down[key]=false;btn.style.transform='';};
  btn.addEventListener('pointerdown',downFn);
  btn.addEventListener('pointerup',upFn);
  btn.addEventListener('pointercancel',upFn);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
document.querySelectorAll('#touchControls [data-key]').forEach(bindButton);


/* ===== タップ操作：指を離したときに、押した場所と同じボタンなら決定 ===== */
let pend=null;
function tapTargets(){
  if(G.mode==='dungeon'){
    if(G.bigMap)return{ctx:'map',list:[{x:0,y:0,w:480,h:270,fn:()=>{G.bigMap=false;}}]};
    if(bag.open)return{ctx:'bag'+bag.tab,list:bagHits};
    return{ctx:'dg',list:[
      {x:6,y:6,w:44,h:40,fn:openBag},
      {x:422,y:6,w:54,h:33,fn:()=>{G.bigMap=true;}},
      {x:AB_LEFT.x,y:AB_LEFT.y-2,w:AB_LEFT.w,h:AB_LEFT.h+4,fn:()=>{G.bigMap=true;menuSE();}},
      {x:AB_RIGHT.x,y:AB_RIGHT.y-2,w:AB_RIGHT.w,h:AB_RIGHT.h+4,fn:()=>{if(!tryOpenChest()&&!tryPullLever())tryOpenDoor();}}]};
  }
  if(G.mode==='battle'&&battle.phase==='win')return{ctx:'win',list:[{x:0,y:0,w:480,h:270,fn:winAdvance}]};
  if(G.mode==='battle'&&battle.phase==='levelup')return{ctx:'lv',list:uiHits};
  if(G.mode==='battle'&&battle.phase==='command')return{ctx:'bt'+battle.sub,list:uiHits};
  return null;
}
function topHit(list,ux,uy){
  for(let i=list.length-1;i>=0;i--){
    const h=list[i];
    if(ux>=h.x&&ux<h.x+h.w&&uy>=h.y&&uy<h.y+h.h)return h;
  }
  return null;
}
const hitKey=h=>h.x+','+h.y+','+h.w+','+h.h;
function tapPos(e){
  const r=cv.getBoundingClientRect();
  return[(e.clientX-r.left)/r.width*W/U,(e.clientY-r.top)/r.height*H/U];
}
cv.addEventListener('pointerdown',e=>{
  if(!G.started)return;
  const[ux,uy]=tapPos(e);
  if(G.mode==='battle'&&battle.phase==='attack'){   // 太鼓は押した瞬間に反応
    if(uy>=175){if(ux<240)hit['KeyA']=true;else hit['KeyD']=true;e.preventDefault();}
    return;
  }
  const t=tapTargets();pend=null;
  if(!t)return;
  e.preventDefault();
  const h=topHit(t.list,ux,uy);
  if(h)pend={ctx:t.ctx,key:hitKey(h),id:e.pointerId};
});
cv.addEventListener('pointerup',e=>{
  const p=pend;pend=null;
  if(!p||!G.started)return;
  const t=tapTargets();
  if(!t||t.ctx!==p.ctx)return;
  const[ux,uy]=tapPos(e);
  const h=topHit(t.list,ux,uy);
  if(h&&hitKey(h)===p.key){e.preventDefault();sfxSilent=false;h.fn();if(!sfxSilent)menuSE();}
});
cv.addEventListener('pointercancel',()=>{pend=null;});

/* ========== 起動 ========== */
initDungeon();
G.started=false;
refreshContBtn();
requestAnimationFrame(frame);

})();
</script>
