/* 開けたあとのアイテム演出：真っ白 → 少し上へ → じわっと本来の色に。名前はアイコンの上。消えるときは同時 */
const REV_RISE=0.9, REV_DUR=2.6, REV_OUT=0.4, REV_SIZE=46, REV_UP=46;
const _revCache={};
function revealIcon(file,emoji){
  const img=file?bagImg(file):null;
  const key=img?('i:'+file):('e:'+emoji);
  let o=_revCache[key];
  if(!o){
    const w=img?img.width:64,h=img?img.height:64;
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');
    if(img)g.drawImage(img,0,0);
    else{g.font='52px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(emoji,32,34);}
    const sc=document.createElement('canvas');sc.width=w;sc.height=h;
    const sg=sc.getContext('2d');sg.drawImage(c,0,0);
    sg.globalCompositeOperation='source-in';sg.fillStyle='#fff';sg.fillRect(0,0,w,h);
    o=_revCache[key]={col:c,sil:sc};
  }
  return o;
}
function drawChestReveal(e){
  const r=e.rev;if(!r)return;
  const t=(performance.now()-r.t0)/1000;
  if(t>=REV_DUR){e.rev=null;return;}
  const out=clamp((REV_DUR-t)/REV_OUT,0,1);          // 消えるのは アイコンも名前も同時
  const inA=clamp(t/0.12,0,1);
  const p=clamp(t/REV_RISE,0,1),ease=1-(1-p)*(1-p);
  const mix=clamp((t-0.12)/(REV_RISE+0.2),0,1);      // 0=真っ白 → 1=本来の色
  const cx=e.x*CAM_Z-camX,cy=e.y*CAM_Z-camY;
  const iy=cy-10-ease*REV_UP;                         // 宝箱の口から、少しだけ上へ
  const o=revealIcon(r.file,r.emoji);
  const sc=Math.min(REV_SIZE/o.col.width,REV_SIZE/o.col.height),dw=o.col.width*sc,dh=o.col.height*sc;
  ctx.save();
  ctx.globalAlpha=Math.min(inA,out);
  {  // ふわっとした光
    const gr=ctx.createRadialGradient(cx,iy,2,cx,iy,REV_SIZE);
    gr.addColorStop(0,'rgba(255,255,255,'+(0.55*(1-mix)+0.2)+')');gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,iy,REV_SIZE,0,7);ctx.fill();
  }
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(o.sil,cx-dw/2,iy-dh/2,dw,dh);                       // 真っ白のシルエット
  ctx.globalAlpha=Math.min(inA,out)*mix;
  ctx.drawImage(o.col,cx-dw/2,iy-dh/2,dw,dh);                       // 色が じわっと乗る
  ctx.restore();
  const na=clamp((t-REV_RISE)/0.3,0,1)*out;                           // 名前：アイコンが出きってから
  if(na>0){
    ctx.save();ctx.globalAlpha=na;
    ctx.font='bold 15px DotGothic16,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(r.name).width+22,ny=iy-dh/2-16;
    ctx.fillStyle='rgba(20,4,48,0.88)';roundRect(ctx,cx-w/2,ny-12,w,24,12);ctx.fill();
    ctx.strokeStyle='#d8b8ff';ctx.lineWidth=1.5;roundRect(ctx,cx-w/2,ny-12,w,24,12);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillText(r.name,cx,ny+1);
    ctx.restore();
  }
}

    const lit=i/(STEPS-1);            // 高い段ほど明るい
    // まえの面（暗め）
    const fr=c.createLinearGradient(0,yb-3,0,yb);
    fr.addColorStop(0,`rgb(${Math.round(110+lit*30)},${Math.round(150+lit*30)},${Math.round(200+lit*20)})`);
    fr.addColorStop(1,`rgb(${Math.round(70+lit*25)},${Math.round(105+lit*25)},${Math.round(160+lit*20)})`);
    c.fillStyle=fr;c.fillRect(-FX,yb-3,FX*2,3);
    // 上の面（明るい）
    c.fillStyle=`rgb(${Math.round(190+lit*45)},${Math.round(225+lit*20)},255)`;
    c.fillRect(-FX,yb-6,FX*2,3);
    // 段のふちのハイライトと影
    c.fillStyle='rgba(255,255,255,0.8)';c.fillRect(-FX,yb-6,FX*2,1);
    c.fillStyle='rgba(20,40,90,0.45)';c.fillRect(-FX,yb-1,FX*2,1);
  }
  // 一番上の段が ほんのり光る
  c.fillStyle=`rgba(200,245,255,${0.18+0.22*pulse})`;
  c.fillRect(-FX,14-(STEPS-1)*SH-6,FX*2,3);
  // 上へのぼるキラキラ
  const rnd=mulberry32(Math.floor(t*30));
  for(let i=0;i<3;i++){
    const r=rnd();
    const px=(r-0.5)*22;
    const ph=(t*18+i*9)%26;
    const py=-6-ph*0.6;
    const a=1-ph/26;
    c.fillStyle=`rgba(190,235,255,${a*0.7})`;
    c.fillRect(Math.round(px),Math.round(py),2,2);
  }
  c.restore();
}

function pxWidth(str){let w=-1;for(const ch of str){const g=PXG[ch];if(g)w+=g[0].length+1;}return w;}
function pxText(str,x,y,col,align){   // x,y は整数のUI座標（1マス＝1ドット）

  let X=x;if(align==='center')X=Math.round(x-w/2);else if(align==='right')X=x-w;

      if(gl[r][c]==='X')ctx.fillRect((X+c)*U,(y+r)*U,U,U);

  }
}

// room の形を (ox,oy) から 1マス=sc px で描く。cur=true なら現在地の印も描く
const m0w=r=>r.map[0].length,m0h=r=>r.map.length;
const MAP_COL={stairs:'#22d8ff',chest:'#ffe14d',enemy:'#ff2a2a'};   // マップ上の印の色
function drawRoomShape(room,ox,oy,sc,cur,mini){
  const m=room.map,PINK='#ff6df0',WH='#fff',RW=m0w(room),RH=m0h(room);
  const pink=(x,y)=>x>=0&&y>=0&&x<RW&&y<RH&&(m[y][x]===0||m[y][x]===2||m[y][x]===13||m[y][x]===15);
  const dot=Math.max(1,sc-1);
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!pink(x,y))continue;
    const px=ox+x*sc,py=oy+y*sc;
    let col=PINK;
    if(isDoorTile(m,x,y)){
      const d=x<1?'l':x>RW-2?'r':y<2?'u':'d';
      const dd=DIRS.find(q=>q[0]===d);
      const n=roomAt(room.cx+dd[1],room.cy+dd[2]);
      col=(n&&n.visited)?PINK:'#a45ad8';
    }
    uR(px,py,sc,sc,col);
  }
  // 白いフチ
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!pink(x,y))continue;
    const px=ox+x*sc,py=oy+y*sc;
    if(!pink(x,y-1))uR(px,py-1,sc,1,WH);
    if(!pink(x,y+1))uR(px,py+sc,sc,1,WH);
    if(!pink(x-1,y))uR(px-1,py,1,sc,WH);
    if(!pink(x+1,y))uR(px+sc,py,1,sc,WH);
  }
  // 柱（中は黒、まわりは白）
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(m[y][x]!==3)continue;
    const px=ox+x*sc,py=oy+y*sc;
    uR(px,py,sc,sc,'#1a0733');
  }
  // かいだん・たからばこ・げんざいち
  // ピンクの床の上でも見えるように、こい色のふち付きで少し大きめに描く（てき→たからばこ→かいだん の順に重ねる）
  // mini=true（右上の常時ミニマップ）のときは、プレイヤーの■と同じサイズ・ふちなしで描く
  const pms=sc>=3?dot+(sc>3?1:0):2,pmo=sc>=3?0:Math.round((pms-sc)/2);
  const mark=(gx,gy,col,extra)=>{
    if(mini){uR(ox+gx*sc-pmo,oy+gy*sc-pmo,pms,pms,col);return;}
    const z=(sc>=4?sc:3)+(extra||0);
    const px=Math.round(ox+gx*sc+sc/2-z/2),py=Math.round(oy+gy*sc+sc/2-z/2);
    uR(px-1,py-1,z+2,z+2,'#1a0733');uR(px,py,z,z,col);
  };
  for(const e of room.entities)if(e.type==='enemy')mark(Math.floor(e.x/TILE),Math.floor(e.y/TILE),MAP_COL.enemy,(e.def.isBoss||e.def.mid)?1:0);
  for(const e of room.entities)if(e.type==='chest'&&!e.opened)mark(e.gx,e.gy,MAP_COL.chest);
  for(const e of room.entities)if(e.type==='stairs')mark(e.gx,e.gy,MAP_COL.stairs);
  if(cur){
    const gx=clamp(Math.floor(player.x/TILE),0,RW-1),gy=clamp(Math.floor(player.y/TILE),0,RH-1);
    const ms=sc>=3?dot+(sc>3?1:0):2,mo=sc>=3?0:Math.round((ms-sc)/2);
    uR(ox+gx*sc-mo,oy+gy*sc-mo,ms,ms,Math.floor(G.time*3)%2?'#fff':'#2a1a6a');
  }
}

// 全体マップ用：部屋を入れる枠（広い部屋は縮尺を半分にして、枠の中央に置く）
function uWidth(str,size){ctx.save();ctx.font=(size*U)+'px '+PIXFONT;const w=ctx.measureText(str).width/U;ctx.restore();return w;}
function mapBox(r,cx,cy,cw,ch,sBase){
  const RW=rmW(r),RH=rmH(r);
  const s=isBigRoom(r)?Math.max(1,Math.floor(sBase/2)):sBase;
  const w=RW*s,h=RH*s;
  return{s,w,h,ox:cx+Math.floor((cw-w)/2),oy:cy+Math.floor((ch-h)/2)};
}
function drawBigMap(){
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  const sc=4,cw=ROOM_W*sc,ch=ROOM_H*sc,gap=12,mw=GRID_W*cw+(GRID_W-1)*gap,mh=GRID_H*ch+(GRID_H-1)*gap;
  const ox=Math.round((480-mw)/2),oy=Math.round((270-mh)/2)+2;
  uText('MAP   B'+G.floor+'F',240,oy-30,12,'#fff','center');
  uR(ox-12,oy-12,mw+24,mh+24,'#000');uBox(ox-12,oy-12,mw+24,mh+24,'#fff');
  const cellX=r=>ox+r.cx*(cw+gap),cellY=r=>oy+r.cy*(ch+gap);
  // まだ入っていない部屋は「？」なので、枠いっぱいの大きさとして扱う（大きさがばれないように）
  const boxOf=r=>r.visited?mapBox(r,cellX(r),cellY(r),cw,ch,sc):{s:sc,w:cw,h:ch,ox:cellX(r),oy:cellY(r)};
  // つながり：こちらの出口の中心 → 相手の出口の中心 を、途中でカギ型にずらして結ぶ（部屋の大きさが違ってもつながる）
  for(const r of roomList){
    if(!r.known)continue;
    const A=boxOf(r);
    if(r.doors.r){
      const n=roomAt(r.cx+1,r.cy);
      if(n&&n.known){
        const B=boxOf(n),t=2*Math.min(A.s,B.s),c=(r.visited&&n.visited)?'#ff6df0':'#a45ad8';
        const y1=A.oy+5*A.s,y2=B.oy+5*B.s,x1=A.ox+A.w,x2=B.ox,xm=Math.round((x1+x2)/2);
        uR(x1,y1-t/2,xm-x1+t/2,t,c);
        uR(xm-t/2,Math.min(y1,y2)-t/2,t,Math.abs(y2-y1)+t,c);
        uR(xm-t/2,y2-t/2,x2-xm+t/2,t,c);
      }
    }
    if(r.doors.d){
      const n=roomAt(r.cx,r.cy+1);
      if(n&&n.known){
        const B=boxOf(n),t=2*Math.min(A.s,B.s),c=(r.visited&&n.visited)?'#ff6df0':'#a45ad8';
        const x1=A.ox+8*A.s,x2=B.ox+8*B.s,y1=A.oy+A.h,y2=B.oy,ym=Math.round((y1+y2)/2);
        uR(x1-t/2,y1,t,ym-y1+t/2,c);
        uR(Math.min(x1,x2)-t/2,ym-t/2,Math.abs(x2-x1)+t,t,c);
        uR(x2-t/2,ym-t/2,t,y2-ym+t/2,c);
      }
    }
  }
  for(const r of roomList){
    if(!r.known)continue;
    const x=cellX(r),y=cellY(r);
    if(r.visited){const bx=boxOf(r);drawRoomShape(r,bx.ox,bx.oy,bx.s,r===curRoom);}
    else{uR(x+cw/2-6,y+ch/2-6,12,12,'#8a55c8');uR(x+cw/2-5,y+ch/2-5,10,10,'#1a0733');uText('?',x+cw/2,y+ch/2-5,9,'#c9a4f5','center');}
  }
  {  // 凡例（色の四角＋ことば）
    const items=[['#fff','いまいるばしょ'],[MAP_COL.stairs,'かいだん'],[MAP_COL.chest,'たからばこ'],[MAP_COL.enemy,'てき']];
    const ws=items.map(it=>uWidth(it[1],8)),SW=5,G1=3,G2=12;
    let tot=G2*(items.length-1);for(const w of ws)tot+=SW+G1+w;
    let lx=Math.round(240-tot/2);const ly=oy+mh+22;
    items.forEach((it,i)=>{
      uR(lx-1,ly+1,SW+2,SW+2,'#1a0733');uR(lx,ly+2,SW,SW,it[0]);
      uText(it[1],lx+SW+G1,ly,8,'#cfc8ff','left');
      lx+=SW+G1+ws[i]+G2;
    });
  }
  uText('A / B / タップ で とじる',240,oy+mh+36,8,'#8a7fc0','center');
}

  if(bag.tab===1)return player.moves.slice();

}
function setBagTab(t){bag.tab=(t+BAG_TABS)%BAG_TABS;bag.idx=0;bag.confirmT=0;bag.noteT=0;bag.mode=0;}
function bagCancelMedal(){bag.mode=0;bag.idx=0;bag.confirmT=0;bag.noteT=0;}
function bagUseKey(){   // 強化メダル → わざ選択へ
  const k=bagList()[bag.idx];if(!k||!ITEM_DB[k])return;
  if(ITEM_DB[k].kind==='medal'){bag.mode=1;bag.idx=0;bag.confirmT=0;bag.note='どの わざを きょうかする？';bag.noteT=3;}
}
function medalApply(){   // 2回おすと きょうか
  const name=player.moves[bag.idx];if(!name)return;
  const lv=moveLv(name);
  if(lv>=MOVE_LV_MAX){bag.note='これいじょう きょうかできない';bag.noteT=1.8;return;}
  if(!(player.items['強化メダル']>0)){bagCancelMedal();return;}
  if(bag.confirmT>0&&bag.confirmKey===name){
    player.items['強化メダル']--;
    player.moveLv[name]=lv+1;
    bag.confirmT=0;bag.note=name+' を きょうかした！';bag.noteT=2.4;
    if(!(player.items['強化メダル']>0)){bag.mode=0;bag.idx=0;}   // メダルが なくなったら もどる
  }else{
    bag.confirmKey=name;bag.confirmT=2.2;bag.note='もういちど おすと きょうかする';bag.noteT=2.2;
  }
}
function bagUse(){
  if(bag.mode===1){medalApply();return;}
  if(bag.tab!==0)return;
  const k=bagList()[bag.idx];if(!k)return;
  if(ITEM_DB[k].kind==='medal')bagUseKey();else useBagItem(bag.idx);
}
function bagDiscard(){   // 2回おすと 1こ すてる
  if(bag.tab!==0||bag.mode!==0)return;
  const k=bagList()[bag.idx];if(!k||ITEM_DB[k].kind==='medal')return;
  if(bag.confirmT>0&&bag.confirmKey===k){
    player.items[k]--;bag.confirmT=0;
    bag.note=k+' を すてた';bag.noteT=1.6;
    const n=bagList().length;bag.idx=clamp(bag.idx,0,Math.max(0,n-1));
  }else{
    bag.confirmKey=k;bag.confirmT=2.2;bag.note='もういちど おすと すてます';bag.noteT=2.2;
  }
}
function useBagItem(i){
  const keys=bagList();const k=keys[i];if(!k)return;
  const it=ITEM_DB[k];
  if(it.kind==='rage'||it.kind==='shield'||it.kind==='holm'||it.kind==='counter'){bag.note='せんとうちゅうしか つかえない';bag.noteT=1.8;return;}
  if(it.kind==='heal'){
    if(player.hp>=player.maxHp){bag.note='HPは まんたんだ！';bag.noteT=1.6;return;}
    const heal=Math.min(it.value,player.maxHp-player.hp);
    player.hp+=heal;player.items[k]--;
    bag.note=k+' を つかった！  HP +'+heal;bag.noteT=1.8;
  }else if(it.kind==='hpsp'){
    if(player.hp>=player.maxHp&&player.sp>=player.maxSp){bag.note='HPも SPも まんたんだ！';bag.noteT=1.6;return;}
    const h=Math.min(it.hp,player.maxHp-player.hp),g=Math.min(it.sp,player.maxSp-player.sp);
    player.hp+=h;player.sp+=g;player.items[k]--;
    bag.note=k+' を つかった！  HP +'+h+'  SP +'+g;bag.noteT=1.8;
  }else if(it.kind==='maxhp'){
    player.maxHp+=it.value;player.hp+=it.value;player.items[k]--;
    bag.note='さいだいHP +'+it.value+'！';bag.noteT=1.8;
  }else if(it.kind==='sp'){
    if(player.sp>=player.maxSp){bag.note='SPは まんたんだ！';bag.noteT=1.6;return;}
    const g=Math.min(it.value,player.maxSp-player.sp);
    player.sp+=g;player.items[k]--;
    bag.note=k+' を つかった！  SP +'+g;bag.noteT=1.8;
  }
  const n=bagList().length;bag.idx=clamp(bag.idx,0,Math.max(0,n-1));
}
function updateBag(dt){
  if(bag.noteT>0)bag.noteT-=dt;
  if(bag.confirmT>0)bag.confirmT-=dt;
  if(bag.susT>0)bag.susT-=dt;
  if(hit['KeyQ']){bagSuspend();menuSE();return;}   // Q : 中断セーブ（2回おす）
  const n=bagList().length;
  const UP=hit['ArrowUp']||hit['KeyW'],DN=hit['ArrowDown']||hit['KeyS'];
  const LF=hit['ArrowLeft']||hit['KeyA'],RT=hit['ArrowRight']||hit['KeyD'];
  const OK=hit['KeyZ']||hit['Enter']||hit['Space'];
  const BACK=hit['KeyX']||hit['Escape']||hit['Tab']||hit['Backspace']||hit['KeyI'];
  if(UP)setBagTab(bag.tab-1);
  else if(DN)setBagTab(bag.tab+1);
  else if(n>0){if(LF)bag.idx=(bag.idx+n-1)%n;if(RT)bag.idx=(bag.idx+1)%n;}
  if(OK&&n>0)bagUse();
  if(hit['KeyC'])bagDiscard();
  if(BACK){if(bag.mode===1)bagCancelMedal();else bag.open=false;}
  if(UP||DN||(n>0&&(LF||RT||OK))||(hit['KeyC']&&bag.tab===0)||BACK)menuSE();   // バッグ操作
}

/* 選択カーソル：モニター画像の縁に沿った赤枠(角がまるく、下の台座へ向かって細くなる)。形は手書きで固定 */
const STAT_CW=54,STAT_COY=202;   // 枠の幅(中心から左右27)・上端のy

let STAT_RUNS=null;
function drawStatCursor(k,mx){
  if(!STAT_RUNS){
    const H=STAT_INS.length,W=STAT_CW,runs=[];
    const ins=(r,c)=>r>=0&&r<H&&c>=STAT_INS[r]&&c<W-STAT_INS[r];
    for(let r=0;r<H;r++){
      let s0=-1;
      for(let c=0;c<=W;c++){
        let edge=false;
        if(c<W&&ins(r,c)){   // 形の内がわで、2マス以内に外があれば 枠(はば2)
          for(let dy=-2;dy<=2&&!edge;dy++)for(let dx=-2;dx<=2&&!edge;dx++)if(Math.abs(dx)+Math.abs(dy)<=2)edge=!ins(r+dy,c+dx);
        }
        if(edge&&s0<0)s0=c;
        if(!edge&&s0>=0){runs.push([s0,r,c-s0]);s0=-1;}
      }
    }
    STAT_RUNS=runs;
  }
  const ox=mx-STAT_CW/2;
  for(const q of STAT_RUNS)uR(ox+q[0],STAT_COY+q[1],q[2],1,'#ff2a2a');

/* ========== 同時バトル（同じ種類の敵が2匹いっしょに出る） ==========
   テスト設定：2階以上で スライム／コウモリ と戦うとき、DUO_CHANCE の確率で2匹になる。
   数字をいじればバランス調整できる。ボス戦では起こらない。 */
const DUO_FLOOR_MIN=2;              // 何階から起こるか
const DUO_CHANCE=0.5;               // 2匹になる確率（テスト：50%）
const DUO_SHAPES=['slime','bat'];   // 2匹になる敵の種類
const FOE_POS=[{x:745,y:214},{x:655,y:160}];   // A：ふつうより少し後ろ（右）／B：ふつうより少し前（左）で上

/* 階層ごとの同時バトル設定（上から順に見て、最初に当てはまったものだけ使う）
   from〜to … 出る階 ／ shape … 戦う敵 ／ extra … 同時に出てくる敵 ／ chance … 確率 */
const DUO_RULES=[
  {from:14,to:14,   shape:'wizard',extra:'wizard',chance:0.50},   // 14F：ウィザード → ウィザードも
  {from:11,to:99,   shape:'knight',extra:'slime', chance:0.33},   // 11F〜：ナイト → スライムも
  {from:11,to:99,   shape:'wizard',extra:'golem', chance:0.33},   // 11F〜：ウィザード → ゴーレムも
  {from:11,to:99,   shape:'ghost', extra:'ghost', chance:0.50},   // 11F〜：ゴースト → ゴーストも
];
function duoRule(d,floor){
  return DUO_RULES.find(r=>floor>=r.from&&floor<=r.to&&r.shape===d.shape&&ENEMY_DB[r.extra])||null;
}
function foePos(f){return battle.duo?FOE_POS[f.slot]:{x:D_ENEMY_X,y:D_ENEMY_Y};}
function foeHome(f){return foePos(f||{slot:0});}
function aliveFoes(){return battle.foes.filter(f=>!f.dead);}

function foeNames(){const al=aliveFoes();return al.length>1?al[0].def.name+'たち':(al[0]||battle.enemy).name;}
function introText(){return battle.foes.map(f=>f.name).join(' と ');}

function asFoe(f,fn){
  const pe=battle.enemy,pd=battle.enemyDef,n0=battle.attacks.length;
  battle.enemy=f;battle.enemyDef=f.def;
  fn();
  for(let i=n0;i<battle.attacks.length;i++)battle.attacks[i].foe=f;
  battle.enemy=pe;battle.enemyDef=pd;
}

function expFor(def){
  if(def.isBoss)return 0;   // ラスボスはクリアなので経験値なし
  if(def.mid)return 3;      // クマティア
  switch(def.name){
    case 'スライム':case 'コウモリ':return 1;
    case 'ウィザード':case 'ゴーレム':case 'ゴースト':case 'ナイト':case 'バケブーム':return 2;
    case 'クビ・ガリ':return 3;
  }

}
function makeFoe(def,entity,slot,name){

    def:def,entity:entity,slot:slot,hurt:0,dead:false,dust:null,pose:null};
}
function setBattleEnemy(entity,extraDef){
  const def=entity.def;
  battle.duo=!!extraDef;

  if(extraDef)battle.foes.push(makeFoe(extraDef,{type:'enemy',virtual:true,def:extraDef},1,extraDef.name+FOE_TAG[1]));
  setTarget(battle.foes[0]);
  flushStars();battle.bonusExp=0;battle.expAcc=0;battle.dropKit=0;battle.atkNote='';battle.bossAwoke=false;battle.rage=false;battle.shield=false;battle.counter=false;battle.holm=0;

function startBattle(entity){

  const rule=(!d.isBoss&&!d.mid&&!d.solo)?duoRule(d,G.floor):null;
  if(rule){
    if(Math.random()<rule.chance)extra=scaleEnemy(ENEMY_DB[rule.extra],G.floor);
  }else if(!d.isBoss&&!d.solo&&G.floor>=DUO_FLOOR_MIN&&DUO_SHAPES.indexOf(d.shape)>=0&&ENEMY_DB[d.shape]&&Math.random()<DUO_CHANCE)
    extra=scaleEnemy(ENEMY_DB[d.shape],G.floor);
  G.mode='battle';
  checkGfx(true);   // 戦闘の背景が まっくろじゃないか
  setBattleEnemy(entity,extra);

function gainExp(){
  const gain=(battle.expAcc||0)+(battle.bonusExp||0);
  player.exp+=gain;let up=0;
  while(player.exp>=needExp(player.lv)){
    player.exp-=needExp(player.lv);player.lv++;up++;
  }
  battle.winInfo={gain:gain,up:up,lv:player.lv};
  battle.pendingUp=up;
}
function endBattle(win){
  if(win){
    const i=entities.indexOf(battle.entity);
    if(i>=0)entities.splice(i,1);
    const sa=battle.entity&&battle.entity.stairsAt;   // 中ボスの うしろに 階段があらわれる
    if(sa&&!entities.some(e=>e.type==='stairs')){
      entities.push({type:'stairs',t:0,gx:sa.gx,gy:sa.gy,x:sa.gx*TILE+TILE/2,y:sa.gy*TILE+TILE/2});
      G.msg={text:'クマティアの うしろに かいだんが あらわれた！'};G.msgT=2.8;
    }
    player.hp=Math.min(player.maxHp,player.hp+WIN_HEAL_HP);
    player.sp=Math.min(player.maxSp,player.sp+WIN_HEAL_SP);
    if(battle.enemy.isBoss){G.mode='clear';G.clearT=0;return;}
  }
  G.mode='dungeon';
}
function updateBattle(dt){
  battle.t+=dt;battle.enemyAnim+=dt;
  if(battle.nameT>0)battle.nameT-=dt;
  updateStars(dt);
  updateEnemyDust(dt);
  battle.shake=Math.max(0,battle.shake-dt*70);
  for(const f of battle.foes)if(f.hurt>0)f.hurt-=dt;
  if(battle.parryFlash>0)battle.parryFlash-=dt;
  if(battle.spPop&&battle.spPop.t>0)battle.spPop.t-=dt;
  if(battle.ecg&&battle.phase==='command'&&battle.ecg.t<ECG_DUR)battle.ecg.t+=dt;

  for(let i=battle.floats.length-1;i>=0;i--){
    const f=battle.floats[i];f.life-=dt;f.y+=f.vy*dt;
    if(f.life<=0)battle.floats.splice(i,1);
  }

  switch(battle.phase){
    case 'intro':
      if(battle.t>0.85){battle.phase='command';battle.t=0;}
      break;
    case 'command':{
      sfxSilent=false;let act=false;
      const L=hit['ArrowLeft']||hit['ArrowUp']||hit['KeyA'];
      const R=hit['ArrowRight']||hit['ArrowDown']||hit['KeyD'];
      const OK=hit['KeyZ']||hit['Enter']||hit['Space'];
      const BACK=hit['KeyX']||hit['Escape']||hit['Backspace'];
      if(battle.sub===0){
        if(L)battle.menuIdx=(battle.menuIdx+2)%3;
        if(R)battle.menuIdx=(battle.menuIdx+1)%3;
        if(OK)menuMain(battle.menuIdx);
        act=!!(L||R||OK);
      }else if(battle.sub===1){
        const m=player.moves.length;
        if(L)battle.moveIdx=(battle.moveIdx+m-1)%m;
        if(R)battle.moveIdx=(battle.moveIdx+1)%m;
        if(OK)pickMove(battle.moveIdx);
        if(BACK)battle.sub=0;
        act=!!(L||R||OK||BACK);
      }else if(battle.sub===2){
        const m=itemKeys().length;
        if(m>0){
          if(L)battle.itemIdx=((battle.itemIdx||0)+m-1)%m;
          if(R)battle.itemIdx=((battle.itemIdx||0)+1)%m;
          if(OK)pickItem(battle.itemIdx||0);
          act=!!(L||R||OK);
        }
        if(BACK){battle.sub=0;act=true;}
      }else if(battle.sub===3){   // つかう？ かくにん
        const k=battle.confirmKey;
        if(!k||!(player.items[k]>0)){battle.sub=2;}
        else{
          if(L||R)battle.confirmSel=1-battle.confirmSel;
          if(OK){if(battle.confirmSel===0)confirmItemUse();else battle.sub=2;}
          if(BACK)battle.sub=2;
          act=!!(L||R||OK||BACK);
        }
      }else if(battle.sub===4){   // ねらう てきを えらぶ（同時バトル）
        const al=aliveFoes();
        if(al.length>1&&(L||R)){const k=al.findIndex(f=>f.slot===battle.targetIdx);battle.targetIdx=al[(k+(R?1:al.length-1))%al.length].slot;}
        if(OK)confirmTarget();
        if(BACK)battle.sub=1;
        act=!!((al.length>1&&(L||R))||OK||BACK);
      }
      if(act&&!sfxSilent)menuSE();
      break;
    }
    case 'attack':updateMini(dt);break;
    case 'charge':   // 判定表示 ＋ オーラをためる
      if(isStageMove()){   // ランクが上がるたびに 効果音（NICE▶GOOD▶GREAT▶EXCELLENT）
        const sg=punchStage(battle.t);
        while(battle.chargeStage<sg){battle.chargeStage++;playSE(TIER_ORDER[battle.chargeStage]);battle.shake=Math.max(battle.shake,4+3*battle.chargeStage);}
      }
      if(battle.t>=chargeDur()){battle.phase='strike';battle.t=0;}
      break;
    case 'strike':   // 気弾が てきへ（きあい系の技は とびこんで なぐる）
      if(isPunchMove()){
        if(!battle.punchHit&&battle.t>=PUNCH_HIT){battle.punchHit=true;applyAttack();}
        if(battle.t>=PUNCH_END){if(!battle.punchHit){battle.punchHit=true;applyAttack();}battle.phase='attackResult';battle.t=0;}
      }else if(isSweepMove()){   // 刀でなぎはらう。斬撃が敵に届いた瞬間にダメージ
        const T=swT();
        if(!battle.punchHit&&battle.t>=T.hit){battle.punchHit=true;applyAttack();battle.shake=Math.max(battle.shake,12+5*tierIdx());}
        if(battle.t>=T.end){if(!battle.punchHit){battle.punchHit=true;applyAttack();}battle.phase='attackResult';battle.t=0;}
      }else if(isMeteorMove()){   // 流星が敵に当たった瞬間にダメージ（小さな流星は着弾ごとに ゆれるだけ）
        const pl=metPlan(),fin=pl[pl.length-1],n=tierIdx();
        for(let i=0;i<pl.length-1;i++){
          if(i>=battle.metSeen&&battle.t>=pl[i].hit){
            battle.metSeen=i+1;battle.shake=Math.max(battle.shake,3+n);
            battle.enemy.hurt=Math.max(battle.enemy.hurt||0,0.1);
            playSfx('red',Math.min(2,1.3+0.07*i));
          }
        }
        if(!battle.punchHit&&battle.t>=fin.hit){battle.punchHit=true;applyAttack();battle.shake=Math.max(battle.shake,16+6*n);}
        if(battle.t>=fin.hit+MET_AFTER[n]){if(!battle.punchHit){battle.punchHit=true;applyAttack();}battle.phase='attackResult';battle.t=0;}
      }else if(isShiningMove()){   // 暗転 → スポットライト。光が当たった瞬間にダメージ
        if(!battle.punchHit&&battle.t>=shineHitT()){battle.punchHit=true;applyAttack();battle.shake=Math.max(battle.shake,12+5*tierIdx());}
        if(battle.t>=shineHitT()+SHINE_AFTER){if(!battle.punchHit){battle.punchHit=true;applyAttack();}battle.phase='attackResult';battle.t=0;}
      }else if(battle.t>=STRIKE_T){applyAttack();battle.phase='attackResult';battle.t=0;}
      break;
    case 'attackResult':
      if(battle.t>0.75){
        for(const f of battle.foes){if(!f.dead&&f.hp<=0){f.dead=true;battle.expAcc+=expFor(f.def);startEnemyDust(f);
        }}
        if(!aliveFoes().length){battle.phase='win';battle.t=0;gainExp();
          if(G.floor>=11&&G.floor<=14&&Math.random()<0.5){   // 11〜14Fは 戦闘に勝つと 50%でマナキット（同時バトルでも1こだけ）
            player.items['マナキット']=(player.items['マナキット']||0)+1;
            battle.dropKit=1;
          }
const ei=entities.indexOf(battle.entity);if(ei>=0)entities.splice(ei,1);}
        else{
          setTarget(aliveFoes()[0]);
          battle.phase='enemyWarn';battle.t=0;
          if(battle.enemy.isBoss&&bossAwake()&&!battle.bossAwoke)battle.shake=Math.max(battle.shake,20);
        }
      }
      break;
    case 'enemyWarn':
      if(battle.t>((battle.enemy.isBoss&&bossAwake()&&!battle.bossAwoke)?2.0:1.15))startDodge();
      break;
    case 'dodge':updateDodge(dt);break;
    case 'counterFx':updateCounterFx(dt);break;
    case 'enemyResult':
      if(battle.t>1.4){battle.phase='command';battle.t=0;battle.sub=0;battle.menuIdx=2;battle.rage=false;battle.shield=false;battle.counter=false;battle.ecg={t:0};}
      break;
    case 'win':   // タップ（or Z / Enter / Space）で次へ
      if(hit['KeyZ']||hit['Enter']||hit['Space'])winAdvance();
      break;
    case 'levelup':
      if(battle.t>0.5){
        if(hit['ArrowLeft']||hit['KeyA']){battle.lvSel=(battle.lvSel+3)%4;menuSE();}
        if(hit['ArrowRight']||hit['KeyD']){battle.lvSel=(battle.lvSel+1)%4;menuSE();}
        if(hit['KeyZ']||hit['Enter']||hit['Space']){menuSE();pickUpgrade(battle.lvSel);menuSE();}
      }
      break;
    case 'lose':
      if(battle.t>2.2){G.mode='gameover';}
      break;
  }
}
function winAdvance(){
  if(battle.phase!=='win'||battle.t<0.6)return;   // 直後の誤タップ防止
  menuSE();sfxSilent=true;   // 勝利のあと「つぎへ」（タップ・キー どちらでも1回だけ）
  if(battle.pendingUp>0){battle.phase='levelup';battle.t=0;battle.lvSel=0;}
  else endBattle(true);
}

    // 小節ごとにパターンを選んで並べる（同じ譜面が続かないようにする）
    const step=beatSec/4,measure=beatSec*4;
    let bar=0,last=-1,lastTier='easy';
    while(notes.length<m.notes){
      const r=Math.random();
      let tier='easy';
      if(bar>0){
        if(r<m.oni.hard&&lastTier!=='hard')tier='hard';   // 高速パターンは2小節つづけて出さない
        else if(r<m.oni.hard+(m.oni.mid||0))tier='mid';
      }
      lastTier=tier;
      const pool=tier==='hard'?ONI_HARD:tier==='mid'?ONI_MID:ONI_EASY;
      const off=tier==='hard'?100:tier==='mid'?200:0;
      let idx;do{idx=(Math.random()*pool.length)|0;}while(pool.length>1&&idx+off===last);
      last=idx+off;
      const pat=pool[idx];
      for(let i=0;i<16&&notes.length<m.notes;i++){
        const c=pat[i];if(c==='.')continue;
        notes.push({time:startTime+bar*measure+i*step,type:c==='d'?'don':'ka',judged:null});
      }
      bar++;

    let cur=0;
    for(let i=0;i<m.notes;i++){
      const isKa=Math.random()<m.ka;
      notes.push({time:startTime+cur,type:isKa?'ka':'don',judged:null});
      let gap=beatSec;
      if(i>=2 && Math.random()<m.doubles) gap=beatSec*0.5;

    type:'taiko',
    t:0,
    notes,
    total:notes.length,
    hitCount:0,
    window:m.window,
    pj:m.oni?m.oni.pj:0.05,     // PERFECT の猶予
    gj:m.oni?m.oni.gj:0.10,     // GREAT の猶予
    speed:m.oni?m.oni.speed:LANE_SPEED,   // ノーツが流れる速さ

    lastJudgeT:0,
    hitFx:[],

}
function updateMini(dt){
  const mini=battle.mini;if(!mini)return;
  mini.t+=dt;
  if(mini.lastJudgeT>0)mini.lastJudgeT-=dt;
  for(let i=mini.hitFx.length-1;i>=0;i--){
    mini.hitFx[i].t+=dt;
    if(mini.hitFx[i].t>0.55)mini.hitFx.splice(i,1);
  }
  if(mini.type!=='taiko')return;
  const judgeT=mini.window;

  // 取り逃し
  for(const n of mini.notes){
    if(!n.judged && mini.t>n.time+judgeT){
      n.judged='miss';
      mini.combo=0;
      mini.lastJudge='miss';mini.lastJudgeT=0.45;
    }
  }
  padFlash.l=Math.max(0,padFlash.l-dt);padFlash.r=Math.max(0,padFlash.r-dt);
  // 右パッド(赤) → ドン
  if(hit['KeyD']||hit['KeyZ']||hit['Enter']||hit['ArrowRight']){judgeTaiko(mini,'don',judgeT);padFlash.r=0.12;}
  // 左パッド(青緑) → カ
  if(hit['KeyA']||hit['KeyX']||hit['ArrowLeft']||hit['Escape']||hit['Backspace']){judgeTaiko(mini,'ka',judgeT);padFlash.l=0.12;}

  if(mini.t>=mini.end){
    let score=0;
    for(const n of mini.notes){
      if(n.judged==='perfect')score+=1.0;
      else if(n.judged==='great')score+=0.8;
      else if(n.judged==='good')score+=0.5;
    }
    finishMini(score/mini.total);
  }
}
const TAIKO_PITCH_STEP=0.01;   // 1コンボごとに上がる量（1%）
const TAIKO_PITCH_MAX=1.5;     // 上がりすぎないための上限（1.5倍＝約7半音）
function judgeTaiko(mini,wantType,judgeT){
  let best=null,bestDt=judgeT;
  for(const n of mini.notes){
    if(n.judged||n.type!==wantType)continue;
    const d=Math.abs(mini.t-n.time);
    if(d<bestDt){bestDt=d;best=n;}
  }
  if(best){
    let judge;
    if(bestDt<mini.pj)judge='perfect';
    else if(bestDt<mini.gj)judge='great';
    else judge='good';
    best.judged=judge;
    mini.hitCount++;
    mini.combo++;
    if(mini.combo>mini.maxCombo)mini.maxCombo=mini.combo;
    mini.lastJudge=judge;mini.lastJudgeT=0.45;
    mini.hitFx.push({judge,t:0});
    // ちゃんと叩けたときだけ red.mp3（赤も青も同じ音）。コンボが増えるたび、ほんの少しずつ高くなる
    playSfx('red',Math.min(TAIKO_PITCH_MAX,1+(mini.combo-1)*TAIKO_PITCH_STEP));
  }else{
    mini.combo=0;
    mini.lastJudge='miss';mini.lastJudgeT=0.45;
  }
}
