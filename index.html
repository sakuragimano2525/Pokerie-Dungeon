<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<title>ポケモンダンジョン</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  html,body{margin:0;height:100%;background:#08011a;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    touch-action:none;overscroll-behavior:none;}
  #startScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:24px;text-align:center;color:#fff;
    background:radial-gradient(circle at 50% 30%,#6a22b8 0%,#33105c 35%,#14042a 65%,#05010a 100%);transition:opacity .45s;}
  #startScreen.hidden{opacity:0;pointer-events:none;}
  #startScreen .title{font-size:clamp(34px,9vw,76px);font-weight:900;letter-spacing:.1em;line-height:1.05;
    background:linear-gradient(180deg,#fff 0%,#e5c7ff 40%,#c78aff 60%,#7a3dd9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(190,120,255,.75));animation:titleGlow 2.6s ease-in-out infinite;}
  @keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 22px rgba(190,120,255,.6));}50%{filter:drop-shadow(0 0 38px rgba(210,150,255,.95));}}
  #startScreen .sub{font-size:clamp(12px,2.6vw,16px);color:#cbb0f5;letter-spacing:.35em;margin-top:-12px;opacity:.9;}
  #startBtn{margin-top:6px;font-family:inherit;font-weight:900;letter-spacing:.16em;font-size:clamp(20px,4.6vw,30px);color:#fff;
    padding:clamp(14px,3vh,20px) clamp(38px,9vw,64px);border-radius:999px;border:3px solid #c78aff;
    background:linear-gradient(180deg,#7b2ed1,#3d0e7a);
    box-shadow:0 10px 34px rgba(150,80,255,.55),inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.18);
    cursor:pointer;transition:transform .12s;animation:btnPulse 1.8s ease-in-out infinite;}
  @keyframes btnPulse{0%,100%{box-shadow:0 10px 34px rgba(150,80,255,.55),inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.18);}50%{box-shadow:0 14px 46px rgba(180,100,255,.85),inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.18);}}
  #startBtn:active{transform:translateY(2px) scale(.98);}
  #contBtn{margin-top:-6px;font-family:inherit;font-weight:900;letter-spacing:.12em;font-size:clamp(15px,3.4vw,22px);color:#fff;
    padding:clamp(10px,2.2vh,14px) clamp(28px,7vw,48px);border-radius:999px;border:3px solid #ffd84d;
    background:linear-gradient(180deg,#d1892e,#7a470e);
    box-shadow:0 8px 26px rgba(255,190,80,.4),inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.18);
    cursor:pointer;transition:transform .12s;}
  #contBtn:active{transform:translateY(2px) scale(.98);}
  #startScreen .hint{margin-top:4px;font-size:clamp(10px,2.2vw,13px);color:#a88fd0;letter-spacing:.14em;}
  #debugGear{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:44px;height:44px;
    font-size:24px;line-height:1;border-radius:50%;border:2px solid rgba(199,138,255,.55);background:rgba(60,20,110,.45);color:#fff;cursor:pointer;opacity:.75;}
  #debugGear:active{transform:scale(.92);}
  #debugPanel{position:absolute;top:max(62px,calc(env(safe-area-inset-top) + 52px));right:max(12px,env(safe-area-inset-right));display:none;flex-direction:column;gap:8px;
    padding:12px;border-radius:12px;border:2px solid rgba(199,138,255,.6);background:rgba(20,4,42,.96);text-align:left;}
  #debugPanel.open{display:flex;}
  #debugPanel label{font-size:12px;color:#cbb0f5;letter-spacing:.1em;}
  #debugPanel input{font-family:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:2px solid #7a3dd9;background:#0d0220;color:#fff;width:200px;}
  #debugPanel button{font-family:inherit;font-weight:800;font-size:15px;padding:8px;border-radius:8px;border:2px solid #c78aff;background:linear-gradient(180deg,#7b2ed1,#3d0e7a);color:#fff;cursor:pointer;}
  #debugPanel .err{font-size:12px;color:#ff9a9a;min-height:14px;}
  #gameWrap{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;border-radius:6px;box-shadow:0 0 60px rgba(160,80,255,.35),0 0 0 1px rgba(180,120,255,.18);}
  #touchControls{position:fixed;inset:0;z-index:50;pointer-events:none;}
  #touchControls.hidden{display:none;}
#touchControls.dungeonMode .actions{display:none;}
  #touchControls .dpad,#touchControls .actions{pointer-events:auto;}
  .dpad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:max(10px,env(safe-area-inset-left));
    width:min(140px,32vh);height:min(140px,32vh);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:3px;}
  .dpad button{font-family:inherit;font-weight:900;font-size:min(18px,4.6vh);color:rgba(232,216,255,.85);
    border:1.5px solid rgba(200,140,255,.45);background:rgba(60,20,110,.35);border-radius:12px;touch-action:none;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:background .08s,transform .08s;}
  .dpad button:active{background:rgba(160,90,255,.7);transform:scale(.94);color:#fff;}
  .dpad .up{grid-area:1/2;}.dpad .left{grid-area:2/1;}.dpad .right{grid-area:2/3;}.dpad .down{grid-area:3/2;}
  .actions{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
    display:flex;gap:min(14px,3vh);align-items:flex-end;}
  /* A・B 同じサイズ */
  .actions button{font-family:inherit;font-weight:900;width:min(76px,19vh);height:min(76px,19vh);border-radius:50%;
    border:2.5px solid rgba(210,150,255,.6);background:rgba(100,40,180,.55);color:#fff;font-size:min(22px,5vh);
    touch-action:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 6px 18px rgba(0,0,0,.4);
    transition:transform .08s,background .08s;}
  .actions button:active{transform:scale(.9);background:rgba(170,100,255,.85);}
  .actions .btnA{background:rgba(200,60,80,.55);border-color:rgba(255,140,160,.7);}
  .actions .btnB{background:rgba(60,130,200,.55);border-color:rgba(140,200,255,.7);}
</style>
</head>
<body>

<div id="startScreen">
  <div class="title">ポケリエ<br>ダンジョン</div>
  <div class="sub">ローグライクダンジョンゲーム</div>
  <button id="startBtn">▶ START</button>
  <button id="contBtn" style="display:none">⏩ つづきから</button>
  <div class="hint">※ 横画面で プレイしてください</div>
  <button id="debugGear" aria-label="設定">⚙️</button>
  <div id="debugPanel">
    <label for="debugId">ID</label>
    <input id="debugId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="debugErr"></div>
    <button id="debugGo">OK</button>
  </div>
</div>

<div id="gameWrap"><canvas id="game" width="960" height="540"></canvas></div>

<div id="touchControls" class="hidden">
  <div class="dpad">
    <button class="up"    data-key="ArrowUp">▲</button>
    <button class="left"  data-key="ArrowLeft">◀</button>
    <button class="right" data-key="ArrowRight">▶</button>
    <button class="down"  data-key="ArrowDown">▼</button>
  </div>
  <div class="actions">
    <button class="btnA" data-key="KeyZ">A</button>
    <button class="btnB" data-key="KeyX">B</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ========== 基本 ========== */
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const W=960,H=540;
let RES=1;   // 実解像度の倍率（画面に合わせて自動）
const TILE=32,ROOM_W=16,ROOM_H=9,MAP_W=ROOM_W,MAP_H=ROOM_H;   // 1部屋 = 16x9 タイル = 1画面
const MAP_PX_W=MAP_W*TILE,MAP_PX_H=MAP_H*TILE;
const CAM_Z=W/MAP_PX_W;   // 固定カメラ（部屋まるごと表示）
const GRID_W=5,GRID_H=3;   // フロア内の部屋グリッド
// 部屋ごとの大きさ。ふつうは 16x9（=1画面・カメラ固定）。それより大きい部屋は主人公を追ってカメラが動く
const rmW=r=>r.w||ROOM_W, rmH=r=>r.h||ROOM_H;
const isBigRoom=r=>rmW(r)>ROOM_W||rmH(r)>ROOM_H;
// 毎階ためしに出す「広い部屋」（THEMES の名前）。増やす／減らす／[]で無効 にできる
const MINE_CHEST_GUARANTEE=true;   // true: 廃坑の部屋がある階では、宝箱を最低1つ「岩のむこうの宝部屋」に置く
const BIG_ROOMS=['bigtower','bigmaze','bigring','bigzig','bigcorr','bigblock','bignarrow','bigchapel','bigportrait','bigmine'];   // 狭い通路の広い部屋が中心（ただ広いだけの bigwide / bigtall は外した。戻すならここに足す）   // bigblock = 鉄ドアのある独房ブロック
const BLOCK_CHEST_GUARANTEE=true;   // true: 独房ブロックがある階では、宝箱を最低1つ「ベッドのある個室」の中に置く（falseだと、ブロックに宝箱が入るかは運。入る場合は常に個室の中）
const BIG_FIRST_CHANCE=0.75;   // 1つめの広い部屋が出る確率（そのほかの部屋は、ふつうの部屋のまま）
const BIG_CHANCE=0.30;         // 2つめ以降の広い部屋が、部屋ごとに出る確率
const BIG_DARK_CHANCE=0.4;       // 灯りの消える大食堂が、そのフロアに出る確率（広い部屋の数には入れない）
const BIG_MAX=3;               // 1フロアに出る広い部屋の最大数

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ========== player.png ========== */
const playerImg=new Image();
let playerImgReady=false;
playerImg.onload=()=>{playerImgReady=true;};
playerImg.onerror=()=>{playerImgReady=false;};
playerImg.src='player.png';

/* ========== 入力 ========== */
const down={},hit={};
const pressed=new Set();
function keyDown(c){if(pressed.has(c))return;pressed.add(c);hit[c]=true;down[c]=true;}
function keyUp(c){pressed.delete(c);down[c]=false;}
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keyDown(e.code);
},{passive:false});
addEventListener('keyup',e=>{keyUp(e.code);});
addEventListener('blur',()=>{for(const k of pressed)down[k]=false;pressed.clear();});

/* ========== ゲーム状態 ========== */
const HERO_LIFT=3;       // ダンジョンの主人公の画像を上にずらす量（大きいほど上）。影は動かない
const HERO_BOB_SPD=5;    // ダンジョンの主人公のゆれる速さ（小さいほどゆっくり。もとは9）
const MIDBOSS_FLOOR=10;   // 中ボス「クマティア」が かならず出る階
const FINAL_FLOOR=15;   // 最終階（ボスのいる階）。ここを変えれば全フロア数が変わる
const G={mode:'dungeon',time:0,msg:null,msgT:0,started:false,floor:1,clearT:0};

/* ========== 技データ（太鼓式・技ごとに難易度を細かく調整） ========== */
// bpm: テンポ / notes: ノーツ数 / ka: 青(カ)率 / doubles: 16分連打率 / window: 判定猶予(秒)
const MOVE_DB={
  'きあいパンチ':{name:'きあいパンチ',power:6,  sp:0,  color:'#ffe08a',icon:'●',
                bpm:90, notes:8,  ka:0.10,doubles:0.00,window:0.30,diff:'EASY',
                desc:'きほんの こうげき'},
  'きあいのいっぱつ':  {name:'きあいのいっぱつ',  power:14, sp:4,  color:'#ff8a4d',icon:'🔥',
                bpm:110,notes:13, ka:0.20,doubles:0.10,window:0.25,diff:'NORMAL',
                desc:'きあいパンチの きょうかばん'},
  'シャイニング':  {name:'シャイニング',  power:18, sp:8,  color:'#ffe14d',icon:'⚡',
                bpm:120,notes:21, ka:0.32,doubles:0.18,window:0.22,diff:'NORMAL',
                randTarget:true,desc:'こうげきするが てき ランダム'},
  'なぎはらい':{name:'なぎはらい',power:20, sp:12, color:'#9be8b8',icon:'🌪',
                bpm:110,notes:26, ka:0.42,doubles:0.26,window:0.16,diff:'HARD',
                oni:{hard:0.12,mid:0.40,speed:150,pj:0.045,gj:0.085},   // hard=16分の高速パターン率／mid=8分中心のパターン率（残りはやさしい）
                all:true,desc:'てきぜんいんに ダメージ'},
  'りゅうせい':{name:'りゅうせい',power:35, sp:25, color:'#7fe4ff',icon:'❄',
                bpm:125,notes:32, ka:0.5,doubles:0.38,window:0.14,diff:'HARD',
                oni:{hard:0.30,mid:0.40,speed:165,pj:0.040,gj:0.075},
                desc:'きあいのいっぱつの きょうかばん'},
};

const ITEM_DB={
  'チョコケーキ':      {kind:'heal', value:15, color:'#7dffb0', icon:'🌿'},
  'ハンバーガー':{kind:'heal', value:30, color:'#7fd9ff', icon:'💧'},
  'マナキット':  {kind:'sp',   value:10, color:'#feb103', icon:'✨'},
  'マナキットS':  {kind:'sp',   value:25, color:'#ffd84d', icon:'⭐'},
  'ホルミシス':  {kind:'holm', dmg:10, heal:20, turns:2, value:10, color:'#7dffb0', icon:'🧪'},   // 戦闘専用：使うと即 dmg ダメージ。つぎの turns ターン、ターン開始時に HP heal 回復。シールド・かんしゃくと重ねがけ不可
  'クッキー':    {kind:'hpsp', hp:10, sp:10, value:10, color:'#e8b060', icon:'🍪'},   // HPとSPを同時に回復（hp / sp の数字で調整）
  'シールド':    {kind:'shield',value:6, color:'#7fd9ff', icon:'🛡️'},   // 戦闘専用：そのターン、受けるダメージ-6。使ってもターンは進まない。かんしゃくと重ねがけ不可
  'カウンター':  {kind:'counter',value:2, color:'#ffb347', icon:'⚔️'},   // 戦闘専用：value ターンのあいだ（回避ターン value 回ぶん）、パリィに成功すると 本来うけるはずだったダメージを 相手に与える。使ってもターンは進まない。シールド・かんしゃく・ホルミシスと重ねがけ不可
  'かんしゃく':  {kind:'rage',  value:1, color:'#ff5a3c', icon:'💢'},   // 戦闘専用：そのターン、与ダメ1.5倍・被ダメ2倍。使ってもターンは進まない
  '強化メダル':  {kind:'medal', value:1, color:'#ffd84d', icon:'🏅'},   // ダンジョン専用（バッグ2つめのタブ）
};

/* ========== わざ強化（強化メダル）========== */
// Lv0(ふつう) / Lv1 / Lv2 / Lv3 の倍率。SPしょうひ と いりょく(さいだいダメージ) に かかる。画面には Lv は出さない。
const MOVE_ENH=[1,1.3,1.6,2.0],MOVE_LV_MAX=3;
function moveLv(n){return (player.moveLv&&player.moveLv[n])||0;}
function moveFactor(n){return MOVE_ENH[moveLv(n)];}
function moveSp(n){return Math.round((MOVE_DB[n].sp||0)*moveFactor(n));}
function movePower(n){return Math.round(MOVE_DB[n].power*moveFactor(n));}

/* ========== プレイヤー ========== */
const player={
  gx:1,gy:1,x:0,y:0,ox:0,oy:0,tgx:0,tgy:0,
  moving:false,moveT:0,moveSpd:0.135,
  fx:1,fy:0,
  hp:45,maxHp:45,
  sp:50,maxSp:50,
  lv:1,exp:0,
  up:{hp:1,sp:1,atk:1,g:1},
  moves:['きあいパンチ'],
  moveLv:{},
  items:{'チョコケーキ':2},
  anim:0,
};

/* ========== エリア（部屋）式マップ ========== */
let map,mapCanvas,entities;
let floorRooms=[],roomList=[],curRoom=null;
const DIRS=[['u',0,-1,'d'],['d',0,1,'u'],['l',-1,0,'r'],['r',1,0,'l']];
function isFloor(x,y){return x>=0&&y>=0&&x<map[0].length&&y<map.length&&map[y][x]===0;}
function isInterior(x,y){return x>=1&&x<=map[0].length-2&&y>=2&&y<=map.length-2&&map[y][x]===0;}
function roomAt(cx,cy){return(cx<0||cy<0||cx>=GRID_W||cy>=GRID_H)?null:floorRooms[cy*GRID_W+cx];}

// 部屋のつながりをランダムに作る（□■□□ のような形）
function genFloor(target){
  const R=new Array(GRID_W*GRID_H).fill(null);
  const mk=(cx,cy)=>({cx,cy,doors:{u:false,d:false,l:false,r:false},seed:(Math.random()*1e9)|0,
    visited:false,known:false,entities:[],map:null,torches:[],dist:0});
  const sx=(Math.random()*GRID_W)|0,sy=(Math.random()*GRID_H)|0;
  const list=[R[sy*GRID_W+sx]=mk(sx,sy)];
  let guard=0;
  while(list.length<target&&guard++<800){
    const a=list[(Math.random()*list.length)|0];
    const d=DIRS[(Math.random()*4)|0];
    const nx=a.cx+d[1],ny=a.cy+d[2];
    if(nx<0||ny<0||nx>=GRID_W||ny>=GRID_H||R[ny*GRID_W+nx])continue;
    const b=mk(nx,ny);R[ny*GRID_W+nx]=b;list.push(b);
    a.doors[d[0]]=true;b.doors[d[3]]=true;
  }
  // ときどき近道（ループ）を追加
  for(const a of list)for(const k of ['r','d']){
    const d=DIRS.find(x=>x[0]===k);
    const n=(a.cx+d[1]<GRID_W&&a.cy+d[2]<GRID_H)?R[(a.cy+d[2])*GRID_W+a.cx+d[1]]:null;
    if(n&&!a.doors[k]&&Math.random()<0.25){a.doors[k]=true;n.doors[d[3]]=true;}
  }
  // スタートからの距離
  const q=[list[0]];list[0].dist=0;const seen=new Set(q);
  while(q.length){
    const a=q.shift();
    for(const d of DIRS){
      if(!a.doors[d[0]])continue;
      const n=R[(a.cy+d[2])*GRID_W+a.cx+d[1]];
      if(n&&!seen.has(n)){seen.add(n);n.dist=a.dist+1;q.push(n);}
    }
  }
  return{R,list};
}

// 部屋の中身（ランダムな形の壁・ドア・柱・本棚）
function buildRoomMap(room,force){
  if(room.forceTheme)force=room.forceTheme;   // 広い部屋は作り直しても同じテーマ・同じ大きさ
  const RW=rmW(room),RH=rmH(room);
  const m=[];for(let y=0;y<RH;y++)m.push(new Array(RW).fill(1));
  for(let y=2;y<=RH-2;y++)for(let x=1;x<=RW-2;x++)m[y][x]=0;
  const rnd=mulberry32(room.seed);
  room.decor=[];room.cellSet=new Set();
  room.theme=pickTheme(rnd,force);
  const TPL=!!THEMES[room.theme].rows;
  if(TPL)applyTemplate(m,room,THEMES[room.theme].rows,rnd);
  if(!TPL){
  // ① 角を削って L字・階段状・くぼみ などの形にする（十字の通路は必ず残る）
  const corners=[[1,2,1,1],[RW-2,2,-1,1],[1,RH-2,1,-1],[RW-2,RH-2,-1,-1]];
  let carved=0;
  const carve=()=>{
    for(const [ax,ay,sx,sy] of corners){
      const r=rnd();
      if(r<0.22)continue;
      let w,h;
      if(r<0.48){w=2+((rnd()*2)|0);h=1;}
      else if(r<0.80){w=3+((rnd()*3)|0);h=2;}
      else{w=5+((rnd()*2)|0);h=2;}
      for(let j=0;j<h;j++){
        const ww=j===0?w:Math.max(1,w-1-((rnd()*2)|0));

function isDoorTile(m,x,y){return m[y][x]===0&&(x<1||x>m[0].length-2||y<2||y>m.length-2);}
// 「正面の壁」＝ 手前（1〜2マス下）に床がある壁。ここだけレンガを描き、それ以外の壁は真っ黒（闇）
function isFaceTile(m,x,y){
  const Wl=(a,b)=>a>=0&&b>=0&&a<m[0].length&&b<m.length&&m[b][a]===1;
  const Fl=(a,b)=>a>=0&&b>=0&&a<m[0].length&&b<m.length&&m[b][a]!==1;
  return Wl(x,y)&&(Fl(x,y+1)||(Wl(x,y+1)&&Fl(x,y+2)));
}

  if(force)return force;
  const keys=Object.keys(THEMES);let tot=0;for(const k of keys)tot+=THEMES[k].w;
  let r=rnd()*tot;for(const k of keys){r-=THEMES[k].w;if(r<0&&THEMES[k].w>0)return k;}
  return 'hall';
}
function applyTemplate(m,room,rows,rnd){
  const flip=rnd()<0.5&&!isBigRoom(room);   // 広い部屋はドアの位置が決まっているので左右反転しない
  for(let j=0;j<rows.length;j++){
    let row=rows[j];if(flip)row=row.split('').reverse().join('');
    for(let i=0;i<row.length;i++){
      const ch=row[i],x=1+i,y=2+j;
      m[y][x]=TCH[ch];
      if(ch==='k'||ch==='v'||ch==='r')room.decor.push({t:ch,x,y});
      if(ch==='n'||ch==='g'||ch==='N'||ch==='x'){room.cellSet.add(x+','+y);if(ch==='n'||ch==='N')room.decor.push({t:'n',x,y});}   // 牢・詰所の中（敵は出ない）
    }
  }
}
// ドアの前・中央は必ず歩ける／全部の床がつながる（つながらない床は壁にする）
function finishTemplate(m,room,rnd){
  const RW=m[0].length,RH=m.length;
  for(const [x,y] of [[7,4],[8,4],[7,5],[8,5]])m[y][x]=0;
  const walk=(x,y)=>x>=0&&y>=0&&x<RW&&y<RH&&(m[y][x]===0||m[y][x]===13||m[y][x]===15||m[y][x]===29);
  const reach=()=>{
    const seen=new Set(['7,4']),q=[[7,4]];
    while(q.length){const [x,y]=q.shift();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy,k=nx+','+ny;
        if(walk(nx,ny)&&!seen.has(k)){seen.add(k);q.push([nx,ny]);}
      }}
    return seen;
  };
  const fronts=[];
  if(room.doors.u)fronts.push([7,2],[8,2]);
  if(room.doors.d)fronts.push([7,RH-2],[8,RH-2]);
  if(room.doors.l)fronts.push([1,4],[1,5]);
  if(room.doors.r)fronts.push([RW-2,4],[RW-2,5]);
  let seen=reach();
  for(const [fx,fy] of fronts){
    if(seen.has(fx+','+fy))continue;
    let x=fx,y=fy;
    while(x!==7){m[y][x]=0;x+=x<7?1:-1;}
    while(y!==4){m[y][x]=0;y+=y<4?1:-1;}
    m[y][x]=0;seen=reach();
  }
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++)if(m[y][x]===0&&!seen.has(x+','+y))m[y][x]=1;
  // ちらばる骨・血だまり（広い部屋は多め）
  const n=((rnd()*3)|0)+(isBigRoom(room)?4:0);
  const IW=RW-2,IH=RH-3;
  for(let i=0;i<n;i++){
    const x=1+((rnd()*IW)|0),y=2+((rnd()*IH)|0);
    if(m[y][x]!==0||y===4||y===5||x===7||x===8)continue;
    room.decor.push({t:rnd()<0.5?'k':'v',x,y});
  }
  room.decor=room.decor.filter(d=>m[d.y][d.x]===0);
}

function decorateBedRoom(g,room,rnd){
  const m=room.map,T=60,RW=m[0].length,RH=m.length,at=(x,y)=>(x>=0&&y>=0&&x<RW&&y<RH)?m[y][x]:1;
  const flo=v=>v===0||v===7||v===11||v===13||v===14||v===15||v===16;
  const straw=new Set((room.decor||[]).filter(d=>d.t==='n').map(d=>d.x+','+d.y));
  const nstand=[];
  // ① 床：石畳の細かい質感（1pxの目地・ハイライト・ひび・苔）
  g.save();g.beginPath();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++)if(flo(m[y][x]))g.rect(x*T,y*T,T,T);
  g.clip();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!flo(m[y][x]))continue;
    const X=x*T,Y=y*T;
    for(let r=0;r<4;r++){const off=(r&1)*15,ry=Y+r*15;
      g.fillStyle='rgba(30,0,80,0.30)';g.fillRect(X,ry+14,T,1);
      for(let bx=-off;bx<T;bx+=30){g.fillStyle='rgba(30,0,80,0.26)';g.fillRect(X+bx+29,ry,1,15);g.fillStyle='rgba(235,205,255,0.16)';g.fillRect(X+bx+1,ry+1,28,1);
        if(rnd()<0.3){g.fillStyle=rnd()<0.5?'rgba(255,255,255,0.05)':'rgba(30,0,90,0.07)';g.fillRect(X+bx+1,ry+1,28,13);}}}
    for(let i=0;i<7;i++){g.fillStyle=rnd()<0.5?'rgba(255,255,255,0.13)':'rgba(30,0,90,0.22)';g.fillRect(X+((rnd()*58)|0),Y+((rnd()*58)|0),1.5,1.5);}
    if(rnd()<0.12){g.strokeStyle='rgba(30,0,80,0.5)';g.lineWidth=1;g.beginPath();let cx=X+10+rnd()*40,cy=Y+8;g.moveTo(cx,cy);for(let k=0;k<4;k++){cx+=(rnd()-0.5)*10;cy+=8+rnd()*4;g.lineTo(cx,cy);}g.stroke();}
    if(rnd()<0.08){const gr=g.createRadialGradient(X+30,Y+30,1,X+30,Y+30,14);gr.addColorStop(0,'rgba(90,200,120,0.25)');gr.addColorStop(1,'rgba(90,200,120,0)');g.fillStyle=gr;g.fillRect(X,Y,T,T);}   // 苔
  }
  g.restore();
  // ② 独房の床：藁と石の敷き詰め、ベッドわきの小棚
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    const v=m[y][x],X=x*T,Y=y*T;
    if(v===11||v===14||v===16||straw.has(x+','+y)){
      g.fillStyle='rgba(18,0,46,0.22)';g.fillRect(X,Y,T,T);
      for(let i=0;i<16;i++){g.strokeStyle=rnd()<0.5?'rgba(232,206,120,0.85)':'rgba(166,128,60,0.85)';g.lineWidth=1.1;const a=rnd()*6.28,cx=X+6+rnd()*48,cy=Y+8+rnd()*46;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*7,cy+Math.sin(a)*3);g.stroke();}
      const L=at(x-1,y)===7,R=at(x+1,y)===7;
      if(v===11&&(L||R))drawNightstandHi(g,x*30,y*30,L);
      if(v===16){drawNightstandHi(g,x*30,y*30,at(x-1,y)===7);}
    }
  }
  // ③ ベッド（前の床にじゅうたん）
  let k=0;
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(m[y][x]!==7)continue;
    const seed=(room.seed+x*7+y*3+k++)&3;
    if(at(x,y+1)===0&&!straw.has(x+','+(y+1)))drawRugHi(g,x*30+1,(y+1)*30+4,28,22,seed);
    drawBedHi(g,x*30,y*30,seed);
    // 壁にかかった鎖と手かせ・ベッド上のランタンのあかり
    const X=x*T,Y=y*T;
    if(at(x,y-1)===1){g.strokeStyle='#3a2a52';g.lineWidth=1.6;g.setLineDash([3,2]);g.beginPath();g.moveTo(X+16,Y-44);g.lineTo(X+16,Y-14);g.moveTo(X+44,Y-44);g.lineTo(X+44,Y-20);g.stroke();g.setLineDash([]);
      g.strokeStyle='#8c84a8';g.lineWidth=1.4;g.beginPath();g.arc(X+16,Y-10,3.6,0,7);g.arc(X+44,Y-16,3.6,0,7);g.stroke();}
    const gr=g.createRadialGradient(X+30,Y+24,2,X+30,Y+24,70);gr.addColorStop(0,'rgba(255,170,90,0.16)');gr.addColorStop(1,'rgba(255,140,60,0)');
    g.fillStyle=gr;g.fillRect(X-40,Y-46,T+80,T+110);
  }
}

const IRON={d0:'#1c0038',d1:'#2c0058',m0:'#4a1a80',m1:'#6a2aa8',m2:'#7a38be',b0:'#8a46d0',b1:'#a45ee8',h0:'#b070f0',h1:'#c488f8',h2:'#e6c8ff'};
function pxr(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x*2),Math.round(y*2),Math.round(w*2),Math.round(h*2));}   // 30基準(ドット)座標で描く
function ironTexture(c,rnd,scratch){   // 既にある絵の上にだけ、ブラシ目・粒・傷・光と汚れを重ねる
  const g=c.getContext('2d'),W=c.width,H=c.height;
  g.save();g.globalCompositeOperation='source-atop';
  for(let i=0;i<W*1.4;i++){const x=(rnd()*W)|0,y=(rnd()*H)|0,l=4+rnd()*26;g.fillStyle=rnd()<0.5?'rgba(255,235,255,0.07)':'rgba(20,0,50,0.10)';g.fillRect(x,y,1,l);}
  for(let i=0;i<W*H*0.09;i++){g.fillStyle=rnd()<0.5?'rgba(255,255,255,'+(0.03+rnd()*0.08)+')':'rgba(10,0,30,'+(0.05+rnd()*0.12)+')';g.fillRect((rnd()*W)|0,(rnd()*H)|0,1,1);}
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(255,230,255,0.14)');gr.addColorStop(0.45,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(10,0,30,0.16)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<(scratch||0);i++){const x=rnd()*W,y=rnd()*H,l=5+rnd()*12;g.strokeStyle='rgba(255,235,255,'+(0.18+rnd()*0.2)+')';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+l*0.4,y+l);g.stroke();}
  for(let i=0;i<(scratch||0)/2;i++){const x=rnd()*W,y=H*(0.6+rnd()*0.4);gr=g.createRadialGradient(x,y,0,x,y,5+rnd()*6);gr.addColorStop(0,'rgba(60,10,90,0.28)');gr.addColorStop(1,'rgba(60,10,90,0)');g.fillStyle=gr;g.fillRect(x-12,y-12,24,24);}
  g.restore();
}
const _barsCache={};
function barsSprite(n,variant){   // 鉄格子の壁（n=マス数）。横にぴったりつながる。棒のあいだは透明（うしろの床・本棚・人が見える）
  const key=n+'_'+variant;if(_barsCache[key])return _barsCache[key];
  const c=document.createElement('canvas');c.width=60;c.height=60*n;const g=c.getContext('2d');
  const rnd=mulberry32(7000+variant*131+n*17),H=30*n;
  g.fillStyle='rgba(30,0,70,0.16)';g.fillRect(0,0,60,H*2);   // うしろがほんの少し暗く見えるだけ（透け感）
  let gr;
  gr=g.createLinearGradient(0,6,0,40);gr.addColorStop(0,'rgba(10,0,30,0.30)');gr.addColorStop(1,'rgba(10,0,30,0)');g.fillStyle=gr;g.fillRect(0,6,60,34);   // 上の梁の影
  for(let k=0;k<5;k++){const x0=1+k*6;
    pxr(g,x0+4,3,0.9,H-6,'rgba(8,0,24,0.55)');                  // 棒が落とす影
    pxr(g,x0,3,4,H-6,IRON.d0);
    pxr(g,x0+1,3,1,H-6,IRON.h0);pxr(g,x0+1,3,0.5,H-6,IRON.h2);    // ハイライト
    pxr(g,x0+2,3,1,H-6,IRON.b0);pxr(g,x0+2.5,3,0.5,H-6,IRON.m2);
    pxr(g,x0+3,3,1,H-6,IRON.d1);
    pxr(g,x0,H-4,4,1,IRON.d0);pxr(g,x0,3,4,1,IRON.d0);          // 継ぎ目
  }
  // 上の梁（明るい帯）
  const rows=[IRON.h2,IRON.h1,IRON.h1,IRON.b1,IRON.m1,IRON.d0];
  rows.forEach((col,i)=>{g.fillStyle=col;g.fillRect(0,i,60,1);});
  // 下の梁
  const brow=[IRON.b0,IRON.d0,IRON.h1,IRON.h0,IRON.b1,IRON.d0];

  ironTexture(c,rnd,5*n);
  return _barsCache[key]=c;
}

function leafSprite(){   // 横にスライドするドア本体（26x54ドット）
  if(_leaf)return _leaf;
  const W=26,H=54,c=document.createElement('canvas');c.width=W*2;c.height=H*2;const g=c.getContext('2d');
  const D=IRON.d0,D1=IRON.d1;
  pxr(g,0,0,W,H,D);pxr(g,1,1,W-2,H-2,IRON.h0);                // 外枠と明るい枠
  pxr(g,1,1,1,H-2,IRON.h2);pxr(g,W-3,1,2,H-2,IRON.b0);pxr(g,W-2,1,1,H-2,IRON.m2);
  pxr(g,1,1,W-2,0.5,IRON.h2);
  // 上のパネル（くぼみ）
  pxr(g,4,3,18,26,D1);pxr(g,5,4,16,24,IRON.h0);
  pxr(g,5,4,16,0.5,IRON.d1);pxr(g,5,4,0.5,24,IRON.m0);pxr(g,5.5,4.5,15,1,IRON.h1);pxr(g,5.5,27.5,15,0.5,IRON.h2);
  // 紋章：△（さんかく）
  const tri=(ax,ay,bx,by,cx,cy,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.lineTo(cx,cy);g.closePath();g.fill();};
  tri(26,13,6,52,46,52,D);                                   // 外のふち（濃い）
  tri(26,18,11,49,41,49,IRON.m1);                            // 本体
  tri(26,18,11,49,26,49,IRON.m2);                            // 左の面（明るい）
  tri(26,18,26,49,41,49,IRON.m0);                            // 右の面（暗い）
  g.strokeStyle=IRON.h2;g.lineWidth=1;g.beginPath();g.moveTo(26,19.5);g.lineTo(12.5,48);g.stroke();   // 左ふちの光
  g.fillStyle=IRON.d1;g.fillRect(11,49,30,1.5);              // 底の影
  g.fillStyle='rgba(40,0,90,0.45)';g.fillRect(25.5,22,1,26);  // 稜線
  // 取っ手の板
  pxr(g,0,28,W,9,D);pxr(g,1,29,W-2,7,IRON.h1);pxr(g,1,29,W-2,1,IRON.h2);pxr(g,1,34.5,W-2,1.5,IRON.b0);
  pxr(g,21,31,1.5,3,D1);pxr(g,3,31.5,8,0.5,'rgba(255,255,255,0.35)');
  // 下のパネルと二本のすき間
  pxr(g,4,38,18,13,D1);pxr(g,5,39,16,11,IRON.h0);
  pxr(g,5,39,16,0.5,IRON.d1);pxr(g,5,39,0.5,11,IRON.m0);pxr(g,5.5,49.3,15,0.7,IRON.h2);
  for(const y0 of [41,46]){pxr(g,6,y0,14,1,D1);pxr(g,6.5,y0+1,13,2,IRON.m1);pxr(g,6.5,y0+1,13,0.5,IRON.m2);pxr(g,8,y0+3,10,1,D1);}
  ironTexture(c,mulberry32(4242),9);
  // 立体感：左上の光・右下の影を1pxで
  const g2=c.getContext('2d');g2.save();g2.globalCompositeOperation='source-atop';
  g2.fillStyle='rgba(255,240,255,0.35)';g2.fillRect(2,2,1,H*2-4);g2.fillRect(2,2,W*2-4,1);
  g2.fillStyle='rgba(10,0,30,0.35)';g2.fillRect(W*2-3,2,1,H*2-4);g2.fillRect(2,H*2-3,W*2-4,1);g2.restore();
  return _leaf=c;
}

function doorSlideSE(){
  try{const ac=seCtx;if(!ac||ac.state==='suspended')return;const t=ac.currentTime,len=0.5;
    const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*len),ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const sr=ac.createBufferSource();sr.buffer=buf;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=2.5;
    f.frequency.setValueAtTime(260,t);f.frequency.linearRampToValueAtTime(820,t+len);
    const gn=ac.createGain();gn.gain.setValueAtTime(0.22,t);gn.gain.linearRampToValueAtTime(0,t+len);
    sr.connect(f);f.connect(gn);gn.connect(ac.destination);sr.start(t);
    const o=ac.createOscillator();o.type='square';o.frequency.setValueAtTime(170,t+len);
    const g2=ac.createGain();g2.gain.setValueAtTime(0.0001,t);g2.gain.setValueAtTime(0.12,t+len);g2.gain.exponentialRampToValueAtTime(0.001,t+len+0.14);
    o.connect(g2);g2.connect(ac.destination);o.start(t+len);o.stop(t+len+0.16);
  }catch(e){}
}

function drawAmFloor(b,rnd,isFl,RW,RH,LW,LH,T){   // 黒紫のみがき石の床 ＋ 光る紫のひび
  b.save();b.beginPath();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++)if(isFl(x,y))b.rect(x*T,y*T,T,T);
  b.clip();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!isFl(x,y))continue;
    const px=x*T,py=y*T;
    b.fillStyle=(x+y)&1?'rgba(10,0,40,0.22)':'rgba(190,130,255,0.07)';b.fillRect(px,py,T,T);
    b.fillStyle='rgba(215,160,255,0.40)';b.fillRect(px,py,T,1);b.fillRect(px,py,1,T);
    b.fillStyle='rgba(8,0,36,0.5)';b.fillRect(px,py+T-1,T,1);b.fillRect(px+T-1,py,1,T);
  }
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!isFl(x,y)||rnd()>0.22)continue;
    let cx=x*T+4+rnd()*(T-8),cy=y*T+4+rnd()*(T-8),a=rnd()*6.28;
    for(let k=0,n=3+((rnd()*3)|0);k<n;k++){
      const nx=cx+Math.cos(a)*(4+rnd()*6),ny=cy+Math.sin(a)*(3+rnd()*5);
      b.strokeStyle='rgba(190,80,255,0.35)';b.lineWidth=3;b.beginPath();b.moveTo(cx,cy);b.lineTo(nx,ny);b.stroke();
      b.strokeStyle='rgba(245,200,255,0.9)';b.lineWidth=1;b.beginPath();b.moveTo(cx,cy);b.lineTo(nx,ny);b.stroke();
      cx=nx;cy=ny;a+=(rnd()-0.5)*1.2;
    }
  }
  for(let s=-LH;s<LW;s+=60+((rnd()*50)|0)){   // つやの反射
    const w=6+rnd()*14;b.fillStyle='rgba(220,170,255,'+(0.04+rnd()*0.06).toFixed(3)+')';

  }
  b.restore();
}

function drawBossCarpet(b,room){   // ラスボスの間：入口から玉座へのびる「水晶の道」＋ 玉座の大きな魔法陣
  const T=30,e=room.bossEntry,S=room.bossSpot;if(!e||!S)return;

  else if(e==='r'){y0=4;y1=5;x0=S.b[0];x1=RW-2;}

  b.strokeStyle='rgba(235,180,255,0.8)';b.lineWidth=1.6;b.beginPath();b.arc(0,0,66,0,7);b.stroke();
  b.lineWidth=1;b.beginPath();b.arc(0,0,58,0,7);b.stroke();b.beginPath();b.arc(0,0,26,0,7);b.stroke();
  for(let k=0;k<2;k++){b.beginPath();for(let i=0;i<3;i++){const a=k*Math.PI/3+i*2*Math.PI/3-Math.PI/2;if(i)b.lineTo(Math.cos(a)*58,Math.sin(a)*58);else b.moveTo(Math.cos(a)*58,Math.sin(a)*58);}b.closePath();b.stroke();}   // 六芒星

const MINE_LEAD=0.5,MINE_TRAVEL=3.0;   // レバーを引いてから走りだすまで／衝突までの秒数
function mineNoise(len,f0,f1,vol,type){
  try{const ac=seCtx;if(!ac||ac.state==='suspended')return;const t=ac.currentTime;
    const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*len),ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const sr=ac.createBufferSource();sr.buffer=buf;const f=ac.createBiquadFilter();f.type=type||'lowpass';
    f.frequency.setValueAtTime(f0,t);f.frequency.linearRampToValueAtTime(f1,t+len);
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+len);
    sr.connect(f);f.connect(g);g.connect(ac.destination);sr.start(t);}catch(e){}
}
function mineTone(freq,dt,dur,vol,type){
  try{const ac=seCtx;if(!ac||ac.state==='suspended')return;const t=ac.currentTime+dt;
    const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
}
function mineCartX(m){   // トロッコの中心（タイル単位）
  const a=m.x0+1.5,b=m.wx-0.55;
  if(!m.pulled)return a;
  if(m.done)return b;
  const u=clamp((m.t-MINE_LEAD)/(MINE_TRAVEL-MINE_LEAD),0,1);
  return a+(b-a)*(u*u*0.9+u*0.1);
}
function findLever(){
  if(!map||G.mode!=='dungeon'||!curRoom||!curRoom.mine||curRoom.mine.pulled)return null;
  const m=curRoom.mine,fx=player.x,fy=player.y+PFEET;
  return Math.hypot(fx-(m.lx+0.5)*TILE,fy-(m.ly+0.5)*TILE)<=TILE*1.4?m:null;
}
function tryPullLever(){
  const m=findLever();if(!m)return false;
  m.pulled=true;m.t=0;m._fx=[];m._rum=false;
  mineTone(150,0,0.09,0.16,'square');mineTone(80,0.08,0.14,0.18,'square');
  G.msg={text:'レバーを ひいた！ トロッコが うごきだす…'};G.msgT=2.4;

function mineCrash(m){

  buildRoomCanvas(curRoom);

    m._fx.push({x:cx,y:cy,vx:Math.cos(a)*sp+160,vy:Math.sin(a)*sp-120,t:0,life:0.9+Math.random()*0.7,s:4+((Math.random()*7)|0),g:520,col:['#7a6a88','#5a4a68','#a090b0','#8a5a2c'][(Math.random()*4)|0]});

function updateMine(dt){
  if(G.dshake>0)G.dshake-=dt;
  const m=curRoom&&curRoom.mine;if(!m)return;
  if(m._fx&&m._fx.length){
    for(const p of m._fx){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g===undefined?300:p.g)*dt;}
    m._fx=m._fx.filter(p=>p.t<p.life);
  }
  if(!m.pulled||m.done)return;
  m.t+=dt;
  if(m.t>=MINE_LEAD){
    if(!m._rum){m._rum=true;mineNoise(MINE_TRAVEL-MINE_LEAD,260,1000,0.2,'lowpass');}
    G.dshake=Math.max(G.dshake||0,0.1);
    m._fx=m._fx||[];
    if(Math.random()<0.7)m._fx.push({x:mineCartX(m)*60-30,y:(m.ry+0.5)*60+20,vx:-40-Math.random()*60,vy:-30-Math.random()*40,t:0,life:0.5,s:3,g:-30,col:'#b8a8c8'});
  }
  if(m.t>=MINE_TRAVEL)mineCrash(m);
}

function drawShelf(b,px,py,rnd,low){   // low=true: 上が床のとき。絵をちょうど1マスに収める（当たり判定と同じ大きさ）
  //   // ドット絵の本棚（参考画像ふう：どっしりした上板＋本のならぶ棚／30x30タイルの上にはみ出す）
  const R=(x,y,w,h,c)=>{b.fillStyle=c;b.fillRect(x,y,w,h);};
  const OL='#1c0a02',TOP='#512a03',TOPH='#6b3a0a',SEAM='#2d1604',FR='#64390f',FRH='#7c4a18',FRD='#4a2708';
  const BG='#2f1902',BOARD='#6e4016',BOARDD='#3a1c08',LIGHT='#ffffff',DARK='#000000';
  const W=28,x0=px+1,yb=py+28,CH=11;
  const v=rnd();
  const n=low?1:(v<0.28?1:2);         // 1段（低め）／2段
  const broken=!low&&v>0.74;          // 上板がこわれたタイプ
  const trophy=(!low&&n===2&&!broken&&v>=0.28&&v<0.5);
  const tp=low?9:(n===1?12:11);       // low のときは全体の高さ=28px（1マスぴったり）
  const bodyH=n*CH+(n-1)*2;
  const H=1+tp+2+2+bodyH+2+1,y0=yb-H;
  // 床の影
  R(x0+1,yb-2,W+1,4,'rgba(10,0,30,0.45)');
  // ふち（外わく）
  R(x0,y0+tp+1,W,H-tp-1,OL);
  // 上板（こわれたタイプは右上がギザギザにかける）
  const cut=broken?[13,13,12,10,10,8,7,5,4,2,2,0]:[];
  for(let r=0;r<=tp;r++){
    const y=y0+r,L=W-(cut[r]||0),Lp=r>0?W-(cut[r-1]||0):0;
    R(x0,y,L,1,OL);
    if(r>0){
      const w=Math.min(L,Lp)-2;
      if(w>0)R(x0+1,y,w,1,TOP);
      if(broken&&L<=Lp&&L-2>=1&&(cut[r]||0)>0)R(x0+L-2,y,1,1,'#8a5218');   // われた木のあたらしい断面
    }
  }
  if(!broken)R(x0+1,y0+1,W-2,1,TOPH);         // 上板のてっぺんの光
  R(x0+1,y0+2,1,tp-1,'#5c3208');               // 左の光
  for(let g=0;g<4;g++)R(x0+2+((rnd()*(W-9))|0),y0+2+((rnd()*(tp-2))|0),3+((rnd()*3)|0),1,'#452402');   // 木目
  // 上板の下の影と、棚のレール
  R(x0+1,y0+1+tp,W-2,2,SEAM);
  R(x0+1,y0+3+tp,W-2,2,FR);R(x0+1,y0+3+tp,W-2,1,BOARD);
  // 側板（明るい茶）と 棚の中
  const yi=y0+5+tp,xi=x0+3;
  R(x0+1,yi,2,bodyH,FR);R(x0+1,yi,1,bodyH,FRH);
  R(x0+W-3,yi,2,bodyH,FR);R(x0+W-2,yi,1,bodyH,FRD);
  R(xi,yi,W-6,bodyH,BG);
  R(xi,yi,W-6,1,'#241100');
  for(let k=1;k<n;k++){   // 段の板
    const by=yi+k*CH+(k-1)*2;
    R(x0+1,by,W-2,2,BOARD);R(x0+1,by+1,W-2,1,BOARDD);
  }
  R(x0+1,yi+bodyH,W-2,2,BOARDD);R(x0+1,yi+bodyH,W-2,1,BOARD);   // 底の板
  // ---- 本 ----
  const PAL=['#037182','#7b0209','#740474','#0b7909','#928b16','#1f4fb0','#a4531a'];
  const book=(x,fy,w,h,c)=>{
    R(x,fy-h,w,h,c);
    R(x,fy-h,1,h,lerpCol(c,LIGHT,0.32));
    R(x+w-1,fy-h,1,h,lerpCol(c,DARK,0.4));
    R(x,fy-h,w,1,lerpCol(c,LIGHT,0.5));
    if(h>=8&&w>=3)R(x+1,fy-h+3,w-2,1,'#d8c890');
  };
  const lean=(x,fy,h,c)=>{   // ななめにもたれた本
    for(let i=0;i<h;i++){
      const off=i>>1;
      R(x+off,fy-1-i,3,1,c);R(x+off,fy-1-i,1,1,lerpCol(c,LIGHT,0.35));
    }
  };
  const cup=(cx,fy)=>{      // 金のトロフィー
    const G='#928b16',GL='#d6cf5a',GD='#6d5c26';
    R(cx-3,fy-1,7,1,GD);R(cx-2,fy-2,5,1,G);R(cx,fy-4,1,2,G);R(cx-1,fy-4,3,1,GD);
    R(cx-3,fy-8,7,4,G);R(cx-2,fy-9,5,1,G);R(cx-3,fy-5,7,1,GD);
    R(cx-2,fy-8,1,3,GL);
    R(cx-4,fy-8,1,3,G);R(cx+4,fy-8,1,3,G);
  };
  const fillBooks=(k,opt)=>{
    opt=opt||{};
    const fy=yi+k*(CH+2)+CH,xs=xi+1,xe=xi+W-6-1;
    const tx=opt.trophy?xs+5+((rnd()*5)|0):-99;
    if(opt.trophy)cup(tx+4,fy);
    let x=xs;const lim=opt.limit||xe;
    while(x<lim){
      if(x>=tx-1&&x<tx+9){x=tx+9;continue;}
      const r=rnd();
      if(r<0.07){x+=2+((rnd()*2)|0);continue;}
      if(r<0.16&&x+7<=lim&&!(x+7>tx-1&&x<tx+9)){lean(x,fy,8+((rnd()*2)|0),PAL[(rnd()*PAL.length)|0]);x+=8;continue;}
      const w=2+((rnd()*3)|0),h=CH-4+((rnd()*4)|0);
      if(x+w>lim)break;
      book(x,fy,w,h,PAL[(rnd()*PAL.length)|0]);
      x+=w+(rnd()<0.25?1:0);
    }
  };
  for(let k=0;k<n;k++){
    if(broken&&k===n-1){   // こわれた棚：本がすこし＋たおれた本
      const fy=yi+k*(CH+2)+CH;
      fillBooks(k,{limit:xi+9});
      R(xi+8,fy-3,13,3,'#740474');R(xi+8,fy-3,13,1,lerpCol('#740474',LIGHT,0.4));R(xi+20,fy-3,1,3,'#e8e0f0');
    }else fillBooks(k,{trophy:trophy&&k===0});
  }
}

function drawIceFloorTex(b,rnd,isFl,RW,RH,LW,LH,T){
  b.save();b.beginPath();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){if(isFl(x,y))b.rect(x*T,y*T,T,T);}
  b.clip();
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){   // 氷板：1マスごとに明暗 ＋ 面取りのふち
    if(!isFl(x,y))continue;
    const px=x*T,py=y*T,q=rnd();
    b.fillStyle=q<0.5?'rgba(8,60,150,'+(0.04+rnd()*0.10).toFixed(3)+')':'rgba(235,252,255,'+(0.04+rnd()*0.10).toFixed(3)+')';
    b.fillRect(px,py,T,T);
    b.fillStyle='rgba(240,253,255,0.5)';b.fillRect(px,py,T,1);b.fillRect(px,py,1,T);
    b.fillStyle='rgba(10,70,160,0.38)';b.fillRect(px,py+T-1,T,1);b.fillRect(px+T-1,py,1,T);
    b.fillStyle='rgba(240,253,255,0.16)';b.fillRect(px+1,py+1,T-2,1);b.fillRect(px+1,py+1,1,T-2);
  }
  b.lineWidth=1;
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){   // 氷のひび割れ（白い線＋青いかげ）
    if(!isFl(x,y)||rnd()>0.2)continue;
    let cx=x*T+4+rnd()*(T-8),cy=y*T+4+rnd()*(T-8),ang=rnd()*6.28;
    const n=3+((rnd()*4)|0);
    for(let k=0;k<n;k++){
      const nx=cx+Math.cos(ang)*(4+rnd()*6),ny=cy+Math.sin(ang)*(3+rnd()*5);
      b.strokeStyle='rgba(8,70,150,0.45)';b.beginPath();b.moveTo(cx+1,cy+1);b.lineTo(nx+1,ny+1);b.stroke();
      b.strokeStyle='rgba(245,254,255,0.85)';b.beginPath();b.moveTo(cx,cy);b.lineTo(nx,ny);b.stroke();
      if(rnd()<0.35){
        const a2=ang+(rnd()<0.5?-1:1)*(0.6+rnd()*0.6),bx=nx+Math.cos(a2)*(3+rnd()*4),by=ny+Math.sin(a2)*(3+rnd()*4);
        b.strokeStyle='rgba(245,254,255,0.6)';b.beginPath();b.moveTo(nx,ny);b.lineTo(bx,by);b.stroke();
      }
      cx=nx;cy=ny;ang+=(rnd()-0.5)*1.2;
    }
  }
  for(let s=-LH;s<LW;s+=46+((rnd()*40)|0)){   // 氷のつやの反射（ななめの光の帯）
    const w=6+rnd()*14;
    b.fillStyle='rgba(255,255,255,'+(0.05+rnd()*0.07).toFixed(3)+')';
    b.beginPath();b.moveTo(s,LH);b.lineTo(s+w,LH);b.lineTo(s+w+LH*0.7,0);b.lineTo(s+LH*0.7,0);b.closePath();b.fill();
  }
  for(let i=0;i<RW*RH*1.2;i++){   // 気泡・霜のつぶ
    const x=rnd()*LW,y=rnd()*LH;
    if(rnd()<0.35){
      const r=1+rnd()*2;
      b.strokeStyle='rgba(235,252,255,0.45)';b.beginPath();b.arc(x,y,r,0,7);b.stroke();
      b.fillStyle='rgba(255,255,255,0.7)';b.fillRect((x-r*0.5)|0,(y-r*0.5)|0,1,1);
    }else{
      b.fillStyle=rnd()<0.6?'rgba(255,255,255,0.35)':'rgba(10,80,170,0.25)';
      b.fillRect(x|0,y|0,1+((rnd()*2)|0),1);
    }
  }
  b.restore();
}

function drawAmAmbient(){   // 主の間：クリスタルの脈うつ光 ＋ 立ちのぼる紫の光のつぶ
  if(!curRoom||!mapCanvas)return;
  const t=G.time,RWp=mapCanvas.width,RHp=mapCanvas.height,S=curRoom.bossSpot;
  const hs=(i,k)=>{const v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v);};
  ctx.save();ctx.translate(-camX,-camY);ctx.globalCompositeOperation='lighter';

    const cx=S.c[0]*60+30,cy=S.c[1]*60+30,p=0.5+0.5*Math.sin(t*2.2);

    ctx.fillStyle=g;ctx.fillRect(cx-230,cy-230,460,460);
  }
  for(let i=0;i<46;i++){
    const sp=14+hs(i,3)*26,x=hs(i,4)*RWp+Math.sin(t*0.9+i)*14,y=RHp-((hs(i,5)*RHp+t*sp)%RHp);
    const a=0.25+0.55*(0.5+0.5*Math.sin(t*2+i*2.3)),s=hs(i,6)<0.3?4:2;
    ctx.fillStyle='rgba('+(hs(i,7)<0.5?'225,170,255,':'255,210,255,')+a.toFixed(2)+')';ctx.fillRect(Math.round(x),Math.round(y),s,s);
  }
  for(let i=0;i<16;i++){
    const x=Math.round(70+hs(i,1)*(RWp-140)),y=Math.round(130+hs(i,2)*(RHp-200)),a=Math.sin(t*2.4+i*1.9);if(a<=0.25)continue;
    const L=Math.round(3+a*7);

    ctx.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';ctx.fillRect(x-1,y-1,3,3);
  }
  ctx.restore();
}
function drawIceAmbient(){   // 動く演出：きらめき ＋ 舞う雪

  const hs=(i,k)=>{const v=Math.sin(i*127.1+k*311.7)*43758.5453;return v-Math.floor(v);};

  for(let i=0;i<22;i++){
    const x=Math.round(60+hs(i,1)*(RWp-120)),y=Math.round(150+hs(i,2)*(RHp-210));

}

// 参考画像のような見た目：闇に浮かぶ部屋 / 紫レンガの正面壁 / 明るい紫の床 / ネオンの縁 / 松明の光
function buildRoomBase(room){   // 重い部分（床・壁・家具・ベッド）。いちど作ったら使い回す
  const m=room.map,T=30;
  const RW=m[0].length,RH=m.length,LW=RW*T,LH=RH*T;   // 部屋まるごとの絵の大きさ（広い部屋は画面より大きい）
  const lo=document.createElement('canvas');lo.width=LW;lo.height=LH;
  const b=lo.getContext('2d');
  const rnd=mulberry32(room.seed);
  const inR=(x,y)=>x>=0&&y>=0&&x<RW&&y<RH;
  const isWall=(x,y)=>inR(x,y)&&m[y][x]===1;
  const isFl=(x,y)=>inR(x,y)&&m[y][x]!==1;
  const isDoor=(x,y)=>inR(x,y)&&m[y][x]===0&&isDoorTile(m,x,y);
  const face=(x,y)=>isFaceTile(m,x,y);
  const ICE=room.theme==='icehall',BR=room.theme==='bossroom';   // 10Fの氷の間
  b.fillStyle='#000';b.fillRect(0,0,LW,LH);   // 部屋の外は闇

  // ① 床（明るい紫の石畳）＋ 1枚ずつ表情の違うレンガ
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!isFl(x,y))continue;
    for(let yy=0;yy<T;yy++){b.fillStyle=ICE?lerpCol('#2f86d0','#9fe0ff',clamp((y*T+yy-60)/200,0,1)):BR?lerpCol('#3a1280','#5a24a8',clamp((y*T+yy-60)/200,0,1)):lerpCol('#7a2ecb','#9247e0',clamp((y*T+yy-60)/200,0,1));b.fillRect(x*T,y*T+yy,T,1);}
  }
  if(ICE)drawIceFloorTex(b,rnd,isFl,RW,RH,LW,LH,T);else{
    const fc=document.createElement('canvas');fc.width=LW;fc.height=LH;
    const f=fc.getContext('2d');
    const BW=16,BH=6;
    // 大きなムラ（タイルごとの明暗）
    for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
      const q=rnd();
      f.fillStyle=q<0.5?'rgba(50,0,120,'+(0.02+rnd()*0.07).toFixed(3)+')':'rgba(230,190,255,'+(0.02+rnd()*0.06).toFixed(3)+')';
      f.fillRect(x*T,y*T,T,T);
    }
    for(let r=0;r*BH<LH;r++){
      const by=r*BH,off=(r&1)?BW/2:0;
      for(let bx=-off;bx<LW;bx+=BW){
        const q=rnd();
        if(q<0.30){f.fillStyle='rgba(60,10,130,0.17)';f.fillRect(bx,by,BW,BH);}
        else if(q>0.78){f.fillStyle='rgba(235,195,255,0.11)';f.fillRect(bx,by,BW,BH);}
        f.fillStyle='rgba(228,195,255,0.24)';f.fillRect(bx+1,by,BW-2,1);          // 上のハイライト
        f.fillStyle='rgba(228,195,255,0.10)';f.fillRect(bx,by+1,1,BH-2);          // 左の光
        f.fillStyle='rgba(42,0,108,0.36)';f.fillRect(bx,by+BH-1,BW,1);            // 下の目地
        f.fillStyle='rgba(42,0,108,0.28)';f.fillRect(bx+BW-1,by,1,BH);            // 右の目地
        const n=(rnd()*4)|0;
        for(let i=0;i<n;i++){                                                      // ざらつき
          f.fillStyle=rnd()<0.5?'rgba(255,255,255,0.14)':'rgba(40,0,100,0.26)';
          f.fillRect(bx+2+((rnd()*(BW-5))|0),by+1+((rnd()*(BH-3))|0),1,1);
        }
        if(rnd()<0.06){                                                            // ひび割れ
          f.fillStyle='rgba(36,0,88,0.6)';
          let cx=bx+3+((rnd()*9)|0);
          for(let k=1;k<BH-1;k++){f.fillRect(cx,by+k,1,1);if(rnd()<0.55)cx+=rnd()<0.5?-1:1;}
        }
        if(rnd()<0.04){f.fillStyle='rgba(20,0,60,0.30)';f.fillRect(bx+3+((rnd()*8)|0),by+2,3,2);}   // 欠け
      }
    }
    b.save();b.beginPath();
    for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){if(isFl(x,y))b.rect(x*T,y*T,T,T);}
    b.clip();b.drawImage(fc,0,0);b.restore();
  }
  if(BR)drawAmFloor(b,rnd,isFl,RW,RH,LW,LH,T);
  // ② 正面の壁（紫レンガ）
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!face(x,y))continue;
    if(ICE){drawIceWallTile(b,x,y,T,rnd,isFl(x,y+1));continue;}
    if(BR){drawAmWallTile(b,x,y,T,rnd,isFl(x,y+1));continue;}
    const x0=x*T,y0=y*T;
    b.save();b.beginPath();b.rect(x0,y0,T,T);b.clip();
    for(let r=y0/6;r<(y0+T)/6;r++){
      const t=((r%10)/10)*0.75;
      const body=lerpCol('#6c2aa8','#4a1580',t),mort=lerpCol('#3a0f66','#26064a',t),hi=lerpCol('#9250d0','#6a2ea8',t);
      b.fillStyle=mort;b.fillRect(x0,r*6,T,6);
      for(let bx=-14+((r&1)?7:0);bx<x0+T;bx+=14){
        if(bx+14<=x0)continue;
        b.fillStyle=body;b.fillRect(bx+1,r*6+1,12,4);
        b.fillStyle=hi;b.fillRect(bx+1,r*6+1,12,1);
        const q=rnd();
        if(q<0.22){b.fillStyle='rgba(10,0,30,0.28)';b.fillRect(bx+1,r*6+1,12,4);}

      }
    }
    if(isFl(x,y+1)){b.fillStyle='rgba(16,0,40,0.38)';b.fillRect(x0,y0+T-5,T,5);}   // 足元の影
    b.restore();
  }
  // ③ 鉄格子の窓
  for(const sx of (room.windows||[])){
    if(ICE){drawIceWindow(b,sx);continue;}
    if(BR){drawAmWindow(b,sx);continue;}
    b.fillStyle='#22004a';b.fillRect(sx,8,54,44);
    b.fillStyle='#340c68';b.fillRect(sx,34,54,10);
    for(let x=sx+3;x<sx+52;x+=7){
      b.fillStyle='#4a1a8a';b.fillRect(x+2,11,1,38);
      b.fillStyle='#8b46cc';b.fillRect(x,11,2,38);

    }
    b.fillStyle='#a35de6';b.fillRect(sx,8,54,3);b.fillStyle='#d2b0ff';b.fillRect(sx,8,54,1);
    b.fillStyle='#8a46d0';b.fillRect(sx,49,54,3);b.fillStyle='#b884f0';b.fillRect(sx,49,54,1);
    b.fillStyle='#1d0a3d';b.fillRect(sx-1,6,1,48);b.fillRect(sx+54,6,1,48);

  // ⑤ 床のまわりの影
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(!isFl(x,y))continue;
    const px=x*T,py=y*T;
    for(let i=0;i<8;i++){
      const a=(0.34-i*0.04).toFixed(3);b.fillStyle=(ICE?'rgba(4,28,76,':'rgba(28,0,66,')+a+')';
      if(isWall(x,y-1))b.fillRect(px,py+i,T,1);
      if(isWall(x-1,y))b.fillRect(px+i,py,1,T);
      if(isWall(x+1,y))b.fillRect(px+T-1-i,py,1,T);
      if(isWall(x,y+1)&&i<4)b.fillRect(px,py+T-1-i,T,1);
    }
  }
  // ⑥ ネオンの縁
  const L1=ICE?'#eafcff':BR?'#f4d4ff':'#d8b8ff',L2=ICE?'#4fb8ea':BR?'#b455ff':'#8a4cc8';
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    if(face(x,y)){   // 正面の壁のふち
      const px=x*T,py=y*T;
      // となりが奥の壁（まっ黒）のときは、床のふち(2ドットはみ出す)と ぴったり つながるように 外がわへ2ドットずらす
      const dL=(isWall(x-1,y)&&!face(x-1,y)),dR=(isWall(x+1,y)&&!face(x+1,y));
      const exL=dL?2:0,exR=dR?2:0;
      if(!face(x,y-1)&&y>0){b.fillStyle=L2;b.fillRect(px-exL,py+1,T+exL+exR,1);b.fillStyle=L1;b.fillRect(px-exL,py,T+exL+exR,1);}
      if(!face(x-1,y)){
        if(dL){b.fillStyle=L2;b.fillRect(px-2,py,1,T);b.fillStyle=L1;b.fillRect(px-1,py,1,T);}
        else{b.fillStyle=L2;b.fillRect(px+1,py,1,T);b.fillStyle=L1;b.fillRect(px,py,1,T);}
      }
      if(!face(x+1,y)){
        if(dR){b.fillStyle=L1;b.fillRect(px+T,py,1,T);b.fillStyle=L2;b.fillRect(px+T+1,py,1,T);}
        else{b.fillStyle=L2;b.fillRect(px+T-2,py,1,T);b.fillStyle=L1;b.fillRect(px+T-1,py,1,T);}
      }
      if(isFl(x,y+1)){b.fillStyle=L2;b.fillRect(px-exL,py+T-2,T+exL+exR,1);b.fillStyle=L1;b.fillRect(px-exL,py+T-1,T+exL+exR,1);}
    }
    if(!isFl(x,y))continue;
    const px=x*T,py=y*T;
    const exL=(isWall(x-1,y))?2:0,exR=(isWall(x+1,y))?2:0;
    if(isWall(x,y-1)&&!face(x,y-1)){b.fillStyle=L2;b.fillRect(px-exL,py-2,T+exL+exR,1);b.fillStyle=L1;b.fillRect(px-exL,py-1,T+exL+exR,1);}
    if(isWall(x,y+1)&&!face(x,y+1)){b.fillStyle=L1;b.fillRect(px-exL,py+T,T+exL+exR,1);b.fillStyle=L2;b.fillRect(px-exL,py+T+1,T+exL+exR,1);}
    if(isWall(x-1,y)&&!face(x-1,y)){b.fillStyle=L2;b.fillRect(px-2,py,1,T);b.fillStyle=L1;b.fillRect(px-1,py,1,T);}
    if(isWall(x+1,y)&&!face(x+1,y)){b.fillStyle=L1;b.fillRect(px+T,py,1,T);b.fillStyle=L2;b.fillRect(px+T+1,py,1,T);}
  }
  // ⑦ 床の飾り → 置き物（上の行から順に描く）
  if(room.theme==='bossroom')drawBossCarpet(b,room);
  if(ICE)drawIceEmblem(b,RW,RH,T);
  for(const d of (room.decor||[])){if(m[d.y][d.x]!==0)continue;if(d.t==='k')(ICE?drawIceShards:BR?drawAmShards:drawBones)(b,d.x*T,d.y*T);else if(d.t==='v')(ICE?drawIcePuddle:BR?drawAmPuddle:drawBlood)(b,d.x*T,d.y*T);else if(d.t==='r')drawRail(b,d.x*T,d.y*T);else if(d.t==='rb')drawRubble(b,d.x*T,d.y*T,d.x*7+d.y);}
  const isBedRoom=['cells','bigcage','dorm','bigblock','bigtower'].includes(room.theme);
  const cellAdj=(x,y)=>[[1,0],[-1,0],[0,-1],[0,1]].some(q=>inR(x+q[0],y+q[1])&&m[y+q[1]][x+q[0]]===11);
  const isTb=(x,y)=>inR(x,y)&&(m[y][x]===8||m[y][x]===12);
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    const v=m[y][x],px=x*T,py=y*T;
    if(v===2)drawShelf(b,px,py,rnd,y>0&&m[y-1][x]!==1);   // すぐ上が壁なら背の高い本棚、床なら1マスに収まる本棚
    else if(v===3&&ICE)drawIcePillar(b,px,py);
    else if(v===3&&BR)drawAmPillar(b,px,py);
    else if(v===3&&room.theme==='bigmine')drawTimber(b,px,py);
    else if(v===3){
      b.fillStyle='rgba(10,0,30,0.45)';b.fillRect(px+2,py+24,28,5);
      b.fillStyle='#1a0533';b.fillRect(px+3,py+1,24,27);
      b.fillStyle='#6d34a8';b.fillRect(px+4,py+2,22,25);
      b.fillStyle='#a87ae8';b.fillRect(px+4,py+2,22,6);
      b.fillStyle='#c9a4f5';b.fillRect(px+4,py+2,22,1);
      b.fillStyle='#4a1f78';b.fillRect(px+4,py+20,22,7);
      b.fillStyle='#3a1560';b.fillRect(px+4,py+13,22,1);b.fillRect(px+14,py+8,1,5);b.fillRect(px+9,py+14,1,6);b.fillRect(px+19,py+14,1,6);
    }
    else if(v===4){if(!isBedRoom)drawBars(b,px,py);}
    else if(v===5)drawBarrel(b,px,py);
    else if(v===6)drawCrate(b,px,py);
    else if(v===7){if(cellAdj(x,y))drawCellFloor(b,px,py,rnd);if(!isBedRoom)drawCot(b,px,py);}
    else if(v===8)drawTable(b,px,py,isTb(x-1,y),isTb(x+1,y),false,rnd);
    else if(v===12)drawTable(b,px,py,isTb(x-1,y),isTb(x+1,y),true,rnd);
    else if(v===9)(ICE?drawIceStatue:BR?drawAmStatue:drawStatue)(b,px,py);
    else if(v===11&&!isBedRoom)drawCellFloor(b,px,py,rnd);
    else if(v===18)drawGoldPile(b,px,py);   // ★ 新規：宝の山
else if(v===19)drawFurnace(b,px,py);    // ★ 新規：錬金窯
    else if(v===20)drawCandelabra(b,px,py,room._dark);   // ★ 新規：燭台
    else if(v===21)drawPew(b,px,py);          // ★ 新規：長椅子
    else if(v===22)drawCoffin(b,px,py);       // ★ 新規：棺
    else if(v===23)drawAltar(b,px,py,inR(x-1,y)&&m[y][x-1]===23,inR(x+1,y)&&m[y][x+1]===23);   // ★ 新規：祭壇
    else if(v===24)drawPortrait(b,px,py);        // ★ 新規：肖像画
    else if(v===25)drawGrandClock(b,px,py);      // ★ 新規：古時計
    else if(v===26)drawStandMirror(b,px,py);     // ★ 新規：姿見
    else if(v===27)drawGrandPiano(b,px,py,inR(x-1,y)&&m[y][x-1]===27,inR(x+1,y)&&m[y][x+1]===27);   // ★ 新規：グランドピアノ
    else if(v===28)drawLeverBase(b,px,py);   // ★ 廃坑のレバー
    else if(v===29)drawBreakWall(b,px,py,rnd);   // ★ 廃坑のくずせる岩
  }
  if(ICE)iceFinish(b,rnd,isWall,isFl,face,RW,RH,T);
  if(BR)amFinish(b,rnd,isWall,isFl,face,RW,RH,T);
  const hi=document.createElement('canvas');hi.width=LW*2;hi.height=LH*2;
  const g=hi.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(lo,0,0,LW*2,LH*2);
  lo.width=lo.height=0;   // 一時の絵は すぐ手ばなして メモリをあける
  g.imageSmoothingEnabled=true;
  if(isBedRoom)decorateBedRoom(g,room,mulberry32(room.seed^0x5bd1));
  room._bed=isBedRoom;
  return hi;
}
function renderRoomCanvas(room){   // 使い回した下絵 ＋ ドア ＋ 松明の光（軽い）
  if(room._base&&!!room._baseDark!==!!room._dark){room._base.width=room._base.height=0;room._base=null;}   // 灯りの状態がかわった
  if(!room._base){room._base=buildRoomBase(room);room._baseDark=!!room._dark;}
  room._used=performance.now();
  const IC=room.theme==='icehall',PU=room.theme==='bossroom';
  const base=room._base;
  const hi=document.createElement('canvas');hi.width=base.width;hi.height=base.height;
  const g=hi.getContext('2d');g.drawImage(base,0,0);
  g.imageSmoothingEnabled=true;
  if(room._bed)decorateBedDoors(g,room);
  g.save();g.scale(2,2);
  // ⑧ 松明の光（オレンジのにじみ ＋ 床に落ちる赤い光）
  for(const t of room.torches){
    if(!t.lit)continue;   // 火がついていない（まだ近づいていない）松明は 光らない
    for(let i=0;i<9;i++){
      g.fillStyle=(IC?'rgba(90,190,255,':PU?'rgba(190,100,255,':'rgba(255,100,40,')+(0.035+i*0.008)+')';
      g.beginPath();g.ellipse(t.x,t.y+4,46-i*4.5,36-i*3.6,0,0,7);g.fill();
    }
    g.save();g.beginPath();   // 床に落ちる光は 床のうえだけ
    {const mm=room.map;for(let yy=0;yy<mm.length;yy++)for(let xx=0;xx<mm[0].length;xx++)if(mm[yy][xx]!==1)g.rect(xx*30,yy*30,30,30);}
    g.clip();
    g.fillStyle=IC?'rgba(110,200,255,0.20)':PU?'rgba(200,110,255,0.22)':'rgba(255,90,90,0.16)';g.beginPath();g.ellipse(t.x,t.y+45,42,10,0,0,7);g.fill();
    g.fillStyle=IC?'rgba(210,245,255,0.18)':PU?'rgba(240,190,255,0.18)':'rgba(255,140,90,0.14)';g.beginPath();g.ellipse(t.x,t.y+45,24,5,0,0,7);g.fill();
    g.restore();
  }
  g.restore();
  return hi;
}
function buildRoomCanvas(room){
  const old=mapCanvas;
  mapCanvas=renderRoomCanvas(room);
  if(old&&old!==mapCanvas&&old!==room._base)old.width=old.height=0;   // まえの部屋の絵は メモリをあける
  room._used=performance.now();
  trimRoomCache(room);
}
/* ---------- 画面の絵がメモリ不足などで まっくろに なったときの対策 ----------
   ・スマホのブラウザは メモリがいっぱいになると 作った絵が まっくろ(とうめい)になることがある
   ・そこで 絵が空になってないかを ときどきチェックして、空なら つくりなおす（セーブデータは そのまま）
   ・つくりおきの部屋の絵が 多くなりすぎないように、つかってない古い部屋から すてる */
const ROOM_CACHE_PX=40e6;   // 部屋のつくりおきの合計（ピクセル数）のめやす。こえたら古い部屋から すてる
function trimRoomCache(keep){
  const list=(typeof roomList!=='undefined'?roomList:[]).filter(r=>r&&r._base);
  let tot=0;for(const r of list)tot+=r._base.width*r._base.height;
  if(tot<=ROOM_CACHE_PX)return;
  list.sort((a,b)=>(a._used||0)-(b._used||0));   // 古い順
  for(const r of list){
    if(tot<=ROOM_CACHE_PX)break;
    if(r===keep||r===curRoom)continue;
    tot-=r._base.width*r._base.height;
    r._base.width=r._base.height=0;r._base=null;
  }
}
function freeOtherRoomCaches(){   // いまの部屋いがいの つくりおきを ぜんぶ すてて メモリをあける
  _preTok++;   // 先読みも いったんストップ
  for(const r of roomList){
    if(r&&r._base&&r!==curRoom){r._base.width=r._base.height=0;r._base=null;}
  }
}
function canvasBlank(cv){   // 3か所しらべて ぜんぶ とうめい(=なにも描かれてない)なら true
  if(!cv)return false;
  if(cv.width<2||cv.height<2)return true;
  try{
    const g=cv.getContext('2d');
    for(const [fx,fy] of [[0.5,0.5],[0.25,0.3],[0.75,0.7]]){
      const d=g.getImageData(Math.floor(cv.width*fx),Math.floor(cv.height*fy),1,1).data;
      if(d[3]>0)return false;
    }
    return true;
  }catch(e){return true;}   // 読めないほど こわれているときも 空あつかい
}
let _gfxChkT=0,_gfxFixT=-99;
function checkGfx(force){
  const now=performance.now();
  if(!force&&now-_gfxChkT<1200)return;
  _gfxChkT=now;
  if(now-_gfxFixT<2500)return;   // なおした直後は くりかえさない
  if(G.mode==='dungeon'&&curRoom&&mapCanvas&&(!G.fade||force)){
    if(canvasBlank(mapCanvas)){
      _gfxFixT=now;
      freeOtherRoomCaches();
      if(curRoom._base){curRoom._base.width=curRoom._base.height=0;curRoom._base=null;}
      mapCanvas=null;buildRoomCanvas(curRoom);   // この部屋の絵を つくりなおす
    }
  }else if(G.mode==='battle'&&BG){
    if(canvasBlank(BG)){
      _gfxFixT=now;
      freeOtherRoomCaches();
      BG.width=BG.height=0;BG=null;   // drawBattle が つぎの描画で つくりなおす
    }
  }
}
/* 先読み：まだ入っていない部屋の下絵を、すきま時間に1部屋ずつ作っておく（広い部屋・近い部屋を優先） */
let _preTok=0;
function prebuildRooms(list){
  const tok=++_preTok;
  const q=list.filter(r=>r&&r.map&&!r._base).sort((a,b)=>(isBigRoom(b)-isBigRoom(a))||((a.dist||0)-(b.dist||0)));
  const step=()=>{
    if(tok!==_preTok)return;
    const r=q.shift();if(!r)return;
    {let tot=0;for(const x of roomList)if(x&&x._base)tot+=x._base.width*x._base.height;if(tot>ROOM_CACHE_PX*0.8)return;}   // つくりおきが多くなったら それいじょう先読みしない
    try{if(!r._base)r._base=buildRoomBase(r);}catch(e){}
    setTimeout(step,30);
  };
  setTimeout(step,200);
}

function enterRoom(room){
  curRoom=room;map=room.map;entities=room.entities;
  room._dark=false;room._darkK=0;removeKubigari(room);   // 前に出た クビ・ガリは 明るいときには いない
  if(THEMES[room.theme]&&THEMES[room.theme].blackout&&Math.random()<0.5){room._dark=true;for(const t of room.torches){t.lit=false;t.fire=0;}}   // ギミック：入ると50%で ぜんぶ消灯（光は主人公のまわりだけ）
  buildRoomCanvas(room);
  checkGfx(true);
  room.visited=true;room.known=true;
  for(const d of DIRS){
    if(!room.doors[d[0]])continue;
    const n=roomAt(room.cx+d[1],room.cy+d[2]);if(n)n.known=true;
  }
  G.grace=0.6;
}
/* 停電部屋：灯りが消えたときだけ「クビ・ガリ」が 主人公から遠い床に あらわれる。明るいまま入ったときは いない */
function removeKubigari(room){for(let i=room.entities.length-1;i>=0;i--)if(room.entities[i].kubigari)room.entities.splice(i,1);}
function spawnKubigari(room,px,py){   // px,py = 主人公が入ってきたマス
  const m=room.map,cand=[];
  for(let y=2;y<m.length-1;y++)for(let x=1;x<m[0].length-1;x++){
    if(m[y][x]!==0||nearDoorArrival(room,x,y)||(room.cellSet&&room.cellSet.has(x+','+y)))continue;
    if(room.entities.some(e=>Math.abs(e.gx-x)<=1&&Math.abs(e.gy-y)<=1))continue;   // 宝箱などのそばは さける
    cand.push({x,y,d:Math.hypot(x-px,y-py)});
  }
  if(!cand.length)return false;
  let far=cand.filter(c=>c.d>=7);if(!far.length)far=cand.sort((a,b)=>b.d-a.d).slice(0,Math.max(1,(cand.length/3)|0));
  const c=far[(Math.random()*far.length)|0];
  room.entities.push({type:'enemy',kubigari:true,def:scaleEnemy(KUBIGARI_DB,G.floor),moving:false,moveT:0,spd:0.28,wait:Math.random()*1.2,
    ox:0,oy:0,tpx:0,tpy:0,anim:Math.random()*6,hurt:0,faceR:false,
    gx:c.x,gy:c.y,x:c.x*TILE+TILE/2,y:c.y*TILE+TILE/2});
  return true;
}
function startDoor(dir){
  const d=DIRS.find(x=>x[0]===dir);
  const nr=roomAt(curRoom.cx+d[1],curRoom.cy+d[2]);if(!nr)return;
  let gx=player.gx,gy=player.gy;
  if(dir==='u')gy=rmH(nr)-2;else if(dir==='d')gy=2;else if(dir==='l')gx=rmW(nr)-2;else gx=1;   // 行き先の部屋の大きさに合わせて出口側に出る
  G.fade={t:0,room:nr,gx,gy,done:false};
}
function nearDoorArrival(room,gx,gy){
  const A=[];
  if(room.doors.u)A.push([7,2],[8,2]);
  if(room.doors.d)A.push([7,rmH(room)-2],[8,rmH(room)-2]);
  if(room.doors.l)A.push([1,4],[1,5]);
  if(room.doors.r)A.push([rmW(room)-2,4],[rmW(room)-2,5]);
  return A.some(a=>Math.abs(a[0]-gx)<=1&&Math.abs(a[1]-gy)<=1);
}
const TORCH_REACH=4.2*TILE;   // この距離（約4マス）まで近づくと 火がつく
function torchSees(t){        // 松明の前の床から 主人公の足もとまで、壁にさえぎられずに近いか
  const ox=t.x*TILE/30,oy=(t.y+45)*TILE/30,px=player.x,py=player.y+PFEET;
  const dx=px-ox,dy=py-oy,d=Math.hypot(dx,dy);
  if(d>TORCH_REACH)return false;
  const n=Math.max(1,Math.ceil(d/6));
  for(let i=1;i<n;i++){
    const gx=Math.floor((ox+dx*i/n)/TILE),gy=Math.floor((oy+dy*i/n)/TILE);
    if(gy<0||gx<0||gy>=map.length||gx>=map[0].length||map[gy][gx]===1)return false;
  }
  return true;
}
function drawRoomTorches(){
  const f=Math.floor(G.time*8)%2;
  const IC=curRoom.theme==='icehall',PU=curRoom.theme==='bossroom';
  const PM={'#5a3a2a':'#3a2456','#3a2418':'#1e1238','#ff7a1a':'#b044ff','#ff9a2a':'#d478ff','#ffc040':'#f2b8ff','#ffd060':'#fbdcff','#ff8a20':'#c458ff'};
  const cc=(o,n)=>IC?n:(PU?(PM[o]||o):o);   // 氷の間は 青白い炎
  let ignited=false;
  curRoom.torches.forEach(t=>{
    if(!t.lit&&!G.fade&&!curRoom._dark&&torchSees(t)){t.lit=true;t.fire=0;ignited=true;}
    if(t.lit&&t.fire<1)t.fire=Math.min(1,(t.fire||0)+0.07);
  });
  curRoom.torches.forEach((t,i)=>{
    const x=t.x,y=t.y,fl=(f+i)%2;
    uR(x-2,y+3,5,4,cc('#5a3a2a','#2a4a6a'));uR(x-2,y+5,5,1,'#e8c8b0');uR(x-1,y+7,3,2,cc('#3a2418','#16283c'));
    if(!t.lit){uR(x-2,y-1,5,4,'#3a2a30');uR(x-1,y-3,3,3,'#2a1e24');return;}   // 火が消えている
    const k=t.fire==null?1:t.fire;
    if(k<0.34){uR(x-1,y+1,3,2,cc('#ff7a1a','#2aa8ff'));return;}                           // ついたばかり：小さな火種
    uR(x-2,y-1,5,4,cc('#ff7a1a','#2aa8ff'));uR(x-1,y-3,3,3,cc('#ff9a2a','#6fd4ff'));
    if(k<0.7){uR(x,y-4,1,2,cc('#ffc040','#c8f4ff'));uR(x-1,y,3,3,cc('#ffd060','#eafcff'));return;}
    uR(x-fl,y-6,1+fl,4,cc('#ff8a20','#4fc0ff'));uR(x,y-5,1,3,cc('#ffc040','#c8f4ff'));
    uR(x-1,y,3,3,cc('#ffd060','#eafcff'));
  });
  if(ignited)buildRoomCanvas(curRoom);   // 光のにじみを 描きなおす
}

   ENEMY_DB / BOSS_DB の各データに以下を書くと調整できます:
     img:'slime.png'   … 画像ファイル名（index.html と同じフォルダ。サブフォルダなら 'img/slime.png'）
     imgScale:1.0      … 大きさ倍率（省略可）

const BOSS_IMG_BOOST=1.8;   // ボス画像を ふつうの敵より どれだけ大きくするか（大きいほどでかい）
const MID_IMG_BOOST=1.7;   // 中ボス画像を ふつうの敵より どれだけ大きくするか
const MID_S=2.4;           // 戦闘中の中ボスの大きさ（ふつうの敵=2.1／ボス=2.6）
function isBigFoe(d){return !!(d&&(d.isBoss||d.mid));}
function foeScale(d){return d&&d.isBoss?2.6:(d&&d.mid?MID_S:2.1);}
function enemyImgBox(d,s){return 40*s*(d&&d.imgScale||1)*((d&&d.isBoss)?BOSS_IMG_BOOST:(d&&d.mid)?MID_IMG_BOOST:1);}
const enemyImgCache={};
function getEnemyImg(file){
  if(!file)return null;
  let o=enemyImgCache[file];
  if(!o){
    o=enemyImgCache[file]={img:new Image(),ok:false};
    o.img.onload=()=>{o.ok=true;};
    o.img.onerror=()=>{o.ok=false;};
    o.img.src=file;
  }
  return o.ok?o.img:null;
}
// 画像を描けたら true、描けなかったら false（→ 呼び出し側で従来描画）
function drawEnemyImg(c,x,y,s,d,faceRight){
  const img=getEnemyImg(d&&d.img);
  if(!img)return false;
  if(d.isBoss&&bossAwake())drawBossAura(c,x,y,s);
  const box=enemyImgBox(d,s);
  const r=img.naturalWidth/img.naturalHeight||1;
  const w=r>=1?box:box*r, h=r>=1?box/r:box;
  c.save();
  c.translate(x,y);
  c.fillStyle='rgba(0,0,0,0.32)';
  c.beginPath();c.ellipse(0,15*s,Math.min(w,box)*0.35,4.5*s,0,0,7);c.fill();
  if(!!d.imgFlip!==!!faceRight)c.scale(-1,1);   // 画像は「左向き」が基本。右向きのとき反転（imgFlip:true なら逆）
  c.drawImage(img,-w/2,-h/2+2*s+(d.imgY||0)*s,w,h);
  c.restore();
  return true;
}

/* ========== モンスターレベル（Lv1〜5） ==========
   Lv1 が基本値。Lv が1上がるごとに HP +20 / 攻撃 +3。
   階層ごとの出現Lv: base = 通常のLv、up = 1つ上のLvが出る確率。ボス(15F)は固定ステータス。 */
const ENEMY_LV_MAX=5;
const LV_HP_UP=20, LV_ATK_UP=3;
const FLOOR_LV=[
  {from:1,to:4, base:1,up:0.10},
  {from:5,to:7, base:2,up:0.10},
  {from:8,to:11,base:3,up:0.10},
  {from:12,to:14,base:4,up:0.10},
];
function rollEnemyLv(floor){
  const t=FLOOR_LV.find(r=>floor>=r.from&&floor<=r.to);
  if(!t)return 1;
  const lv=t.base+(Math.random()<t.up?1:0);
  return clamp(lv,1,ENEMY_LV_MAX);
}
function scaleEnemy(def,floor,lv){
  if(def.isBoss||def.mid||def.fixed)return Object.assign({},def);   // ボス・中ボス・ステータス固定の敵（クビ・ガリ）は 階のLvで強くならない
  lv=clamp(lv||rollEnemyLv(floor),1,ENEMY_LV_MAX);
  return Object.assign({},def,{
    lv:lv,
    hp:def.hp+LV_HP_UP*(lv-1),
    atk:def.atk+LV_ATK_UP*(lv-1),
  });
}

   ここに書いた階にだけ、赤い宝箱が1つ かならず置かれる（技 or 強化メダル）。書いていない階には、技・強化メダルは出ない。
   skill:技の名前 ／ item:アイテム名 */

/* ========== 宝箱のランダム設定 ==========
   宝箱の数：CHEST_COUNT_MIN〜CHEST_COUNT_MAX個（階ごとにランダム）。
   中身は、その階の重み表（数字＝％のめやす。合計100でなくても、合計に対する割合で選ばれる）から1個ずつ抽選。 */
const CHEST_COUNT_MIN=2, CHEST_COUNT_MAX=3;
const CHEST_TABLES=[
  {from:1, to:5,  w:{'クッキー':7,'カウンター':3,'チョコケーキ':65,'マナキット':25}},
  {from:6, to:10, w:{'ホルミシス':5,'カウンター':5,'チョコケーキ':35,'かんしゃく':5,'シールド':5,'ハンバーガー':10,'マナキット':30,'マナキットS':5,'クッキー':8}},
  {from:11,to:99, w:{'ホルミシス':5,'カウンター':5,'チョコケーキ':40,'かんしゃく':5,'シールド':5,'ハンバーガー':20,'マナキット':15,'マナキットS':10,'クッキー':5}},  
];
function rollChestItem(floor){
  const t=CHEST_TABLES.find(r=>floor>=r.from&&floor<=r.to)||CHEST_TABLES[CHEST_TABLES.length-1];
  const keys=Object.keys(t.w);
  let total=0;for(const k of keys)total+=t.w[k];
  let r=Math.random()*total;
  for(const k of keys){r-=t.w[k];if(r<0)return k;}
  return keys[0];
}
function chestPool(floor){
  const n=CHEST_COUNT_MIN+Math.floor(Math.random()*(CHEST_COUNT_MAX-CHEST_COUNT_MIN+1));
  const base=[];
  for(let i=0;i<n;i++)base.push(rollChestItem(floor));
  return {skill:null, items:base, fixed:[]};
}

function initDungeon(){

  if(isMid||isBoss){
    const ent=DIRS.find(d=>{const n=far.doors[d[0]]&&roomAt(far.cx+d[1],far.cy+d[2]);return n&&n.dist===far.dist-1;});
    if(ent){
      midEntry=ent[0];
      for(const d of DIRS){   // 入口いがいのドア（近道）はふさぐ：奥に立つクマティアと階段のじゃまをしない
        if(d===ent||!far.doors[d[0]])continue;
        const n=roomAt(far.cx+d[1],far.cy+d[2]);
        far.doors[d[0]]=false;if(n)n.doors[d[3]]=false;
      }
    }
    far.forceTheme=isBoss?'bossroom':'icehall';
  }
  {  // 広い部屋（カメラが動く部屋）を、スタート部屋と階段部屋以外のうち「一部だけ」に配置（のこりはふつうの部屋）
    const cand=roomList.filter(r=>r!==start&&r!==far).sort(()=>Math.random()-0.5);
    const types=BIG_ROOMS.slice().sort(()=>Math.random()-0.5);
    let placed=0;
    cand.forEach((r,i)=>{
      if(placed>=types.length||placed>=BIG_MAX)return;
      // 1つめは高確率で（毎階なにか広い部屋が出る）／それ以降は BIG_CHANCE の確率
      const p=placed===0?BIG_FIRST_CHANCE:BIG_CHANCE;
      if(Math.random()>=p)return;
      const t=types[placed++];
      if(!THEMES[t])return;
      r.forceTheme=t;r.w=THEMES[t].big[0];r.h=THEMES[t].big[1];
    });
    if(Math.random()<BIG_DARK_CHANCE){   // 灯りの消える部屋：まだふつうの部屋のままの1つを選ぶ
      const c2=cand.filter(r=>!r.forceTheme);
      if(c2.length){const r=c2[(Math.random()*c2.length)|0];r.forceTheme='bigdark';r.w=THEMES.bigdark.big[0];r.h=THEMES.bigdark.big[1];}
    }
  }
  for(const r of roomList)buildRoomMap(r);
  { const safe=['hall','guard','corridor','library'];buildRoomMap(start,safe[(Math.random()*safe.length)|0]); }
  const used=new Map();
  const pickCell=(room,noCell)=>{
    const s=used.get(room)||new Set();used.set(room,s);
    for(let i=0;i<100;i++){
      const gx=1+((Math.random()*(rmW(room)-2))|0),gy=2+((Math.random()*(rmH(room)-3))|0);
      if(room.map[gy][gx]!==0||s.has(gx+','+gy)||nearDoorArrival(room,gx,gy))continue;
      if(noCell&&room.cellSet&&room.cellSet.has(gx+','+gy))continue;
      s.add(gx+','+gy);return{gx,gy};
    }
    return null;
  };
  // 独房ブロック：ベッド(7)のある個室の床マス（ドアを開けてすぐ目の前のマスは、入り口をふさがないよう除く）
  const bedCellTiles=(room)=>{
    const m=room.map,cs=room.cellSet,seen=new Set(),groups=[];
    if(!cs)return groups;
    for(const k of cs){
      if(seen.has(k))continue;
      const comp=[],q=[k];seen.add(k);
      while(q.length){
        const c=q.pop();comp.push(c);
        const [x,y]=c.split(',').map(Number);
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nk=(x+dx)+','+(y+dy);
          if(cs.has(nk)&&!seen.has(nk)){seen.add(nk);q.push(nk);}
        }
      }
      if(!comp.some(c=>{const [x,y]=c.split(',').map(Number);return m[y][x]===7;}))continue;   // ベッドが無い（詰所・倉庫など）は対象外
      const tiles=[];
      for(const c of comp){
        const [x,y]=c.split(',').map(Number);
        if(m[y][x]!==0)continue;
        const atDoor=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const v=m[y+dy]&&m[y+dy][x+dx];return v===13||v===15;});
        if(atDoor)continue;
        tiles.push({gx:x,gy:y});
      }
      if(tiles.length)groups.push(tiles);
    }
    return groups;
  };
  const pickBedCell=(room)=>{
    const s=used.get(room)||new Set();used.set(room,s);
    const groups=bedCellTiles(room);
    // まだ宝箱が入っていない個室を優先（1つの個室に固まらないように）
    const taken=g=>g.some(t=>s.has(t.gx+','+t.gy));
    let pool=groups.filter(g=>!taken(g));if(!pool.length)pool=groups;
    for(let n=0;n<20&&pool.length;n++){
      const g=pool[(Math.random()*pool.length)|0];
      const free=g.filter(t=>!s.has(t.gx+','+t.gy));
      if(!free.length){pool=pool.filter(x=>x!==g);continue;}
      const t=free[(Math.random()*free.length)|0];
      s.add(t.gx+','+t.gy);return{gx:t.gx,gy:t.gy};
    }
    return null;
  };
  const pickMineCell=(room)=>{   // 岩のむこうの宝部屋（入口のすぐうしろは のぞく）
    const s=used.get(room)||new Set();used.set(room,s);
    const ch=room.mine.chamber.filter(c=>c.x>room.mine.wx+1&&room.map[c.y][c.x]===0&&!s.has(c.x+','+c.y));
    if(!ch.length)return null;
    const c=ch[(Math.random()*ch.length)|0];s.add(c.x+','+c.y);return{gx:c.x,gy:c.y};
  };
  const put=(room,o)=>{
    const p=(o.type==='chest'&&room.theme==='bigmine'&&room.mine)?(pickMineCell(room)||pickCell(room,false)):(o.type==='chest'&&room.theme==='bigblock'&&bedCellTiles(room).length)?pickBedCell(room):pickCell(room,o.type==='enemy');if(!p)return false;
    room.entities.push(Object.assign({gx:p.gx,gy:p.gy,x:p.gx*TILE+TILE/2,y:p.gy*TILE+TILE/2},o));return true;
  };
  const mkEnemy=(def)=>({type:'enemy',def,moving:false,moveT:0,spd:0.28,wait:Math.random()*1.2,
    ox:0,oy:0,tpx:0,tpy:0,anim:Math.random()*6,hurt:0,faceR:false});
  const shuffle=(a)=>a.slice().sort(()=>Math.random()-0.5);

  // 宝箱
  const cd=chestPool(G.floor);
  const chestList=[];
  if(cd.skill)chestList.push({kind:'skill',value:cd.skill});
  for(const it of cd.items)chestList.push({kind:'item',value:it});
  const chestSrc=shuffle(chestList);
  const chestRooms=shuffle((isBoss||isMid)?others.filter(r=>r!==far):others);
  if(MINE_CHEST_GUARANTEE){   // 廃坑がある階では、宝箱が最低1つ 岩のむこうに入る
    const mi=chestRooms.findIndex(r=>r.theme==='bigmine'&&r.mine);
    if(mi>0)chestRooms.unshift(chestRooms.splice(mi,1)[0]);
  }
  if(BLOCK_CHEST_GUARANTEE){   // 独房ブロックを先頭に（1つめの宝箱がかならずそこの個室に入る）
    const bi=chestRooms.findIndex(r=>r.theme==='bigblock'&&bedCellTiles(r).length);
    if(bi>0)chestRooms.unshift(chestRooms.splice(bi,1)[0]);
  }
  const chestCount=isBoss?0:chestSrc.length;   // 15F（ラスボスの階）は宝箱なし
  for(let i=0;i<chestCount;i++){
    const room=chestRooms[i%chestRooms.length],pick=chestSrc[i];
    put(room,{type:'chest',opened:false,kind:pick.kind,value:pick.value,t:Math.random()*6});
  }

  const sp=SPECIAL_CHESTS[G.floor];   // 確定の赤い宝箱（かならず1つ）
  if(sp&&!isBoss){
    const o=sp.skill?{kind:'skill',value:sp.skill}:{kind:'item',value:sp.item};
    for(const room of shuffle(chestRooms)){
      if(put(room,Object.assign({type:'chest',opened:false,special:true,t:Math.random()*6},o)))break;
    }
  }

  if(isBoss){
    // ラスボス：専用の部屋の奥に立っている（動かない）。そのうしろに 紫のクリスタル
    const BS={d:{b:[7,3],c:[7,2]},u:{b:[7,6],c:[7,7]},r:{b:[2,4],c:[1,4]},l:{b:[13,4],c:[14,4]}}[midEntry||'d'];
    far.bossEntry=midEntry||'d';far.bossSpot=BS;
    far.map[BS.c[1]][BS.c[0]]=17;
    far.entities.push({type:'crystal',t:0,gx:BS.c[0],gy:BS.c[1],x:BS.c[0]*TILE+TILE/2,y:BS.c[1]*TILE+TILE/2});
    far.entities.push(Object.assign(mkEnemy(Object.assign({},BOSS_DB)),{gx:BS.b[0],gy:BS.b[1],x:BS.b[0]*TILE+TILE/2,y:BS.b[1]*TILE+TILE/2,still:true,wait:99}));
  }else{
    const pool2=enemyPool(G.floor);
    const spawn=(room)=>{
      const id=pool2[(Math.random()*pool2.length)|0];
      put(room,mkEnemy(scaleEnemy(ENEMY_DB[id],G.floor)));
    };
    let ecount=0;
    let spawnRooms=(isMid?others.filter(r=>r!==far):others).filter(r=>r.theme!=='bigdark');   // 氷の間には ふつうの敵は出ない／停電部屋は 灯りが消えるまで 敵はいない
    if(!spawnRooms.length)spawnRooms=isMid?others.filter(r=>r!==far):others;
    for(const room of spawnRooms){
      const bigR=isBigRoom(room);   // 広い部屋は かならず敵が2体
      if(bigR||Math.random()<0.7){
        const n=(bigR||(G.floor>=4&&Math.random()<0.35))?2:1;
        for(let i=0;i<n;i++){spawn(room);ecount++;}
      }
    }
    while(ecount<2){spawn(spawnRooms[(Math.random()*spawnRooms.length)|0]);ecount++;}
    if(isMid){
      // 中ボス：専用の部屋の奥に立っている（動かない）。階段は ない → 倒すと クマティアの うしろに あらわれる
      const SPOT={d:{b:[7,3],s:[7,2]},u:{b:[7,6],s:[7,7]},r:{b:[2,4],s:[1,4]},l:{b:[13,4],s:[14,4]}}[midEntry||'d'];
      const bx=SPOT.b[0],by=SPOT.b[1];
      far.entities.push(Object.assign(mkEnemy(Object.assign({},MIDBOSS_DB)),{gx:bx,gy:by,x:bx*TILE+TILE/2,y:by*TILE+TILE/2,
        still:true,wait:99,stairsAt:{gx:SPOT.s[0],gy:SPOT.s[1]}}));
    }else put(far,{type:'stairs',t:0});
  }

  bag.open=false;G.bigMap=false;G.fade=null;
  enterRoom(start);
  prebuildRooms(roomList);
  player.gx=7;player.gy=4;
  player.x=player.gx*TILE+TILE/2;player.y=player.gy*TILE+TILE/2;
  player.moving=false;
  snapCamera();
  G.mode='dungeon';
  G.msg={text:isBoss?'B'+FINAL_FLOOR+'F ボスが まちうけている…':(G.floor===MIDBOSS_FLOOR?'B'+G.floor+'F ひんやりした けはいが する…':'B'+G.floor+'F に やってきた！')};
  G.msgT=2.4;
}

/* ========== プレイヤー更新 ========== */
/* ---- 当たり判定：足元の小さな四角 ＋ オブジェクトごとの「足もとの形」 ---- */
// 絵（30px基準）の中で、実際にぶつかる範囲 [x0,y0,x1,y1]。書いてない物は1マスまるごと。
const FOOTPRINT={
  2:[1,0,29,29],    // 本棚
  3:[3,1,27,29],    // 柱
  4:[0,0,30,30],    // 鉄格子
  5:[6,5,24,28],    // 樽
  6:[3,6,27,28],    // 木箱
  7:[3,9,28,27],    // 寝台
  8:[0,5,30,28],    // 机
  9:[4,1,26,29],    // 石像
  12:[0,5,30,28],   // 拷問台
  18:[4,6,26,28],   // ★ 宝の山
19:[3,3,27,28],   // ★ 錬金窯
  20:[10,6,20,28],   // 燭台
  21:[1,9,29,28],   // 長椅子
  22:[4,5,26,28],   // 棺
  23:[1,8,29,28],   // 祭壇
  24:[5,16,25,28],   // 肖像画
  25:[7,10,23,28],   // 古時計
  26:[5,14,25,28],   // 姿見
  27:[0,10,30,28],   // グランドピアノ
  16:[4,7,26,28],   // ベッドわきの小棚
  28:[6,10,24,28],  // 廃坑のレバー
  15:[0,0,0,0],     // 鉄のドア（あいている＝通れる）
  17:[5,6,25,28],   // 紫のクリスタル（ラスボスのうしろ）
};
const PHW=7,PHH=4,PFEET=2;   // 主人公の足元の半幅・半高・足元の位置（中心から下へ）
const _FPK=TILE/30;
const doorSideOpen=(x,y)=>{const v=map[y]&&map[y][x];return v!==undefined&&v!==1&&v!==13&&v!==14&&v!==4;};   // ドアの横が 壁・ドア・檻 いがい（＝歩ける側）
function footBlocked(px,py){
  const L=px-PHW,R=px+PHW,T=py+PFEET-PHH,B=py+PFEET+PHH;
  if(L<0||T<0||R>map[0].length*TILE||B>map.length*TILE)return true;
  const tx0=Math.floor(L/TILE),tx1=Math.floor((R-0.001)/TILE),ty0=Math.floor(T/TILE),ty1=Math.floor((B-0.001)/TILE);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const v=map[ty][tx];
    if(v===0)continue;
    if(v===14){   // 檻：まえの柵だけがぶつかる（中の床は歩ける。ドアをあけて入る）
      if(!(ty+1<map.length&&map[ty+1][tx]===14)){
        const fy0=(ty+1)*TILE-3;
        if(R>tx*TILE&&L<(tx+1)*TILE&&B>fy0&&T<(ty+1)*TILE)return true;
      }
      if(tx>0&&map[ty][tx-1]===0&&R>tx*TILE&&L<tx*TILE+3&&B>ty*TILE&&T<(ty+1)*TILE)return true;                       // 左のはし
      if(tx+1<map[0].length&&map[ty][tx+1]===0&&R>(tx+1)*TILE-3&&L<(tx+1)*TILE&&B>ty*TILE&&T<(ty+1)*TILE)return true;   // 右のはし
      continue;
    }
    if(v===13){   // 鉄ドア（しまっている）：檻と同じ。まえの柵・横のはしだけがぶつかる（横からも近づける）
      if(!(ty+1<map.length&&map[ty+1][tx]===13)&&R>tx*TILE&&L<(tx+1)*TILE&&B>(ty+1)*TILE-3&&T<(ty+1)*TILE)return true;   // 手前の柵
      if(tx>0&&doorSideOpen(tx-1,ty)&&R>tx*TILE&&L<tx*TILE+3&&B>ty*TILE&&T<(ty+1)*TILE)return true;                       // 左のはし
      if(tx+1<map[0].length&&doorSideOpen(tx+1,ty)&&R>(tx+1)*TILE-3&&L<(tx+1)*TILE&&B>ty*TILE&&T<(ty+1)*TILE)return true;   // 右のはし
      continue;
    }
    const f=FOOTPRINT[v];
    if(!f)return true;
    const bx0=tx*TILE+f[0]*_FPK,by0=ty*TILE+f[1]*_FPK,bx1=tx*TILE+f[2]*_FPK,by1=ty*TILE+f[3]*_FPK;
    if(R>bx0&&L<bx1&&B>by0&&T<by1)return true;
  }
  return false;
}
// 1px だけ動く。ぶつかったら角をすべって通れる位置へ少し寄せる（ひっかかり防止）
function stepOnePx(ax,ay){
  if(!footBlocked(player.x+ax,player.y+ay)){player.x+=ax;player.y+=ay;return true;}
  const px=ax!==0?0:1,py=ax!==0?1:0;
  for(let k=1;k<=10;k++)for(const sg of [1,-1]){
    const ox=px*sg*k,oy=py*sg*k;
    if(!footBlocked(player.x+ox+ax,player.y+oy+ay)&&!footBlocked(player.x+px*sg,player.y+py*sg)){
      player.x+=px*sg;player.y+=py*sg;return true;
    }
  }
  return false;
}
function updatePlayer(dt){
  player.anim+=dt;
  let dx=0,dy=0;
  if(down['ArrowLeft']||down['KeyA'])dx=-1;
  else if(down['ArrowRight']||down['KeyD'])dx=1;
  else if(down['ArrowUp']||down['KeyW'])dy=-1;
  else if(down['ArrowDown']||down['KeyS'])dy=1;
  if(!dx&&!dy){player.moving=false;return;}
  if(dx!==0) player.fx=dx;
  player.fy=dy;
  let dist=TILE/player.moveSpd*Math.min(dt,0.05),moved=false;
  while(dist>0){
    const st=Math.min(1,dist);dist-=st;
    if(stepOnePx(dx*st,dy*st))moved=true;else break;
  }
  player.moving=moved;
  // 足元のマスが変わったら「1歩あるいた」扱い（ドア・宝箱・階段・敵との接触）
  const gx=Math.floor(player.x/TILE),gy=Math.floor((player.y+PFEET)/TILE);
  if(gx!==player.gx||gy!==player.gy){
    player.gx=gx;player.gy=gy;
    onStep();
  }
}
function onStep(){
  if(player.gy<=0){startDoor('u');return;}
  if(player.gy>=map.length-1){startDoor('d');return;}
  if(player.gx<=0){startDoor('l');return;}
  if(player.gx>=map[0].length-1){startDoor('r');return;}
  for(const e of entities){
    if(e.type==='stairs'&&e.gx===player.gx&&e.gy===player.gy){
      G.floor++;initDungeon();return;
    }
  }
  for(const e of entities){
    if(e.type!=='enemy')continue;
    if(e.gx===player.gx&&e.gy===player.gy&&!(G.grace>0)){startBattle(e);return;}
  }
}

/* ========== 敵更新 ========== */
function updateEnemies(dt){
  for(const e of entities){
    if(e.type!=='enemy')continue;
    e.anim+=dt;
    if(e.hurt>0)e.hurt-=dt;
    if(e.moving){
      e.moveT+=dt;
      const t=Math.min(1,e.moveT/e.spd);
      e.x=lerp(e.ox,e.tpx,t);e.y=lerp(e.oy,e.tpy,t);
      if(t>=1){
        e.moving=false;e.x=e.tpx;e.y=e.tpy;
        e.gx=Math.round((e.x-TILE/2)/TILE);e.gy=Math.round((e.y-TILE/2)/TILE);
      }
    }else if(!e.still){
      e.wait-=dt;
      if(e.wait<=0){
        e.wait=0.55+Math.random()*1.0;
        const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        const d=dirs[(Math.random()*4)|0];
        const nx=e.gx+d[0],ny=e.gy+d[1];
        if(isInterior(nx,ny)){
          e.moving=true;e.moveT=0;
          if(d[0]>0)e.faceR=true;else if(d[0]<0)e.faceR=false;   // 右へ移動→右向き／左へ→左向き（上下は向きそのまま）
          e.ox=e.x;e.oy=e.y;e.tpx=nx*TILE+TILE/2;e.tpy=ny*TILE+TILE/2;
        }
      }
    }
    const dx=e.x-player.x,dy=e.y-player.y-4;
    if(dx*dx+dy*dy<(TILE*0.72)*(TILE*0.72)&&!(G.grace>0)){startBattle(e);return;}
  }
}
/* ---- カメラ：ふつうの部屋(16x9)は固定。広い部屋は主人公を追う（画面の中心に置き、部屋の端では止まる） ---- */
let camX=0,camY=0;   // 画面px（960x540）での、部屋の絵の左上からのずれ
function camTarget(){
  const pw=map[0].length*TILE*CAM_Z,ph=map.length*TILE*CAM_Z;
  return[clamp(player.x*CAM_Z-W/2,0,Math.max(0,pw-W)),clamp((player.y-15)*CAM_Z-H/2,0,Math.max(0,ph-H))];
}
function snapCamera(){const t=camTarget();camX=Math.round(t[0]);camY=Math.round(t[1]);}
function followCamera(dt){
  const t=camTarget(),k=1-Math.exp(-dt*14);
  camX=Math.abs(t[0]-camX)<1?Math.round(t[0]):Math.round(camX+(t[0]-camX)*k);
  camY=Math.abs(t[1]-camY)<1?Math.round(t[1]):Math.round(camY+(t[1]-camY)*k);
}
function updateDungeon(dt){
  updateDoorAnim(dt);
  updateMine(dt);
  if(G.msgT>0)G.msgT-=dt;
  if(G.grace>0)G.grace-=dt;
  if(G.fade){   // 部屋の移動（暗転）
    const f=G.fade;f.t+=dt;
    if(!f.done&&f.t>=0.16){
      f.done=true;enterRoom(f.room);
      if(THEMES[f.room.theme]){G.msg={text:THEMES[f.room.theme].n};G.msgT=1.3;}
      if(f.room._dark){playSfx('dark');spawnKubigari(f.room,f.gx,f.gy);}   // 灯りが消えたときの効果音（dark.mp3）＋ 停電後にだけ あらわれる敵
      player.gx=f.gx;player.gy=f.gy;
      player.x=f.gx*TILE+TILE/2;player.y=f.gy*TILE+TILE/2;player.moving=false;
      snapCamera();
    }
    if(f.t>=0.32)G.fade=null;
    return;
  }
  if(G.bigMap){
    if(hit['KeyZ']||hit['KeyX']||hit['KeyM']||hit['Escape']||hit['Enter']||hit['Tab']||hit['Space']){G.bigMap=false;menuSE();}
    return;
  }
  if(bag.open){updateBag(dt);return;}
  if(hit['Tab']||hit['KeyI']){openBag();menuSE();return;}   // TAB / I : バッグ（Bボタンでは開かない。左上のBAGをタップでも開く）
  if((hit['KeyX']||hit['KeyE'])&&(tryOpenChest()||tryPullLever()||tryOpenDoor()))return;   // B : 目の前の鉄ドアを開ける
  if(hit['KeyZ']||hit['KeyM']||hit['Space']){G.bigMap=true;menuSE();return;}            // A / M   : マップ全体
  updatePlayer(dt);
  if(G.mode!=='dungeon'||G.fade)return;
  followCamera(dt);
  updateEnemies(dt);
}

/* ========== 鉄ドア：Bボタンで開ける ========== */
function findDoor(){
  if(!map||G.mode!=='dungeon'||!curRoom)return null;
  const fx=player.x,fy=player.y+PFEET,gx=Math.floor(fx/TILE),gy=Math.floor(fy/TILE);
  let best=null,bd=1e9;
  const both=curRoom.theme==='bigtower';   // 監獄塔：ドアの北側（向こう側）からも開けられる
  for(let ty=gy-2;ty<=gy+2;ty++)for(let tx=gx-2;tx<=gx+2;tx++){
    if(ty<0||tx<0||ty+1>=map.length||tx>=map[0].length)continue;
    if(map[ty][tx]!==13||map[ty+1][tx]===13)continue;         // ドアの「いちばん下」のマス
    const yt=(ty>0&&map[ty-1][tx]===13)?ty-1:ty;
    if(curRoom.doorAnim&&curRoom.doorAnim[tx+','+yt])continue;
    const dy=fy-(ty+1)*TILE,dx=Math.abs(fx-(tx+0.5)*TILE);
    const dyN=yt*TILE-fy;   // ドアの上のふちから、足もとまでの距離（北側）
    const south=dy>=-6&&dy<=20&&dx<=TILE/2+4;
    const north=both&&dyN>=-6&&dyN<=20&&dx<=TILE/2+4;
    const side=fy>=yt*TILE-4&&fy<(ty+1)*TILE+2&&dx>TILE/2-2&&dx<=TILE/2+16;   // 横から（ドアの左右のはしに くっついた位置）
    if(!(south||north||side))continue;
    const sc=dx+(side&&!south&&!north?4:0);
    if(sc<bd){bd=sc;best={x:tx,yt,yb:ty};}
  }
  return best;
}
/* ========== 宝箱：Bボタンで開ける ========== */
const CHEST_REACH=TILE*1.25;   // 宝箱にどれだけ近づけば B で開けられるか（足元と宝箱の中心の距離）
function findChest(){
  if(!map||G.mode!=='dungeon'||!curRoom)return null;
  const fx=player.x,fy=player.y+PFEET;let best=null,bd=1e9;
  for(const e of entities){
    if(e.type!=='chest'||e.opened)continue;
    const d=Math.hypot(fx-e.x,fy-e.y);
    if(d<=CHEST_REACH&&d<bd){bd=d;best=e;}
  }
  return best;
}
function tryOpenChest(){
  const e=findChest();if(!e)return false;
  e.opened=true;
  let file=null,emoji='🎁',name=e.value;
  if(e.kind==='skill'){
    const mv=MOVE_DB[e.value];
    if(!player.moves.includes(e.value)){
      player.moves.push(e.value);
      G.msg={text:'あたらしいわざ「'+e.value+'」を おぼえた！'};
      file=BAG_ICON_FILES.moves[e.value];emoji=(mv&&mv.icon)||'📀';
    }else{
      player.items['チョコケーキ']=(player.items['チョコケーキ']||0)+1;
      G.msg={text:'チョコケーキを てにいれた！'};
