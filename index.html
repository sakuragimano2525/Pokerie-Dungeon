    if(q.st==='fly'&&q.t>0){   // のこぞう
      for(let j=1;j<=2;j++){
        const k=Math.max(0,Math.min(1,q.t/STAR.flyT)-0.07*j),e=k*k*(3-2*k);
        ctx.globalAlpha=0.35/j;
        const T=q.tgt||STAR_TARGET;
        drawStarAt(lerp(q.sx,T.x,e)+Math.sin(k*Math.PI)*-40,lerp(q.sy,T.y,e)+Math.sin(k*Math.PI)*-30,q.kind==='counter'?'#a64dff':'#ffe14d','#fff');
      }
      ctx.globalAlpha=1;
    }
    if(q.kind==='counter')drawStarAt(q.x,q.y,tw?'#a64dff':'#d6a8ff','#fff');
    else drawStarAt(q.x,q.y,tw?'#ffe14d':'#fff3a0','#fff');
  }
}
function spPopAdd(n){   // SP回復の表示：下のSPゲージの横に出す
  const p=battle.spPop;
  if(p&&p.t>0)p.n+=n;else battle.spPop={n:n,t:0};
  battle.spPop.t=1.0;
}
function counterTick(){battle.counter=Math.max(0,(battle.counter|0)-1);}   // カウンター：のこりターンを1へらす
function toCommandPhase(skipCounterTick){   // 回避ターンおわり → コマンドへ
  battle.phase='command';battle.t=0;battle.sub=0;battle.menuIdx=2;battle.rage=false;battle.shield=false;if(!skipCounterTick)counterTick();holmTick();battle.attacks=[];battle.enemyPose=null;battle.fx=[];battle.ecg={t:0};
}
function endDodge(){
  launchStars();
  if(battle.counterPending){   // カウンターの星がある：SPの星 → 紫の星 が飛びおわるまで コマンドは出さない
    battle.phase='counterFx';battle.t=0;battle.cfxT=0;
    battle.rage=false;battle.shield=false;counterTick();
    battle.attacks=[];battle.enemyPose=null;battle.fx=[];
  }else toCommandPhase();
}
function updateCounterFx(dt){
  if(battle.stars&&battle.stars.length){battle.cfxT=0;return;}
  battle.cfxT+=dt;
  if(battle.cfxT<0.7)return;
  for(const f of battle.foes){if(!f.dead&&f.hp<=0){f.dead=true;battle.expAcc+=expFor(f.def);startEnemyDust(f);}}
  if(!aliveFoes().length){
    battle.phase='win';battle.t=0;gainExp();
    if(G.floor>=11&&G.floor<=14&&Math.random()<0.5){
      player.items['マナキット']=(player.items['マナキット']||0)+1;
      battle.dropKit=1;
    }
    const ei=entities.indexOf(battle.entity);if(ei>=0)entities.splice(ei,1);
  }else{
    setTarget(aliveFoes()[0]);
    toCommandPhase(true);   // カウンターのターン数は counterFx に入るときに へらしてある
  }
}
function tryHitPlayer(cell,mul){
  if(battle.invuln>0)return false;
  const fx=dCellCX(cell.c),fy=dCellCY(cell.r);
  const base=Math.max(1,Math.round(battle.enemy.atk*(mul||1)*(battle.rage?RAGE_TAKE:1)));   // かんしゃく中は被ダメージ2倍
  // パリィ：ガードを「はなした」直後の一瞬だけ（押しはじめ・押しっぱなしはただのガード）
  const sinceRelease=battle.dodgeT-battle.guardReleaseT;
  const parried=(!battle.guardHeld&&sinceRelease<PARRY_WINDOW);
  if(parried){
    playSfx('pali');
    battle.parryFlash=0.55;
    spawnParryStar(battle.counter?base:0);   // カウンター中は 紫の星も（ダメージは星が敵に当たったとき）　SPは星が ゲージにすいこまれたときに ふえる
    battle.invuln=0.55;battle.noBlink=true;battle.guardReleaseT=-999;
  }else if(battle.guardHeld){
    if(!playSfx('guard'))playSfx('damage');   // guard.mp3（なければ damage.mp3）
    battle.hits++;
    battle.invuln=0.9;battle.noBlink=true;battle.shake=12;
    const dmg=shieldCut(Math.max(1,Math.round(base*GUARD_MULT)));
    player.hp-=dmg;if(player.hp<0)player.hp=0;
    player.sp=Math.min(player.maxSp,player.sp+1);
    spPopAdd(1);
    battle.floats.push({x:fx,y:fy-40,text:'-'+dmg,color:'#ffcc66',life:1.0,vy:-50});
  }else{
    playSfx('damage');
    battle.hits++;
    battle.invuln=0.9;battle.noBlink=false;battle.shake=Math.max(battle.shake,18);
    const dmgN=shieldCut(base);
    player.hp-=dmgN;if(player.hp<0)player.hp=0;
    player.sp=Math.min(player.maxSp,player.sp+1);
    spPopAdd(1);
    battle.floats.push({x:fx,y:fy-40,text:'-'+dmgN,color:'#ff6b6b',life:1.0,vy:-55});
  }
  if(player.hp<=0){battle.phase='lose';battle.t=0;}
  return true;
}
function addDust(x,y,n,spread,col){
  for(let i=0;i<n;i++)battle.fx.push({x:x+(Math.random()-0.5)*spread,y:y+(Math.random()-0.5)*8,
    vx:(Math.random()-0.5)*170,vy:-30-Math.random()*80,life:0.4+Math.random()*0.3,max:0.7,sz:2+((Math.random()*2)|0),col:col});
}

/* ========== 個別攻撃①：ゴーレム（上下に動く → ！！ → ジャンプ → 両手たたきつけ 2×2） ========== */
const G_BOB=0.30,G_WARN=0.5,G_LEAP=0.28,G_RAISE=0.24,G_SLAM=0.26,G_BACK=0.20;
const GOLEM_MUL=1.6;   // たたきつけのダメージ倍率
function spawnGolemSlam(R){
  if(R<1.5)return;   // ふりおろしまで時間が足りなければ出さない
  const def=battle.enemyDef;
  const pr=battle.prow;
  let r0;   // 2×2 の上端の行（0 = 上2段 / 1 = 下2段）。まん中の行は かならず ふくまれる
  if(pr===1)r0=Math.random()<0.5?0:1;
  else{
    const cover=(pr===0)?0:1;
    r0=Math.random()<clamp((def.targetBias||0.3)+0.3,0,0.9)?cover:1-cover;
  }
  const cells=[{c:0,r:r0},{c:1,r:r0},{c:0,r:r0+1},{c:1,r:r0+1}];
  battle.attacks.push({kind:'golem',cells,r0,phase:'bob',t:0,seed:Math.random()*6});
}
function updateGolemAtk(a,dt){
  a.t+=dt;
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const LX=(dCellCX(0)+dCellCX(1))/2;
  const LY=(dCellCY(a.r0)+dCellCY(a.r0+1))/2-13;   // 両手がちょうど2×2の中心に落ちる高さ
  const S0=2.1,S1=2.3;
  const p={x:HX,y:HY,s:S0,sx:1,sy:1,lift:0,front:false};
  switch(a.phase){
    case 'bob':{   // 右側で上下にうろうろ
      p.y=HY+Math.sin(a.t/G_BOB*Math.PI*3)*50;
      if(a.t>=G_BOB){a.phase='warn';a.t=0;}
      break;}
    case 'warn':{  // ！！ ためる
      p.x=HX+Math.sin(a.t*80)*2;p.y=HY+3;p.sx=1.08;p.sy=0.88;
      if(a.t>=G_WARN){a.phase='leap';a.t=0;}
      break;}
    case 'leap':{  // こっちのマスへ飛びかかる
      const tt=Math.min(1,a.t/G_LEAP),arc=Math.sin(tt*Math.PI);
      p.x=lerp(HX,LX,tt);p.y=lerp(HY,LY,tt)-arc*95;p.s=lerp(S0,S1,tt);
      p.sx=1-0.08*arc;p.sy=1+0.12*arc;p.lift=0.4*tt;p.front=true;
      if(a.t>=G_LEAP){
        a.phase='raise';a.t=0;battle.shake=Math.max(battle.shake,6);
        addDust(LX-40,LY+44,5,20);addDust(LX+40,LY+44,5,20);
      }
      break;}
    case 'raise':{ // 両手をふりあげる
      const tt=Math.min(1,a.t/G_RAISE),land=Math.max(0,1-a.t/0.08);
      p.x=LX;p.y=LY;p.s=S1;p.front=true;
      p.lift=lerp(0.4,1,1-(1-tt)*(1-tt));p.sx=1+0.15*land;p.sy=1-0.15*land;
      if(a.t>=G_RAISE){   // ふりおろした瞬間に判定
        a.phase='slam';a.t=0;battle.shake=Math.max(battle.shake,16);
        addDust(LX-41,LY+44,8,26);addDust(LX+41,LY+44,8,26);
        const v=playerVisCell();
        if(cellsHas(a.cells,v.c,v.r))tryHitPlayer(v,GOLEM_MUL);
      }
      break;}
    case 'slam':{  // 手をついたまま
      const sw=Math.min(1,a.t/0.09);
      p.x=LX;p.y=LY;p.s=S1;p.front=true;p.lift=1-sw*sw;
      const sq=Math.max(0,1-a.t/0.15);p.sx=1+0.1*sq;p.sy=1-0.1*sq;
      if(a.t>=G_SLAM){a.phase='back';a.t=0;}
      break;}
    case 'back':{  // ぴょんと もどる
      const tt=Math.min(1,a.t/G_BACK);
      p.x=lerp(LX,HX,tt);p.y=lerp(LY,HY,tt)-Math.sin(tt*Math.PI)*60;p.s=lerp(S1,S0,tt);
      p.lift=0.3*(1-tt);p.front=true;
      if(a.t>=G_BACK){a.dead=true;battle.spawnT=0.08;return;}
      break;}
  }
  battle.enemyPose=p;
}


/* ========== 個別攻撃：バケブーム（プレイヤーのまわりに爆弾を2つ投げる → 約1秒後に十字に爆発） ==========
   爆弾が落ちるマスは プレイヤーのいるマスの となり（ななめ含む）。2つの十字で 逃げ場がなくなることはない。 */
const BB_THROW=0.25,BB_FUSE=0.6,BB_BOOM=0.40,BB_MUL=1.4;
function bbCross(c,r){
  const out=[{c,r}];
  for(const d of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nc=c+d[0],nr=r+d[1];
    if(nc>=0&&nc<DGRID_COLS&&nr>=0&&nr<DGRID_ROWS)out.push({c:nc,r:nr});
  }
  return out;
}
function spawnBakeboom(R){
  if(R<BB_THROW+BB_FUSE+BB_BOOM+0.2)return;   // 爆発まで時間が足りなければ出さない
  const pc=battle.pcol,pr=battle.prow;
  const near=[];
  for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++){
    if(c===pc&&r===pr)continue;
    if(Math.abs(c-pc)<=1&&Math.abs(r-pr)<=1)near.push({c,r});
  }
  let pairs=[];
  for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){
    const u=bbCross(near[i].c,near[i].r).concat(bbCross(near[j].c,near[j].r));
    let safe=0;
    for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)if(!cellsHas(u,c,r))safe++;
    if(safe>=1)pairs.push([near[i],near[j]]);
  }
  let bombs;
  if(pairs.length)bombs=pairs[(Math.random()*pairs.length)|0];
  else bombs=[near[(Math.random()*near.length)|0]];   // 2つ置くと逃げ場がなくなるときは 1つだけ
  battle.attacks.push({kind:'bakeboom',bombs:bombs.map((b,i)=>({c:b.c,r:b.r,delay:i*0.12})),
    phase:'throw',t:0,seed:Math.random()*6});
}
function updateBakeboomAtk(a,dt){
  a.t+=dt;
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const p={x:HX,y:HY,s:2.1,sx:1,sy:1,lift:0,front:false};
  if(a.phase==='throw'){
    const k=Math.min(1,a.t/0.25),sw=Math.sin(k*Math.PI);
    p.x=HX+sw*8;p.y=HY-sw*10;p.sx=1+0.06*sw;p.sy=1-0.08*sw;
    if(a.t>=BB_THROW+0.12){a.phase='fuse';a.t=0;}
  }else if(a.phase==='fuse'){
    p.x=HX+Math.sin(a.t*50)*1.2;p.y=HY+Math.sin(a.t*14)*2;
    if(a.t>=BB_FUSE){
      a.phase='boom';a.t=0;battle.shake=Math.max(battle.shake,14);
      const hitCells=[];
      for(const b of a.bombs){
        for(const q of bbCross(b.c,b.r)){hitCells.push(q);addDust(dCellCX(q.c),dCellCY(q.r),4,30,'#ffb35a');}
      }
      a.cells=hitCells;
      const v=playerVisCell();
      if(cellsHas(hitCells,v.c,v.r)){tryHitPlayer(v,BB_MUL);if(battle.phase==='lose')return;}
    }
  }else{
    if(a.t>=BB_BOOM){a.dead=true;battle.spawnT=0.5;return;}
  }
  battle.enemyPose=p;
}
function drawBombIcon(x,y,r,blink){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+r*0.9,r*0.9,r*0.35,0,0,7);ctx.fill();
  ctx.fillStyle=blink?'#7a2a1a':'#222';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(x-r*0.35,y-r*0.35,r*0.28,0,7);ctx.fill();
  ctx.strokeStyle='#c9a46a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+r*0.3,y-r*0.85);ctx.quadraticCurveTo(x+r*0.7,y-r*1.4,x+r*1.1,y-r*1.1);ctx.stroke();
  ctx.fillStyle=blink?'#fff':'#ffcc33';ctx.beginPath();ctx.arc(x+r*1.1,y-r*1.1,r*0.28,0,7);ctx.fill();
  ctx.restore();
}
function drawBakeboomFx(a,tileX,tileY,TW,TH,pulse){
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  if(a.phase==='throw'){
    for(const b of a.bombs){
      const tt=clamp((a.t-b.delay)/0.28,0,1);
      if(a.t<b.delay)continue;
      const x=lerp(HX-25,dCellCX(b.c),tt),y=lerp(HY-10,dCellCY(b.r),tt)-Math.sin(tt*Math.PI)*70;
      drawBombIcon(x,y,11,false);
    }
  }else if(a.phase==='fuse'){
    const fast=0.5+0.5*Math.sin(a.t*(10+a.t*26));   // だんだん点滅が速くなる
    const P={f:'255,150,40',b:'#ff9a2a',b2:'#fff0b0',t:'#7a2a00'};
    for(const b of a.bombs)for(const q of bbCross(b.c,b.r))warnCell(tileX(q.c),tileY(q.r),TW,TH,fast,false,P);
    for(const b of a.bombs){
      const bounce=Math.max(0,1-a.t/0.15)*6;
      drawBombIcon(dCellCX(b.c),dCellCY(b.r)-bounce,13,fast>0.5);
    }
  }else if(a.phase==='boom'){
    const k=clamp(a.t/BB_BOOM,0,1);
    ctx.fillStyle='rgba(255,170,60,'+(0.65*(1-k))+')';
    for(const q of a.cells)ctx.fillRect(tileX(q.c),tileY(q.r),TW,TH);
    for(const b of a.bombs){
      const cx=dCellCX(b.c),cy=dCellCY(b.r),rr=14+k*34;
      ctx.globalAlpha=1-k;
      ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(cx,cy,rr,0,7);ctx.fill();
      ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.arc(cx,cy,rr*0.65,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

/* ========== 個別攻撃②：コウモリ（ためて → 横一列を急降下 ／ ジグザグ急降下） ========== */
const B_DIVE=0.34,B_GONE=0.1,B_RET=0.3,B_MUL=1.5;
function pathPos(path,u){
  let total=0;const seg=[];
  for(let i=1;i<path.length;i++){const l=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);seg.push(l);total+=l;}
  let d=clamp(u,0,1)*total;
  for(let i=0;i<seg.length;i++){
    if(d<=seg[i]||i===seg.length-1){const k=seg[i]?Math.min(1,d/seg[i]):0;return[lerp(path[i][0],path[i+1][0],k),lerp(path[i][1],path[i+1][1],k)];}
    d-=seg[i];
  }
  return path[path.length-1];
}
function batRoute(ra,zig,rb){   // 急降下のコース（ふつう／ジグザグ）
  const SX=760,YA=dCellCY(ra);
  if(!zig)return{cells:[{c:1,r:ra},{c:0,r:ra}],path:[[SX,YA],[-70,YA]]};
  return{cells:[{c:1,r:ra},{c:0,r:rb}],path:[[SX,YA],[dCellCX(1),YA],[dCellCX(0),dCellCY(rb)],[-70,dCellCY(rb)]]};
}
function spawnBatDive(R){
  if(R<1.1)return;
  const def=battle.enemyDef;
  const prog=battle.dodgeT/DODGE_DUR;
  let ra=Math.random()<(def.targetBias||0.3)+0.15?battle.prow:((Math.random()*3)|0);
  if(battle.duo){   // 2匹のときは、もう1匹と ちがう段をねらう
    const used=battle.attacks.filter(x=>x.kind==='bat').map(x=>x.ra);
    let g=0;while(used.includes(ra)&&g++<12)ra=(Math.random()*3)|0;
  }
  const zig=prog>0.2&&Math.random()<0.6;   // 途中からジグザグ急降下も混ざる
  let rb=0;
  if(zig){do{rb=(Math.random()*3)|0;}while(rb===ra);}
  // フェイント：'switch' = 予告した段から直前に別の段へ移る ／ 'fake' = 一度つっこむふりをして引き返し、そのあと本命
  let feint=null;
  if(prog>0.12){
    const f=Math.random();
    if(f<0.35&&!zig&&R>=1.4)feint='switch';
    else if(f<0.65&&R>=1.95)feint='fake';
  }
  let ra2=ra;
  if(feint==='switch'){do{ra2=(Math.random()*3)|0;}while(ra2===ra);}
  const warnDur=feint==='switch'?0.85-0.15*prog:0.75-0.2*prog;
  const rt=batRoute(ra,zig,rb);
  battle.attacks.push({kind:'bat',cells:rt.cells,path:rt.path,ra,ra2,zig,rb,feint,switched:false,flash:0,by:foeHome(battle.enemy).y,
    phase:'warn',t:0,warnDur,hitDone:false,px:760,seed:Math.random()*6});
}
function updateBatAtk(a,dt){
  a.t+=dt;
  const H0=foeHome(a.foe||battle.enemy),HX=H0.x,HY=H0.y,SX=760;
  let YA=dCellCY(a.ra);
  if(a.flash>0)a.flash-=dt;
  const p={x:HX,y:HY,s:2.1,sx:1,sy:1,lift:0,hidden:false,trail:null,front:false};
  switch(a.phase){
    case 'warn':{   // 右にさがって ぷるぷる（ため）
      if(a.feint==='switch'&&!a.switched&&a.t>=a.warnDur-0.42){   // フェイント：直前で別の段へ
        a.switched=true;a.ra=a.ra2;YA=dCellCY(a.ra);
        const rt=batRoute(a.ra,false,0);a.cells=rt.cells;a.path=rt.path;a.flash=0.3;
        battle.shake=Math.max(battle.shake,3);addDust(SX-20,a.by,6,20,'#ff9a9a');
      }
      const tt=Math.min(1,a.t/0.28),e=1-(1-tt)*(1-tt);
      a.by+=(YA-a.by)*Math.min(1,dt*16);
      p.x=lerp(HX,SX,e)+Math.sin(a.t*45)*2;p.y=a.by+Math.sin(a.t*30)*3;
      if(a.t>=a.warnDur){
        if(a.feint==='fake'){a.phase='fake';a.t=0;}
        else{a.phase='dive';a.t=0;a.px=SX;}
      }
      break;}
    case 'fake':{   // つっこむふり（あたり判定なし）→ 引き返す
      const tt=Math.min(1,a.t/0.42),u=0.45*Math.sin(tt*Math.PI);
      const pos=pathPos(a.path,u);
      p.x=pos[0];p.y=pos[1];p.sx=1.25;p.sy=0.82;
      if(tt<0.5)p.trail=[0.05,0.1,0.15].map(d=>pathPos(a.path,Math.max(0,u-d)));
      if(a.t>=0.42){a.phase='pause';a.t=0;addDust(SX-20,YA,5,18,'#ff9a9a');}
      break;}
    case 'pause':{  // ひと呼吸おいて本命
      p.x=SX+Math.sin(a.t*60)*2;p.y=YA+Math.sin(a.t*40)*3;
      if(a.t>=0.26){a.phase='dive';a.t=0;a.px=SX;}
      break;}
    case 'dive':{
      const tt=Math.min(1,a.t/B_DIVE),e=tt*tt*0.6+tt*0.4;
      const pos=pathPos(a.path,e),bx=pos[0],by=pos[1];
      p.x=bx;p.y=by;p.sx=1.35;p.sy=0.75;
      p.trail=[0.06,0.12,0.18].map(d=>pathPos(a.path,Math.max(0,e-d)));
      if(!a.hitDone){   // 通りすぎる間にプレイヤーのマスをかすめたら命中
        const v=playerVisCell();
        if(cellsHas(a.cells,v.c,v.r)){
          const cx=dCellCX(v.c);
          const lo=Math.min(a.px,bx),hi=Math.max(a.px,bx);
          if(hi>=cx-30&&lo<=cx+30){a.hitDone=true;tryHitPlayer(v,B_MUL);}
        }
      }
      a.px=bx;
      if(a.t>=B_DIVE){a.phase='gone';a.t=0;}
      break;}
    case 'gone':{
      p.hidden=true;
      if(a.t>=B_GONE){a.phase='ret';a.t=0;}
      break;}
    case 'ret':{    // 右の画面外から もどってくる
      const tt=Math.min(1,a.t/B_RET),e=1-(1-tt)*(1-tt);
      p.x=lerp(W+50,HX,e);p.y=HY;
      if(a.t>=B_RET){a.dead=true;battle.spawnT=0.15;return;}
      break;}
  }
  battle.enemyPose=p;
}

/* ========== 個別攻撃③：ゴースト（すーっと消える → マスに順番にバァッ！と現れる） ========== */
const GH_FADE=0.5,GH_P0=0.42,GH_POP=0.26,GH_RET=0.4,GH_MUL=1.6;   // 攻撃位置は GH_FADE（ゴーストが消えるあいだ）だけ見える → 消えたら見えなくなって、GH_P0 後から順にバァッ！
const GH_BASE=0.94;   // これより残り時間がみじかいと出さない
function spawnGhostHaunt(R){
  if(R<GH_BASE)return;
  const def=battle.enemyDef;
  const prog=battle.dodgeT/DODGE_DUR;
  const gap=0.34-0.07*prog;   // 出現のあいだかく（従来より はやい）
  let n=prog<0.35?3:prog<0.75?4:5;
  n=Math.min(n,1+Math.floor((R-GH_BASE)/gap));   // さいごの出現が時間内におさまる数
  const cells=[];
  const has=(c,r)=>cells.some(k=>k.c===c&&k.r===r);
  if(Math.random()<Math.max(def.targetBias||0.5,0.7))cells.push({c:battle.pcol,r:battle.prow});
  else cells.push({c:(Math.random()*2)|0,r:(Math.random()*3)|0});
  let guard=0;
  while(cells.length<n&&guard++<60){
    const b=cells[cells.length-1];
    const c=(Math.random()*2)|0,r=(Math.random()*3)|0;
    if(has(c,r))continue;
    if(guard<30&&Math.abs(c-b.c)+Math.abs(r-b.r)>2)continue;   // なるべく近くへふわふわ
    cells.push({c,r});
  }
  const pt=cells.map((_,i)=>GH_P0+gap*i);
  battle.attacks.push({kind:'ghost',cells,n:cells.length,pt,popped:[],phase:'fade',t:0,seed:Math.random()*6});
}
function updateGhostAtk(a,dt){
  a.t+=dt;
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const p={x:HX,y:HY,s:2.1,sx:1,sy:1,lift:0,front:false,alpha:1,hidden:false};
  switch(a.phase){
    case 'fade':{   // すーっと透けて消える
      const tt=Math.min(1,a.t/GH_FADE);
      p.alpha=1-tt;p.y=HY-16*tt;p.sx=1-0.15*tt;p.sy=1+0.2*tt;
      if(Math.random()<0.5)addDust(HX,HY+6,1,34,'#b8e8ff');
      if(a.t>=GH_FADE){a.phase='haunt';a.t=0;}
      break;}
    case 'haunt':{
      p.hidden=true;
      for(let i=0;i<a.n;i++){
        if(!a.popped[i]&&a.t>=a.pt[i]){   // バァッ！と出た瞬間に判定
          a.popped[i]=true;
          const cell=a.cells[i];
          battle.shake=Math.max(battle.shake,8);
          addDust(dCellCX(cell.c),dCellCY(cell.r),10,32,'#c8b0ff');
          const v=playerVisCell();
          if(v.c===cell.c&&v.r===cell.r){tryHitPlayer(v,GH_MUL);if(battle.phase==='lose')return;}
        }
      }
      for(let i=a.n-1;i>=0;i--){   // いま出ているゴースト
        const el=a.t-a.pt[i];
        if(el>=0&&el<GH_POP){
          const cell=a.cells[i],tt=el/GH_POP,e=1-(1-tt)*(1-tt);
          p.hidden=false;p.x=dCellCX(cell.c);p.y=dCellCY(cell.r)-14;
          p.s=lerp(1.2,2.0,e);p.alpha=tt<0.25?tt/0.25:1-(tt-0.25)/0.75;
          p.sx=1+0.2*(1-e);p.sy=1+0.25*(1-e);p.front=true;
          break;
        }
      }
      if(a.t>=a.pt[a.n-1]+GH_POP){a.phase='ret';a.t=0;}
      break;}
    case 'ret':{    // もとの場所に すーっと もどる
      const tt=Math.min(1,a.t/GH_RET);
      p.alpha=tt;p.y=HY-16*(1-tt);
      if(a.t>=GH_RET){a.dead=true;battle.spawnT=0.3;return;}
      break;}
  }
  battle.enemyPose=p;
}

/* ========== 個別攻撃⑤：ウィザード（波動を放つ → 全マスを順番においかけてまわる） ========== */
const W_CHARGE=0.55,W_SHOOT=0.3,W_HOP=0.1,W_RET=0.35,W_MUL=1.0;
const WIZ_SPEED=1.15;   // 通常ウィザードの攻撃速度の倍率（1.0 = 従来。大きいほど速い。ボスには影響しません）
const WAVE_PATHS=(()=>{   // 2×3 の全マスを一度ずつ通る道すじ（ななめ移動ありのぜんぶ）
  const out=[];
  const dfs=(path,used)=>{
    if(path.length===DGRID_COLS*DGRID_ROWS){out.push(path.slice());return;}
    const b=path[path.length-1];
    for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){
      if(!dc&&!dr)continue;
      const c=b.c+dc,r=b.r+dr;
      if(c<0||c>=DGRID_COLS||r<0||r>=DGRID_ROWS||used.has(c+','+r))continue;
      used.add(c+','+r);path.push({c,r});dfs(path,used);path.pop();used.delete(c+','+r);
    }
  };
  for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)dfs([{c,r}],new Set([c+','+r]));
  return out;
})();
function spawnWizardWave(R,opt){
  opt=opt||{};
  const def=battle.enemyDef;
  const prog=battle.dodgeT/DODGE_DUR;
  const spd=def.isBoss?1:WIZ_SPEED;
  const step=(0.40-0.07*prog)*(opt.stepMul||1)/spd;   // つぎのマスへ うつるまでの予告時間
  const n=DGRID_COLS*DGRID_ROWS;
  const need=W_CHARGE/spd+W_SHOOT+(n-1)*(step+W_HOP)+0.15;   // さいごのマスに つくまで
  if(R<need)return;
  // はじまりのマス：たまに いまプレイヤーのいるマスから
  let pool=WAVE_PATHS;
  if(Math.random()<(def.targetBias||0.35)+0.2){
    const f=WAVE_PATHS.filter(q=>q[0].c===battle.pcol&&q[0].r===battle.prow);
    if(f.length)pool=f;
  }
  const path=pool[(Math.random()*pool.length)|0];
  battle.attacks.push({kind:'wizard',path,step,ct:W_CHARGE/spd,gap:0.4/spd,sc:opt.sc,mul:opt.mul,idx:-1,phase:'charge',t:0,
    ox:0,oy:0,ox0:0,oy0:0,orb:null,rings:[],seed:Math.random()*6});
}
function updateWizardAtk(a,dt){
  a.t+=dt;
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const p={x:HX,y:HY,s:a.sc||2.1,sx:1,sy:1,lift:0,front:false,alpha:1,hidden:false};
  const hand=()=>[p.x+14*p.s,p.y-18*p.s];   // つえの先
  for(const r of a.rings)r.t+=dt;
  a.rings=a.rings.filter(r=>r.t<0.45);
  const burst=(i)=>{   // その マスに 波動がバァン！と着地：判定
    const cell=a.path[i];
    a.rings.push({c:cell.c,r:cell.r,t:0});
    battle.shake=Math.max(battle.shake,5);
    addDust(dCellCX(cell.c),dCellCY(cell.r),8,30,'#e0a5ff');
    const v=playerVisCell();
    if(v.c===cell.c&&v.r===cell.r){tryHitPlayer(v,a.mul||W_MUL);return battle.phase==='lose';}
    return false;
  };
  switch(a.phase){
    case 'charge':{   // つえに ちからをためる
      const tt=Math.min(1,a.t/a.ct);
      p.x=HX+Math.sin(a.t*70)*1.5;p.y=HY-4*tt;p.sx=1-0.05*tt;p.sy=1+0.08*tt;
      const h=hand();a.orb={x:h[0],y:h[1],r:3+7*tt};
      if(a.t>=a.ct){a.phase='shoot';a.t=0;a.ox0=h[0];a.oy0=h[1];a.idx=0;}
      break;}
    case 'shoot':{    // 最初のマスへ はなつ
      const tt=Math.min(1,a.t/W_SHOOT),e=tt*tt*0.4+tt*0.6;
      const c0=a.path[0],tx=dCellCX(c0.c),ty=dCellCY(c0.r)-14;
      p.x=HX-6*Math.sin(tt*Math.PI);p.sx=1.06;p.sy=0.95;
      a.orb={x:lerp(a.ox0,tx,e),y:lerp(a.oy0,ty,e)-Math.sin(tt*Math.PI)*24,r:10};
      if(a.t>=W_SHOOT){
        a.orb={x:tx,y:ty,r:10};
        if(burst(0))return;
        a.phase='wait';a.t=0;
      }
      break;}
    case 'wait':{     // つぎのマスを よこくして…
      const cur=a.path[a.idx];
      a.orb={x:dCellCX(cur.c),y:dCellCY(cur.r)-14+Math.sin(a.t*30)*2,r:10};
      if(a.t>=a.step){a.phase='hop';a.t=0;}
      break;}
    case 'hop':{      // ぴょんと つぎのマスへ
      const from=a.path[a.idx],to=a.path[a.idx+1];
      const tt=Math.min(1,a.t/W_HOP);
      a.orb={x:lerp(dCellCX(from.c),dCellCX(to.c),tt),
             y:lerp(dCellCY(from.r),dCellCY(to.r),tt)-14-Math.sin(tt*Math.PI)*16,r:10};
      if(a.t>=W_HOP){
        a.idx++;
        if(burst(a.idx))return;
        if(a.idx>=a.path.length-1){a.phase='end';a.t=0;}
        else{a.phase='wait';a.t=0;}
      }
      break;}
    case 'end':{      // 波動が きえる
      const last=a.path[a.path.length-1];
      const tt=Math.min(1,a.t/W_RET);
      a.orb={x:dCellCX(last.c),y:dCellCY(last.r)-14,r:10*(1-tt)};
      p.alpha=1;p.y=HY;
      if(a.t>=W_RET){a.dead=true;battle.spawnT=a.gap;return;}
      break;}
  }
  battle.enemyPose=p;
}
function drawWaveFx(tileX,tileY,TW,TH){   // マスの予告（ドンッの輪っか）
  for(const a of battle.attacks){
    if(a.kind!=='wizard')continue;
    const pulse=0.5+0.5*Math.sin(a.seed+battle.enemyAnim*16);
    let nxt=null;
    if(a.phase==='charge'||a.phase==='shoot')nxt=a.path[0];
    else if(a.phase==='wait'||a.phase==='hop')nxt=a.path[a.idx+1];
    if(nxt)warnCell(tileX(nxt.c),tileY(nxt.r),TW,TH,pulse,true,WARN_WAVE);
    // 進行方向のてんてん
    if(a.phase==='wait'||a.phase==='hop'){
      const f=a.path[a.idx],t=a.path[a.idx+1];
      const x0=dCellCX(f.c),y0=dCellCY(f.r),x1=dCellCX(t.c),y1=dCellCY(t.r);
      for(let k=1;k<=3;k++){const u=k/4;uR(Math.round(lerp(x0,x1,u)/U)-1,Math.round(lerp(y0,y1,u)/U)-1,2,2,'#f0d8ff');}
    }
    if(a.phase==='charge'&&battle.enemyPose)uText('！',battle.enemyPose.x/U,(battle.enemyPose.y-60)/U,16,'#ffe14d','center','#a00000');
    for(const r of a.rings){   // 着地の波紋
      const k=r.t/0.45,cx=dCellCX(r.c)/U,cy=dCellCY(r.r)/U;
      ctx.fillStyle='rgba(220,170,255,'+(0.45*(1-k))+')';ctx.fillRect(tileX(r.c),tileY(r.r),TW,TH);
      ctx.globalAlpha=1-k;
      const rr=Math.round(6+k*30);
      uBox(cx-rr,cy-Math.round(rr*0.6),rr*2,Math.round(rr*1.2),'#f0d8ff');
      uBox(cx-rr+2,cy-Math.round(rr*0.6)+2,Math.max(0,rr*2-4),Math.max(0,Math.round(rr*1.2)-4),'#c070ff');
      ctx.globalAlpha=1;
    }
  }
}
function drawWaveOrbs(){   // 波動の玉（プレイヤーより手前）
  for(const a of battle.attacks){
    if(a.kind!=='wizard'||!a.orb||a.orb.r<=0.3)continue;
    const o=a.orb,fl=1+0.12*Math.sin(battle.enemyAnim*30);
    ctx.save();
    ctx.shadowColor='#d080ff';ctx.shadowBlur=16;
    ctx.fillStyle='#8a30d8';ctx.beginPath();ctx.arc(o.x,o.y,o.r*fl,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#d8a0ff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*0.7*fl,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,o.r*0.35,0,7);ctx.fill();
    ctx.restore();
  }
}

/* ========== 個別攻撃④：ナイト（抜刀 → 斬撃コンボ：よこ／たて／ななめ） ========== */
const K_DRAW=0.35,K_WARN1=0.75,K_WARN=0.55,K_END=0.45,KNIGHT_MUL=1.15;
const GX0=222,GX1=374,GY0=174,GY1=316;   // 2×3マス全体の範囲
function slashCells(p0,p1){
  const m=new Map();
  for(let k=0;k<=60;k++){
    const u=k/60,x=lerp(p0[0],p1[0],u),y=lerp(p0[1],p1[1],u);
    if(x<GX0||x>GX1||y<GY0||y>GY1)continue;
    const c=x<298?0:1,r=y<221?0:y<269?1:2;
    m.set(c+','+r,{c,r});
  }
  return Array.from(m.values());
}
function makeSlash(ty){
  const tb=battle.enemyDef.targetBias||0.4;
  let p0,p1;
  if(ty==='yoko'){          // 右から左へ横ぎり（1列ぶん）
    const r=Math.random()<tb?battle.prow:((Math.random()*3)|0),y=dCellCY(r);
    p0=[GX1+44,y];p1=[GX0-44,y];
  }else if(ty==='tate'){    // 上から下へ縦ぎり（1行ぶん）
    const c=Math.random()<tb?battle.pcol:((Math.random()*2)|0),x=dCellCX(c);
    p0=[x,GY0-40];p1=[x,GY1+40];
  }else if(Math.random()<0.5){   // ななめぎり（右上→左下）
    p0=[GX1+38,GY0-36];p1=[GX0-38,GY1+36];
  }else{                         // ななめぎり（左上→右下）
    p0=[GX0-38,GY0-36];p1=[GX1+38,GY1+36];
  }
  return{ty,p0,p1,cells:slashCells(p0,p1)};
}
function spawnKnightCombo(R,opt){
  opt=opt||{};const spd=opt.spd||1;
  if(R<1.2)return;
  const prog=battle.dodgeT/DODGE_DUR;
  let n=opt.n||(prog<0.45?2:3);
  n=Math.min(n,1+Math.floor((R-1.2)/(K_WARN*spd)));   // さいごの斬撃が時間内におさまる数
  const slashes=[];let prev=null;
  for(let i=0;i<n;i++){
    let ty,g=0;
    do{const r=Math.random();ty=r<0.3?'yoko':r<0.6?'tate':'naname';}while(ty===prev&&g++<10);
    slashes.push(makeSlash(ty));prev=ty;
  }
  battle.attacks.push({kind:'knight',phase:'draw',t:0,i:0,slashes,fx:[],swingT:999,spd,sc:opt.sc,mul:opt.mul,seed:Math.random()*6});
}
function knightLunge(sT){return sT<0.1?60*sT/0.1:sT<0.3?60:sT<0.5?60*(1-(sT-0.3)/0.2):0;}
function knightSword(sT,t){
  if(sT<0.10)return lerp(0.9,-2.0,sT/0.10);
  if(sT<0.30)return -2.0;
  if(sT<0.50)return lerp(-2.0,0.9,(sT-0.3)/0.2);
  return 0.9+Math.sin(t*50)*0.04;
}
function updateKnightAtk(a,dt){
  a.t+=dt;a.swingT+=dt;
  for(const f of a.fx)f.t+=dt;
  a.fx=a.fx.filter(f=>f.t<0.5);
  const HX=D_ENEMY_X,HY=D_ENEMY_Y,FX=640;
  const p={x:HX,y:HY,s:a.sc||2.1,sx:1,sy:1,lift:0,front:false,sword:undefined};
  switch(a.phase){
    case 'draw':{   // 前に出て抜刀
      const tt=Math.min(1,a.t/K_DRAW),e=1-(1-tt)*(1-tt);
      p.x=lerp(HX,FX,e);p.sword=lerp(2.7,0.9,e);
      if(a.t>=K_DRAW){a.phase='warn';a.t=0;}
      break;}
    case 'warn':{
      const dur=(a.i===0?K_WARN1:K_WARN)*(a.spd||1);
      p.x=FX-knightLunge(a.swingT);p.sword=knightSword(a.swingT,a.t);
      if(a.t>=dur){   // 斬る！その瞬間に判定
        const sl=a.slashes[a.i];
        a.fx.push({p0:sl.p0,p1:sl.p1,cells:sl.cells,t:0});
        a.swingT=0;battle.shake=Math.max(battle.shake,10);
        const v=playerVisCell();
        if(cellsHas(sl.cells,v.c,v.r)){tryHitPlayer(v,a.mul||KNIGHT_MUL);if(battle.phase==='lose')return;}
        a.i++;a.t=0;
        if(a.i>=a.slashes.length)a.phase='end';
      }
      break;}
    case 'end':{    // 剣をおさめてもどる
      const tt=Math.min(1,a.t/K_END),back=tt>0.4?(tt-0.4)/0.6:0;
      p.x=lerp(FX-knightLunge(a.swingT),HX,back);
      p.sword=tt<0.8?knightSword(a.swingT,a.t):undefined;
      if(a.t>=K_END){a.dead=true;battle.spawnT=0.3;return;}
      break;}
  }
  battle.enemyPose=p;
}
function drawSlashFx(f,tileX,tileY,TW,TH){
  const t=f.t,u=Math.min(1,t/0.09);
  const fade=t<0.09?1:Math.max(0,1-(t-0.09)/0.4);
  const ex=lerp(f.p0[0],f.p1[0],u),ey=lerp(f.p0[1],f.p1[1],u);
  ctx.fillStyle='rgba(255,255,255,'+(0.4*fade)+')';
  for(const cell of f.cells)ctx.fillRect(tileX(cell.c),tileY(cell.r),TW,TH);
  ctx.save();ctx.lineCap='round';
  ctx.globalAlpha=0.55*fade;ctx.strokeStyle='#7fe4ff';ctx.lineWidth=22*fade+4;
  ctx.beginPath();ctx.moveTo(f.p0[0],f.p0[1]);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.globalAlpha=fade;ctx.strokeStyle='#ffffff';ctx.lineWidth=8*fade+2;
  ctx.beginPath();ctx.moveTo(f.p0[0],f.p0[1]);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=fade;
  for(let k=0;k<7;k++){   // 火花
    const uu=u*k/6,off=Math.sin(k*12.9+f.p0[0]+f.p0[1])*12;
    const sx=lerp(f.p0[0],f.p1[0],uu)+off,sy=lerp(f.p0[1],f.p1[1],uu)-off*0.7-t*30;
    uR(Math.round(sx/U),Math.round(sy/U),2,2,k&1?'#fff':'#bff4ff');
  }
  ctx.globalAlpha=1;
}

/* ========== 個別攻撃⑥：ボス「ダンジョンの主」（12秒／HP半分以下で かくせい） ========== */
const BOSS_S=2.6,BOSS_STX=660;
function bossAwake(){return !!(battle.enemy&&battle.enemy.isBoss&&battle.enemy.hp<=battle.enemy.maxHp*0.5);}
function eCol(d){return (d.isBoss&&bossAwake())?['#ff9a8a','#9a1414']:[d.color,d.dark];}
function drawBossAura(c,x,y,s){   // かくせい中の ほのお
  const t=battle.enemyAnim,k=0.5+0.5*Math.sin(t*6),m=s/2.1;
  c.save();
  const g=c.createRadialGradient(x,y,4,x,y,52*m);
  g.addColorStop(0,'rgba(255,60,40,'+(0.35+0.15*k)+')');g.addColorStop(1,'rgba(255,60,40,0)');
  c.fillStyle=g;c.beginPath();c.ellipse(x,y,52*m,64*m,0,0,7);c.fill();
  for(let i=0;i<7;i++){
    const ph=(t*0.9+i/7)%1,fx=x+Math.sin(i*2.3+t*2)*24*m,fy=y+22*m-ph*78*m;
    c.globalAlpha=1-ph;c.fillStyle=i&1?'#ff7a3a':'#ffd060';c.fillRect(fx-2,fy-2,4,4);
  }
  c.restore();
}
function spawnBossQuake(R,ph){   // 地ゆらし：剣をたたきつけ 衝撃波が右から左へ走る
  const f=ph===2?0.8:1;
  if(R<0.9*f+0.32+0.4+0.15)return false;
  let rows;
  if(ph===1)rows=[Math.random()<0.55?battle.prow:((Math.random()*3)|0)];
  else{const safe=(Math.random()*3)|0;rows=[0,1,2].filter(r=>r!==safe);}   // かくせい：2列ふさぐ
  battle.attacks.push({kind:'boss',mode:'quake',rows,f,phase:'raise',t:0,T:0,front:0,hit:{},fx:[],seed:Math.random()*6});
  return true;
}
function spawnBossRain(R,ph){   // 闇の魔法陣：いくつかのマスが いっせいに爆ぜる（かくせい後は2連）
  const f=ph===2?0.82:1,fuse=0.95*f;
  if(R<fuse+0.3+0.35+0.15)return false;
  const two=ph===2&&R>=fuse+0.3+0.58+0.3+0.35+0.15;
  const all=[];for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)all.push({c,r});
  const shuf=all.slice().sort(()=>Math.random()-0.5),n=ph===2?4:3,A=[];
  if(Math.random()<0.5)A.push({c:battle.pcol,r:battle.prow});
  for(const q of shuf){if(A.length>=n)break;if(!cellsHas(A,q.c,q.r))A.push(q);}
  const stages=[{cells:A,fuse}];
  if(two)stages.push({cells:all.filter(q=>!cellsHas(A,q.c,q.r)),fuse:0.58});   // のこりのマスも すぐ爆ぜる
  battle.attacks.push({kind:'boss',mode:'rain',stages,si:0,phase:'charge',t:0,T:0,fx:[],seed:Math.random()*6});
  return true;
}
function spawnBossSafe(R,ph){   // 闇の大爆発（かくせい後のみ）：安全なマスは ひとつだけ
  if(ph!==2)return false;
  const fuse=1.05;
  if(R<fuse+0.4+0.35+0.15)return false;
  let safe;
  if(Math.random()<0.7){do{safe={c:(Math.random()*2)|0,r:(Math.random()*3)|0};}while(safe.c===battle.pcol&&safe.r===battle.prow);}
  else safe={c:(Math.random()*2)|0,r:(Math.random()*3)|0};
  battle.attacks.push({kind:'boss',mode:'safe',safe,fuse,phase:'charge',t:0,T:0,fx:[],seed:Math.random()*6});
  return true;
}
function spawnBossAct(R){   // ボスの技を じゅんばんに えらぶ（同じ技が続かないように）
  const ph=battle.bossPhase||1;
  if(!battle.bossBag||!battle.bossBag.length){
    const modes=ph===2?['combo','quake','rain','safe','wave']:['combo','quake','rain'];
    battle.bossBag=modes.slice().sort(()=>Math.random()-0.5);
    if(battle.bossLast&&battle.bossBag[0]===battle.bossLast&&battle.bossBag.length>1)battle.bossBag.push(battle.bossBag.shift());
  }
  const bag=battle.bossBag;
  for(let k=0;k<bag.length;k++){
    const m=bag[k],n0=battle.attacks.length;
    let ok=false;
    if(m==='combo')spawnKnightCombo(R,ph===2?{n:4,spd:0.8,sc:BOSS_S,mul:1.15}:{n:3,spd:0.92,sc:BOSS_S,mul:1.1});
    else if(m==='wave')spawnWizardWave(R,{stepMul:0.85,sc:BOSS_S,mul:1.0});
    else if(m==='quake')ok=spawnBossQuake(R,ph);
    else if(m==='rain')ok=spawnBossRain(R,ph);
    else if(m==='safe')ok=spawnBossSafe(R,ph);
    if(ok||battle.attacks.length>n0){bag.splice(k,1);battle.bossLast=m;return;}
  }
}
function updateBossAtk(a,dt){
  a.t+=dt;a.T+=dt;
  for(const f of a.fx)f.t+=dt;
  a.fx=a.fx.filter(f=>f.t<0.45);
  const HX=D_ENEMY_X,HY=D_ENEMY_Y,STX=BOSS_STX;
  const p={x:HX,y:HY,s:BOSS_S,sx:1,sy:1,lift:0,front:false,sword:undefined};
  const es=Math.min(1,a.T/0.25),estep=1-(1-es)*(1-es);
  const done=()=>{a.dead=true;battle.spawnT=(battle.bossPhase===2)?0.22:0.5;};
  const recover=(fromX,fromSw,D)=>{   // もとの位置にもどる
    const tt=Math.min(1,a.t/D);
    p.x=lerp(fromX,HX,tt);p.sword=tt<0.6?lerp(fromSw,0.9,tt/0.6):undefined;
    if(a.t>=D){done();return true;}
    return false;
  };
  switch(a.mode){
    case 'quake':{
      const f=a.f,QX=650;
      if(a.phase==='raise'){
        const D=0.9*f*0.6,tt=Math.min(1,a.t/D),e=1-(1-tt)*(1-tt);
        p.x=lerp(HX,QX,e);p.sword=lerp(0.9,2.6,e);
        if(a.t>=D){a.phase='hold';a.t=0;}
      }else if(a.phase==='hold'){
        p.x=QX+Math.sin(a.t*70)*2;p.sword=2.6+Math.sin(a.t*50)*0.05;p.sy=1.03;
        if(a.t>=0.9*f*0.4){
          a.phase='wave';a.t=0;a.front=QX-30;
          battle.shake=Math.max(battle.shake,16);addDust(QX-40,HY+34,8,30,'#e0a5ff');
        }
      }else if(a.phase==='wave'){
        const D=0.34,tt=Math.min(1,a.t/D);
        a.front=lerp(QX-30,170,tt);
        p.x=QX-30;p.sword=-2.0;p.sx=1.08;p.sy=0.92;
        for(const r of a.rows)for(let c=DGRID_COLS-1;c>=0;c--){
          const key=c+','+r;
          if(!a.hit[key]&&a.front<=dCellCX(c)+30){
            a.hit[key]=true;a.fx.push({c,r,t:0});
            const v=playerVisCell();
            if(v.c===c&&v.r===r){tryHitPlayer(v,1.15);if(battle.phase==='lose')return;}
          }
        }
        if(a.t>=D){a.phase='recover';a.t=0;}
      }else{
        if(recover(QX-30,-2.0,0.4))return;
      }
      break;}
    case 'rain':{
      const st=a.stages[a.si];
      if(a.phase==='charge'){
        const rs=a.si===0?estep:Math.min(1,a.t/0.2);
        p.x=(a.si===0?lerp(HX,STX,estep):STX)+Math.sin(a.t*60)*1.5;
        p.sword=lerp(a.si===0?0.9:-1.4,2.6,rs);p.sy=1.02;
        if(a.t>=st.fuse){
          a.phase='erupt';a.t=0;battle.shake=Math.max(battle.shake,12);
          for(const cell of st.cells)addDust(dCellCX(cell.c),dCellCY(cell.r),8,30,'#e0a5ff');
          const v=playerVisCell();
          if(cellsHas(st.cells,v.c,v.r)){tryHitPlayer(v,1.0);if(battle.phase==='lose')return;}
        }
      }else if(a.phase==='erupt'){
        p.x=STX;p.sword=-1.4;
        if(a.t>=0.3){a.si++;if(a.si<a.stages.length){a.phase='charge';a.t=0;}else{a.phase='recover';a.t=0;}}
      }else{
        if(recover(STX,-1.4,0.35))return;
      }
      break;}
    case 'safe':{
      if(a.phase==='charge'){
        p.x=lerp(HX,STX,estep)+Math.sin(a.t*80)*(1+a.t*2);p.sword=lerp(0.9,2.6,estep);p.sy=1+0.03*Math.sin(a.t*30);
        if(a.t>=a.fuse){
          a.phase='erupt';a.t=0;battle.shake=Math.max(battle.shake,20);
          for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++){
            if(c===a.safe.c&&r===a.safe.r)continue;
            addDust(dCellCX(c),dCellCY(r),6,30,'#ff9a6a');a.fx.push({c,r,t:0});
          }
          const v=playerVisCell();
          if(!(v.c===a.safe.c&&v.r===a.safe.r)){tryHitPlayer(v,1.5);if(battle.phase==='lose')return;}
        }
      }else if(a.phase==='erupt'){
        p.x=STX;p.sword=-1.4;
        if(a.t>=0.4){a.phase='recover';a.t=0;}
      }else{
        if(recover(STX,-1.4,0.4))return;
      }
      break;}
  }
  battle.enemyPose=p;
}
function bossCircle(x,y,TW,TH,k){   // 魔法陣
  ctx.save();
  ctx.strokeStyle='rgba(240,210,255,0.9)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x+TW/2,y+TH/2,TW*0.36,TH*0.36,0,0,7);ctx.stroke();
  ctx.fillStyle='#f4dcff';
  for(let i=0;i<6;i++){
    const an=battle.enemyAnim*3+i*Math.PI/3;
    ctx.fillRect(x+TW/2+Math.cos(an)*TW*0.36-2,y+TH/2+Math.sin(an)*TH*0.36-2,4,4);
  }
  ctx.restore();
}
function drawBossFx(tileX,tileY,TW,TH){
  for(const a of battle.attacks){
    if(a.kind!=='boss')continue;
    const pulse=0.5+0.5*Math.sin(a.seed+battle.enemyAnim*16);
    const pose=battle.enemyPose;
    const bang=()=>{if(pose)uText('！！',pose.x/U,(pose.y-100)/U,16,'#ffe14d','center','#a00000');};
    if(a.mode==='quake'){
      if(a.phase==='raise'||a.phase==='hold'){
        for(const r of a.rows)for(let c=0;c<DGRID_COLS;c++)warnCell(tileX(c),tileY(r),TW,TH,pulse,true);
        bang();
      }
      if(a.phase==='wave'){   // 衝撃波
        for(const r of a.rows){
          const cy=dCellCY(r);
          ctx.fillStyle='rgba(190,100,255,0.5)';ctx.fillRect(a.front,cy-26,120,52);
          ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(a.front-3,cy-32,6,64);
          ctx.fillStyle='rgba(240,200,255,0.8)';ctx.fillRect(a.front+6,cy-20,30,40);
        }
      }
      for(const f of a.fx){
        const k=f.t/0.45;
        ctx.fillStyle='rgba(255,255,255,'+(0.55*(1-k))+')';ctx.fillRect(tileX(f.c),tileY(f.r),TW,TH);
      }
    }else if(a.mode==='rain'){
      const st=a.stages[Math.min(a.si,a.stages.length-1)];
      if(a.phase==='charge'){
        for(const cell of st.cells){
          warnCell(tileX(cell.c),tileY(cell.r),TW,TH,pulse,false,WARN_WAVE);
          bossCircle(tileX(cell.c),tileY(cell.r),TW,TH);
        }
        if(a.si===0)bang();
      }else if(a.phase==='erupt'){
        const k=a.t/0.3;
        for(const cell of st.cells){
          const x=tileX(cell.c),y=tileY(cell.r),cx=x+TW/2,by=y+TH-6;
          const h=(TH+70)*Math.min(1,k*4+0.3);
          ctx.globalAlpha=Math.max(0,1-k);
          ctx.fillStyle='rgba(150,60,220,0.85)';ctx.fillRect(cx-TW*0.32,by-h,TW*0.64,h);
          ctx.fillStyle='#f4dcff';ctx.fillRect(cx-TW*0.14,by-h,TW*0.28,h);
          ctx.globalAlpha=1;
          ctx.fillStyle='rgba(255,255,255,'+Math.max(0,0.5-k)+')';ctx.fillRect(x,y,TW,TH);
        }
      }
    }else if(a.mode==='safe'){
      if(a.phase==='charge'){
        for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++){
          const x=tileX(c),y=tileY(r);
          if(c===a.safe.c&&r===a.safe.r){
            ctx.fillStyle='rgba(80,220,255,'+(0.16+0.14*pulse)+')';ctx.fillRect(x,y,TW,TH);
            uBox(x/U-1,y/U-1,TW/U+2,TH/U+2,'#7fe4ff');uBox(x/U+2,y/U+2,TW/U-4,TH/U-4,'#bff4ff');
            uText('SAFE',x/U+TW/U/2,y/U+TH/U/2-5,10,'#bff4ff','center','#063a4a');
          }else warnCell(x,y,TW,TH,pulse,true);
        }
        bang();
      }
      for(const f of a.fx){
        const k=f.t/0.45,x=tileX(f.c),y=tileY(f.r);
        ctx.fillStyle='rgba(255,180,90,'+(0.6*(1-k))+')';ctx.fillRect(x,y,TW,TH);
        ctx.globalAlpha=1-k;
        const rr=Math.round(8+k*30),cx=(x+TW/2)/U,cy=(y+TH/2)/U;
        uBox(cx-rr,cy-Math.round(rr*0.6),rr*2,Math.round(rr*1.2),'#ffe066');
        ctx.globalAlpha=1;
      }
    }
  }
}

/* ========== 個別攻撃⑦：中ボス「クマティア」（10F確定／10秒） ==========
   行動はランダム：
   ①つらら　　　… ランダムなマスの上から氷柱が どんどん降ってくる（かげ→落下）
   ②氷剣の衝撃波 … 氷の剣を床にさす → 直前まで分からないまま、2列を左右から交差して衝撃波が走る */
const WARN_ICE={f:'110,200,255',b:'#7fe4ff',b2:'#e4faff',t:'#05445e'};
const KUMA_ICI={cast:0.5,warn:0.8,fall:0.2,brk:0.28,rec:0.35,maxAct:3,mul:1.0};   // つらら：ため／かげ／落下／くだける／もどり／同時に出せる数
const KUMA_SW={raise:0.55,stab:0.18,hold:0.5,warn:0.5,wave:0.36,rec:0.32,x:620,mul:1.3,waveP:0.72};   // 氷剣：かまえ／さす／ためる／警告(直前)／衝撃波／もどり
const KUMA_RET={p:0.5,minR:5.2,wait:2.2,warn:0.45,run:0.75,v:2220};   // 氷剣の衝撃波が画面外へ抜けて もどってくる：確率／出す最低の残り時間／もどるまで／警告／走る時間／速さ(px/秒)
const KUMA_FLOOR_Y=D_ENEMY_Y+64;   // 剣がささる床の高さ
function kumaGap(k){return Math.max(0.26,0.62-0.05*k);}   // つららの間隔（どんどん短くなる）
function spawnKumaIcicle(R){
  const C=KUMA_ICI;
  const total=n=>{let t=0;for(let k=1;k<n;k++)t+=kumaGap(k);return C.cast+t+C.warn+C.fall+C.brk+C.rec+0.3;};
  let N=8;
  while(N>=4&&total(N)>R)N--;
  if(N<4){   // 残り時間がすくなくても止まらない：入る分だけ氷柱の数をへらして、最後まで出しつづける
    N=3;
    while(N>=1&&total(N)>R+0.35)N--;   // もどり(rec)の分は 回避フェーズが終わってもよいので すこし余裕をみる
    if(N<1){if(R<1.2)return false;N=1;}
  }
  battle.attacks.push({kind:'kumatia',mode:'icicle',phase:'cast',t:0,T:0,N,made:0,nextT:0,ici:[],fx:[],seed:Math.random()*6});
  return true;
}
function spawnKumaSword(R){
  const S=KUMA_SW;
  if(R<S.raise+S.stab+S.hold+S.warn+S.wave+S.rec+0.15)return false;
  // 衝撃波が走る2列（上の2列 or 下の2列）。ひとつは右→左、もうひとつは左→右で交差する
  const rows=Math.random()<0.5?[0,1]:[1,2];
  const d0=Math.random()<0.5?-1:1;
  const waves=[{r:rows[0],dir:d0,front:0},{r:rows[1],dir:-d0,front:0}];
  const pass=Math.random()<KUMA_RET.p&&R>=KUMA_RET.minR;   // 25%：マスを通りぬけて画面の外へ → しばらくして もどってくる
  battle.attacks.push({kind:'kumatia',mode:'sword',pass,phase:'raise',t:0,T:0,waves,hold:S.hold*(0.6+Math.random()*0.4),hit:{},fx:[],seed:Math.random()*6});   // hold：ためる時間もすこしずらす
  return true;
}
function spawnKumaAct(R){   // 回避フェーズごとに「つらら」か「氷剣の衝撃波」をランダムで1つ決め、そのフェーズはずっと同じ技
  const m=battle.kumaMode||(battle.kumaMode=Math.random()<0.5?'icicle':'sword');
  if(m==='icicle')spawnKumaIcicle(R);else spawnKumaSword(R);
}
const KUMA_SW_GAP={base:0.38,shiftP:0.4,min:0.1,max:1.0};   // 氷剣をつづけるときの間隔：ふつう／ずらす確率／ずらしたときの範囲(秒)
function kumaSwordGap(){const G2=KUMA_SW_GAP;return Math.random()<G2.shiftP?G2.min+Math.random()*(G2.max-G2.min):G2.base;}
function kumaWaveHit(a,mul){   // 衝撃波の先頭が マスの中心を通ったら そのマスを判定
  for(const w of a.waves){
    for(let c=0;c<DGRID_COLS;c++){
      const key=c+','+w.r,cx=dCellCX(c);
      const reached=w.dir<0?(w.front<=cx+30):(w.front>=cx-30);
      if(!a.hit[key]&&reached){
        a.hit[key]=true;a.fx.push({c,r:w.r,t:0});
        const v=playerVisCell();
        if(v.c===c&&v.r===w.r){tryHitPlayer(v,mul);if(battle.phase==='lose')return;}
      }
    }
  }
}
function updateKumaAtk(a,dt){
  a.t+=dt;a.T+=dt;
  for(const f of a.fx)f.t+=dt;
  a.fx=a.fx.filter(f=>f.t<0.45);
  if(a.mode==='echo'){   // もどってくる衝撃波：クマティア本体の行動とは別に動く（攻撃は止まらない）
    const E=KUMA_RET;
    if(a.phase==='wait'){if(a.t>=E.wait){a.phase='warn';a.t=0;}}
    else if(a.phase==='warn'){if(a.t>=E.warn){a.phase='run';a.t=0;battle.shake=Math.max(battle.shake,10);}}
    else{
      for(const w of a.waves)w.front=w.dir<0?1100-E.v*a.t:-140+E.v*a.t;
      kumaWaveHit(a,KUMA_SW.mul);
      if(battle.phase==='lose')return;
      if(a.t>=E.run)a.dead=true;
    }
    return;
  }
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const p={x:HX,y:HY,s:MID_S,sx:1,sy:1};
  const done=()=>{a.dead=true;battle.spawnT=(a.mode==='sword')?kumaSwordGap():0.5;};
  if(a.mode==='icicle'){
    const C=KUMA_ICI;
    if(a.phase==='cast'){
      p.y=HY-7*Math.sin(Math.min(1,a.t/C.cast)*Math.PI);p.sy=1+0.03*Math.sin(a.t*30);
      if(a.t>=C.cast){a.phase='rain';a.t=0;a.nextT=0;}
    }else if(a.phase==='rain'){
      p.y=HY-4;p.sy=1+0.02*Math.sin(a.t*24);
      const live=q=>q.st==='warn'||q.st==='fall';
      if(a.made<a.N&&a.t>=a.nextT&&a.ici.filter(live).length<C.maxAct){
        const free=[];
        for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)if(!a.ici.some(q=>live(q)&&q.c===c&&q.r===r))free.push({c,r});
        const v=playerVisCell();
        const cell=(Math.random()<0.45&&cellsHas(free,v.c,v.r))?{c:v.c,r:v.r}:free[(Math.random()*free.length)|0];   // ときどき プレイヤーの真上をねらう
        a.ici.push({c:cell.c,r:cell.r,st:'warn',t:0});
        a.made++;a.nextT=a.t+kumaGap(a.made);
      }
      for(const q of a.ici){
        q.t+=dt;
        if(q.st==='warn'&&q.t>=C.warn){q.st='fall';q.t=0;}
        else if(q.st==='fall'&&q.t>=C.fall){
          q.st='brk';q.t=0;
          battle.shake=Math.max(battle.shake,6);
          addDust(dCellCX(q.c),dCellCY(q.r),7,26,'#bff4ff');
          const v=playerVisCell();
          if(v.c===q.c&&v.r===q.r){tryHitPlayer(v,C.mul);if(battle.phase==='lose')return;}
        }else if(q.st==='brk'&&q.t>=C.brk)q.st='done';
      }
      a.ici=a.ici.filter(q=>q.st!=='done');
      if(a.made>=a.N&&!a.ici.length){a.phase='rec';a.t=0;}
    }else{
      if(a.t>=C.rec){done();return;}
    }
  }else{
    const S=KUMA_SW;
    if(a.phase==='raise'){
      p.y=HY-8;p.sy=1.03;
      if(a.t>=S.raise){a.phase='stab';a.t=0;}
    }else if(a.phase==='stab'){
      p.y=HY+4;p.sy=0.96;
      if(a.t>=S.stab){
        a.phase='hold';a.t=0;battle.shake=Math.max(battle.shake,14);
        addDust(S.x,KUMA_FLOOR_Y,10,30,'#bff4ff');
      }
    }else if(a.phase==='hold'){   // ここでは どの列か分からない
      p.y=HY+6;p.sy=0.95;p.x=HX+Math.sin(a.t*60)*1.5;
      if(a.t>=a.hold){a.phase='warn';a.t=0;}
    }else if(a.phase==='warn'){   // 直前になって ようやく列が光る
      p.y=HY+6;p.sy=0.95;p.x=HX+Math.sin(a.t*70)*2;
      if(a.t>=S.warn){
        a.phase='wave';a.t=0;battle.shake=Math.max(battle.shake,16);
        if(a.pass)battle.attacks.push({kind:'kumatia',mode:'echo',passive:true,phase:'wait',t:0,T:0,
          waves:a.waves.map(w=>({r:w.r,dir:-w.dir,front:0})),hit:{},fx:[],seed:a.seed});
      }
    }else if(a.phase==='wave'){
      p.y=HY+2;p.sx=1.06;p.sy=0.94;
      const k=Math.min(1,a.t/S.wave);
      for(const w of a.waves){
        if(a.pass)w.front=w.dir<0?720-KUMA_RET.v*a.t:-120+KUMA_RET.v*a.t;   // 画面の外まで走りぬける
        else w.front=w.dir<0?lerp(720,100,k):lerp(-120,500,k);   // 右→左 と 左→右 が まん中で交差する
      }
      kumaWaveHit(a,S.mul);
      if(battle.phase==='lose')return;
      if(a.t>=(a.pass?S.waveP:S.wave)){a.phase='rec';a.t=0;addDust(S.x,KUMA_FLOOR_Y-20,12,30,'#e4faff');}
    }else{
      p.y=HY+2;
      if(a.t>=S.rec){done();return;}
    }
  }
  battle.enemyPose=p;
}
/* ---- クマティアの描画（つらら／氷の剣／衝撃波） ---- */
function drawIcicleShape(cx,tipY){   // 下向きの氷柱（先が下）
  const X=Math.round(cx/U),Y=Math.round(tipY/U),L=34;
  ctx.globalAlpha=0.35;uR(X-1,Y-L-14,2,14,'#e4faff');ctx.globalAlpha=1;   // 落ちる線
  for(let i=0;i<L;i++){
    const w=i<3?1:i<7?3:i<13?5:i<22?7:9,h=w>>1;
    uR(X-h,Y-i,w,1,'#9fe0ff');
    if(w>1){uR(X+h,Y-i,1,1,'#4aa8e0');uR(X-h+1,Y-i,1,1,'#e4faff');}
  }
}
function drawIceSword(cx,tipY,alpha,stuck){   // 氷の剣（先が下）
  const X=Math.round(cx/U),Y=Math.round(tipY/U);
  ctx.save();ctx.globalAlpha=alpha;
  for(let i=0;i<30;i++){
    const w=i<2?1:i<4?3:i<6?5:7,h=w>>1;
    uR(X-h,Y-i,w,1,'#9fe0ff');
    if(i>=2)uR(X,Y-i,1,1,'#e8fbff');
    if(w>1)uR(X+h,Y-i,1,1,'#4aa8e0');
  }
  uR(X-8,Y-33,17,3,'#5fb4ea');uR(X-8,Y-33,17,1,'#bff4ff');   // つば
  uR(X-1,Y-41,3,8,'#2b6fa8');uR(X-2,Y-44,5,3,'#bff4ff');     // つか・かしら
  if(stuck){   // ささった根もとの氷
    uR(X-7,Y-1,15,2,'#cfefff');
    uR(X-6,Y-4,2,3,'#bff4ff');uR(X+5,Y-4,2,3,'#bff4ff');uR(X-3,Y-6,2,5,'#e8fbff');uR(X+2,Y-5,2,4,'#e8fbff');
  }
  ctx.restore();
}
function drawIceCracks(cx,cy,k){   // 床にひろがる氷のひび（左右対称なので 列のヒントにはならない）
  const X=Math.round(cx/U),Y=Math.round(cy/U),L=Math.round(34*k);
  const dirs=[[1,0.25],[-1,0.25],[1,-0.2],[-1,-0.2],[0.6,0.7],[-0.6,0.7]];
  ctx.globalAlpha=0.85;
  for(const d of dirs)for(let s=3;s<L;s++){if(s&1)continue;uR(Math.round(X+d[0]*s),Math.round(Y+d[1]*s),2,1,'#e4faff');}
  ctx.globalAlpha=1;
}
function drawIceWave(x,cy,dir){
  const g=ctx.createLinearGradient(x,0,x-dir*150,0);
  g.addColorStop(0,'rgba(150,225,255,0.7)');g.addColorStop(1,'rgba(150,225,255,0)');
  ctx.fillStyle=g;ctx.fillRect(Math.round(Math.min(x,x-dir*150)),cy-28,150,56);
  for(let j=-3;j<=3;j++){
    const h=24-Math.abs(j)*4,y=cy+j*8;
    ctx.fillStyle=(j&1)?'#bff4ff':'#ffffff';
    ctx.beginPath();ctx.moveTo(Math.round(x-dir*10),y-7);ctx.lineTo(Math.round(x+dir*h),y);ctx.lineTo(Math.round(x-dir*10),y+7);ctx.closePath();ctx.fill();
  }
}
function drawKumaFx(tileX,tileY,TW,TH){
  for(const a of battle.attacks){
    if(a.kind!=='kumatia')continue;
    const pulse=0.5+0.5*Math.sin(a.seed+battle.enemyAnim*16);
    const pose=battle.enemyPose;
    const bang=()=>{if(pose)uText('！！',pose.x/U,(pose.y-95)/U,16,'#bff4ff','center','#05445e');};
    if(a.mode==='icicle'){
      if(a.phase==='cast'){
        bang();
        for(let i=0;i<6;i++){   // 氷のつぶが 上にあつまる
          const ph=(a.t*1.6+i/6)%1;
          uR(Math.round((D_ENEMY_X+Math.sin(i*2.1+a.t*3)*46)/U),Math.round((D_ENEMY_Y-20-ph*50)/U),2,2,i&1?'#e4faff':'#9fe0ff');
        }
      }
      for(const q of a.ici){
        const x=tileX(q.c),y=tileY(q.r),cx=dCellCX(q.c),cy=dCellCY(q.r);
        if(q.st==='warn'){
          const k=q.t/KUMA_ICI.warn;
          warnCell(x,y,TW,TH,pulse,false,WARN_ICE);
          ctx.fillStyle='rgba(10,40,90,0.35)';ctx.beginPath();ctx.ellipse(cx,cy+10,8+24*k,4+10*k,0,0,7);ctx.fill();   // かげがだんだん大きく
        }else if(q.st==='fall'){
          const e=q.t/KUMA_ICI.fall;
          ctx.fillStyle='rgba(110,200,255,0.3)';ctx.fillRect(x,y,TW,TH);
          drawIcicleShape(cx,lerp(-40,cy+12,e*0.3+e*e*0.7));
        }else if(q.st==='brk'){
          const k=q.t/KUMA_ICI.brk;
          ctx.fillStyle='rgba(220,248,255,'+(0.5*(1-k))+')';ctx.fillRect(x,y,TW,TH);
          ctx.globalAlpha=1-k;
          for(let i=0;i<8;i++){
            const ang=i*Math.PI/4+a.seed;
            uR(Math.round(cx/U+Math.cos(ang)*k*22),Math.round(cy/U+Math.sin(ang)*k*13),3,3,i&1?'#bff4ff':'#fff');
          }
          ctx.globalAlpha=1;
        }
      }
    }else if(a.mode==='echo'){
      if(a.phase==='warn')for(const w of a.waves)for(let c=0;c<DGRID_COLS;c++)warnCell(tileX(c),tileY(w.r),TW,TH,pulse,w.dir<0?'←':'→',WARN_ICE);
      if(a.phase==='run')for(const w of a.waves)drawIceWave(Math.round(w.front),dCellCY(w.r),w.dir);
      for(const f of a.fx){
        const k=f.t/0.45;
        ctx.fillStyle='rgba(200,240,255,'+(0.55*(1-k))+')';ctx.fillRect(tileX(f.c),tileY(f.r),TW,TH);
      }
    }else{
      const S=KUMA_SW,FY=KUMA_FLOOR_Y;
      if(a.phase==='raise'){
        drawIceSword(S.x,FY-70-30*clamp(a.t/S.raise,0,1),Math.min(1,a.t/0.2),false);
        if(a.t<0.4)bang();
      }else if(a.phase==='stab'){
        const e=clamp(a.t/S.stab,0,1);
        drawIceSword(S.x,lerp(FY-100,FY,e*e),1,false);
      }else{
        const k=a.phase==='hold'?clamp(a.t/a.hold,0,1):1;
        drawIceCracks(S.x,FY,k);
        drawIceSword(S.x,FY,a.phase==='rec'?1-clamp(a.t/S.rec,0,1):1,true);
      }
      if(a.phase==='warn'){   // 直前：2列が光り、矢印で走る向きを見せる
        for(const w of a.waves)for(let c=0;c<DGRID_COLS;c++)warnCell(tileX(c),tileY(w.r),TW,TH,pulse,w.dir<0?'←':'→',WARN_ICE);
        bang();
      }
      if(a.phase==='wave')for(const w of a.waves)drawIceWave(Math.round(w.front),dCellCY(w.r),w.dir);
      for(const f of a.fx){
        const k=f.t/0.45;
        ctx.fillStyle='rgba(200,240,255,'+(0.55*(1-k))+')';ctx.fillRect(tileX(f.c),tileY(f.r),TW,TH);
      }
    }
  }
}

/* ========== 個別攻撃：クビ・ガリ（隠しボス風） ==========
   回避フェーズ（12秒）のあいだ、4つの技から 毎回ランダムに（同じ技が続いてもよい）選んで 出しつづける。
   dive ：空を飛ぶ → 0.8〜1.2秒あとに 上から下へ急降下（！なし）
   claw ：黒い腕で 縦3マスを3回ひっかき（左右どちらの列かは そのつどランダム）
   beam ：光をためて 縦2×横2マスにビーム（！なし）→ すぐ そこから外れた 別の縦2×横2にも
   sword：金の剣を4マスに（！なし。光でうまれて すぐ落ちる。プレイヤーのいるマスは かならず1つ入る） */
const KB_MUL={dive:1.6,claw:1.0,beam:1.6,sword:1.3};   // 技ごとのダメージ倍率
const KB_DIVE_CX=(dCellCX(0)+dCellCX(1))/2,KB_DIVE_S=2.9;   // 急降下：2列のまんなか／空にいるときの大きさ
const KB_TOP=104;                                       // 空を飛ぶときの高さ(y)
const KB_NEED={dive:2.9,claw:3.0,beam:3.0,sword:1.8};   // この秒数が のこっていないと その技は出さない
const KB_WARN={f:'120,40,170',b:'#a860e0',b2:'#e8d0ff',t:'#25003a'};
const KB_BEAMP={f:'255,226,110',b:'#ffe27a',b2:'#fffbe0',t:'#6a4a00'};
const KB_SW_HOVER=0.55,KB_SW_FALL=0.13,KB_SW_STAG=0.1;   // 剣：光でうまれて止まる時間／落ちる時間／1本ごとのずれ
function kbEnd(a){a.dead=true;battle.spawnT=0.35+Math.random()*0.4;}
function spawnKubiAct(R){
  const ok=Object.keys(KB_NEED).filter(m=>R>=KB_NEED[m]);
  if(!ok.length)return;
  const mode=ok[(Math.random()*ok.length)|0],base={kind:'kubigari',mode,t:0,seed:Math.random()*6};   // kind は SPECIAL_ATK の名前とそろえる
  if(mode==='dive'){
    battle.attacks.push(Object.assign(base,{phase:'up',hover:0.8+Math.random()*0.4,hx:D_ENEMY_X,y:D_ENEMY_Y,r0:0,locked:false,hit:false,landed:false}));
  }else if(mode==='claw'){
    const cols=[0,1,2].map(()=>(Math.random()<0.5?0:1));
    battle.attacks.push(Object.assign(base,{phase:'warn',i:0,cols,dur:0.7}));
  }else if(mode==='beam'){
    const r0=(Math.random()<0.5)?0:1;
    battle.attacks.push(Object.assign(base,{phase:'charge',n:0,rows:[r0,1-r0],durs:[1.15,0.5]}));   // 2発目は 1発目から外れた方（すぐ）
  }else{
    const v=playerVisCell(),cells=[{c:v.c,r:v.r}],pool=[];
    for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)if(!(c===v.c&&r===v.r))pool.push({c,r});
    pool.sort(()=>Math.random()-0.5);
    while(cells.length<4)cells.push(pool.shift());
    cells.sort(()=>Math.random()-0.5);
    battle.attacks.push(Object.assign(base,{cells,done:cells.map(()=>false)}));
  }
}
function updateKubiAtk(a,dt){
  a.t+=dt;
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  const p={x:HX,y:HY,s:2.1,sx:1,sy:1,lift:0,hidden:false,trail:null,front:false};
  if(a.mode==='dive'){
    switch(a.phase){
      case 'up':{   // 飛びあがって プレイヤーの上へ
        const tt=Math.min(1,a.t/0.4),e=1-(1-tt)*(1-tt),tx=KB_DIVE_CX;   // 2×2 なので 2列のまんなかへ
        a.hx=lerp(HX,tx,e);a.y=lerp(HY,KB_TOP,e)-Math.sin(tt*Math.PI)*26;
        p.x=a.hx;p.y=a.y;p.sy=1+0.06*Math.sin(tt*Math.PI);
        if(a.t>=0.4){a.phase='hover';a.t=0;}
        break;}
      case 'hover':{   // 0.8〜1.2秒：さいしょは プレイヤーの列を追い、さいごの少しは その列で止まって ふるえる
        const lockAt=a.hover-Math.min(0.4,a.hover*0.5);
        if(!a.locked&&a.t>=lockAt){   // 縦2マスを決める：主人公のいる行をふくむ組（上2段 or 下2段）。まんなか段なら どちらかランダム
          a.locked=true;const vr=playerVisCell().r;
          a.r0=(vr===0)?0:(vr===2)?1:(Math.random()<0.5?0:1);
        }
        a.hx+=(KB_DIVE_CX-a.hx)*Math.min(1,dt*(a.locked?24:9));
        a.y=KB_TOP+Math.sin(a.t*8)*(a.locked?1:5);
        p.x=a.hx+(a.locked?Math.sin(a.t*70)*2.5:0);p.y=a.y;p.s=KB_DIVE_S;
        if(a.t>=a.hover){a.phase='dive';a.t=0;a.hx=KB_DIVE_CX;a.y=KB_TOP;}
        break;}
      case 'dive':{   // 上から下へ 急降下
        const D=0.26,tt=Math.min(1,a.t/D),e=tt*tt,py=a.y,landY=dCellCY(a.r0+1)+10;   // 2×2 の下はしで 着地
        a.y=lerp(KB_TOP,landY,e);
        p.x=a.hx;p.y=a.y;p.s=KB_DIVE_S;p.sx=0.9;p.sy=1.3;p.front=true;
        p.trail=[0.06,0.12,0.18].map(d=>[a.hx,lerp(KB_TOP,landY,Math.max(0,e-d))]);
        if(!a.hit){   // 2列ぜんぶ × 縦2マス が あたり判定
          const v=playerVisCell();
          if(v.r===a.r0||v.r===a.r0+1){
            const cy=dCellCY(v.r),lo=Math.min(py,a.y),hi=Math.max(py,a.y);
            if(hi>=cy-20&&lo<=cy+20){a.hit=true;tryHitPlayer(v,KB_MUL.dive);if(battle.phase==='lose')return;}
          }
        }
        if(a.t>=D){
          a.y=landY;a.landed=true;battle.shake=Math.max(battle.shake,10);
          addDust(dCellCX(0),landY+16,8,34,'#d8c8e8');addDust(dCellCX(1),landY+16,8,34,'#d8c8e8');
          a.phase='land';a.t=0;
        }
        break;}
      case 'land':{   // 着地してちょっと止まる
        p.x=a.hx;p.y=a.y;p.s=KB_DIVE_S;p.front=true;
        if(a.t>=0.18){a.phase='gone';a.t=0;}
        break;}
      case 'gone':
        p.hidden=true;
        if(a.t>=0.25){a.phase='ret';a.t=0;}
        break;
      case 'ret':{   // 右から もどってくる
        const tt=Math.min(1,a.t/0.35),e=1-(1-tt)*(1-tt);
        p.x=lerp(W+50,HX,e);p.y=HY;
        if(a.t>=0.35){kbEnd(a);return;}
        break;}
    }
  }else if(a.mode==='claw'){
    const col=a.cols[a.i];
    if(a.phase==='warn'){
      p.x=HX+Math.sin(a.t*38)*1.6;p.y=HY+Math.sin(a.t*22)*2;
      if(a.t>=a.dur){
        a.phase='slash';a.t=0;battle.shake=Math.max(battle.shake,5);
        const v=playerVisCell();
        if(v.c===col){tryHitPlayer(v,KB_MUL.claw);if(battle.phase==='lose')return;}
      }
    }else if(a.phase==='slash'){
      const k=Math.min(1,a.t/0.2);
      p.x=HX-16*Math.sin(k*Math.PI);p.sx=1+0.1*Math.sin(k*Math.PI);
      if(a.t>=0.2){a.phase='gap';a.t=0;}
    }else if(a.t>=0.12){
      a.i++;
      if(a.i>=a.cols.length){kbEnd(a);return;}
      a.phase='warn';a.t=0;a.dur=0.5;
    }
  }else if(a.mode==='beam'){
    const r0=a.rows[a.n];
    if(a.phase==='charge'){
      const D=a.durs[a.n],k=Math.min(1,a.t/D);
      p.x=HX+Math.sin(a.t*(30+k*30))*(1+k*2);p.y=HY+Math.sin(a.t*18)*2;p.sx=1-0.04*k;p.sy=1+0.05*k;
      if(a.t>=D){
        a.phase='fire';a.t=0;battle.shake=Math.max(battle.shake,10);
        const v=playerVisCell();
        if(v.r===r0||v.r===r0+1){tryHitPlayer(v,KB_MUL.beam);if(battle.phase==='lose')return;}
      }
    }else if(a.phase==='fire'){
      const k=Math.min(1,a.t/0.35);
      p.x=HX+6*(1-k);p.sx=1.06-0.06*k;
      if(a.t>=0.35){
        if(a.n===0){a.n=1;a.phase='charge';a.t=0;}   // すぐ 2発目へ
        else{a.phase='end';a.t=0;}
      }
    }else if(a.t>=0.25){kbEnd(a);return;}
  }else{   // sword
    p.x=HX+Math.sin(a.t*40)*1.2;p.y=HY-4+Math.sin(a.t*12)*3;
    let end=0;
    a.cells.forEach((q,i)=>{
      const tf=i*KB_SW_STAG+KB_SW_HOVER+KB_SW_FALL;end=Math.max(end,tf);
      if(!a.done[i]&&a.t>=tf){
        a.done[i]=true;addDust(dCellCX(q.c),dCellCY(q.r)+8,6,28,'#ffe27a');
        const v=playerVisCell();
        if(v.c===q.c&&v.r===q.r){tryHitPlayer(v,KB_MUL.sword);if(battle.phase==='lose')return;}
      }
    });
    if(a.t>=end+0.3){kbEnd(a);return;}
  }
  battle.enemyPose=p;
}
function kbArm(x0,y0,x1,y1){   // 黒い腕
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo((x0+x1)/2,Math.min(y0,y1)-40,x1,y1);
  ctx.strokeStyle='#8a50c8';ctx.lineWidth=17;ctx.stroke();
  ctx.strokeStyle='#08040c';ctx.lineWidth=13;ctx.stroke();
  ctx.fillStyle='#08040c';ctx.beginPath();ctx.arc(x1,y1,12,0,7);ctx.fill();
  ctx.strokeStyle='#f0e8ff';ctx.lineWidth=2.5;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x1+i*7-2,y1+8);ctx.lineTo(x1+i*7+2,y1+22);ctx.stroke();}
  ctx.restore();
}
function kbSword(x,y,s,al){   // 金の剣（さきが下）
  ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#7a4a10';ctx.fillRect(-3,-48,6,18);
  ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,-50,5,0,7);ctx.fill();
  ctx.fillStyle='#c8941a';ctx.fillRect(-14,-32,28,6);ctx.fillStyle='#ffe27a';ctx.fillRect(-14,-32,28,2);
  ctx.fillStyle='#a06a00';ctx.beginPath();ctx.moveTo(-7,-26);ctx.lineTo(7,-26);ctx.lineTo(7,12);ctx.lineTo(0,26);ctx.lineTo(-7,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.moveTo(-5,-25);ctx.lineTo(5,-25);ctx.lineTo(5,11);ctx.lineTo(0,22);ctx.lineTo(-5,11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fffbe0';ctx.fillRect(-1.5,-24,3,34);
  ctx.restore();
}
function drawKubiFx(a,tileX,tileY,TW,TH,pulse){
  const HX=D_ENEMY_X,HY=D_ENEMY_Y;
  if(a.mode==='claw'){
    const col=a.cols[a.i],x=tileX(col),cx=dCellCX(col),top=tileY(0),bot=tileY(2)+TH;
    if(a.phase==='warn'){
      for(let r=0;r<3;r++)warnCell(x,tileY(r),TW,TH,pulse,true,KB_WARN);
      const k=Math.min(1,a.t/a.dur),e=1-(1-k)*(1-k);
      kbArm(HX-34,HY+4,lerp(HX-34,cx,e),lerp(HY+4,top-14,e));
    }else{
      const sl=a.phase==='slash',k=sl?Math.min(1,a.t/0.2):1,al=sl?1:1-Math.min(1,a.t/0.12);
      const hy=lerp(top-14,bot-8,k*k*0.4+k*0.6);
      ctx.fillStyle='rgba(150,70,220,'+(0.4*al*(sl?1-k:1))+')';for(let r=0;r<3;r++)ctx.fillRect(x,tileY(r),TW,TH);
      ctx.save();ctx.lineCap='round';
      for(let i=-1;i<=1;i++){
        ctx.beginPath();ctx.moveTo(cx+i*20-9,top-6);ctx.lineTo(cx+i*20+9,hy);
        ctx.globalAlpha=0.55*al;ctx.strokeStyle='#8a50c8';ctx.lineWidth=8;ctx.stroke();
        ctx.globalAlpha=al;ctx.strokeStyle='#f4ecff';ctx.lineWidth=3;ctx.stroke();
      }
      ctx.restore();
      if(sl)kbArm(HX-34,HY+4,cx,hy);
    }
  }else if(a.mode==='beam'){
    const r0=a.rows[a.n],y0=tileY(r0),y1=tileY(r0+1)+TH,gx0=tileX(0)-8,gx1=tileX(1)+TW+4;
    const ox=HX-44,oy=HY-8;
    if(a.phase==='charge'){
      const k=Math.min(1,a.t/a.durs[a.n]);
      for(let r=r0;r<=r0+1;r++)for(let c=0;c<DGRID_COLS;c++)warnCell(tileX(c),tileY(r),TW,TH,pulse,false,KB_BEAMP);
      const rad=4+k*24+Math.sin(a.t*30)*1.5;
      const g=ctx.createRadialGradient(ox,oy,1,ox,oy,rad*1.9);
      g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.35,'rgba(255,236,140,0.8)');g.addColorStop(1,'rgba(255,200,60,0)');
      ctx.fillStyle=g;ctx.fillRect(ox-rad*2,oy-rad*2,rad*4,rad*4);
      for(let i=0;i<6;i++){   // あつまる光のつぶ
        const ang=i*1.047+a.t*5,d=(1-((a.t*1.6+i*0.17)%1))*46*(0.4+k);
        uR(Math.round((ox+Math.cos(ang)*d)/U),Math.round((oy+Math.sin(ang)*d)/U),2,2,'#fff6c0');
      }
    }else if(a.phase==='fire'){
      const k=Math.min(1,a.t/0.35),al=1-k*k,cyb=(y0+y1)/2,sh=(y1-y0)/2;
      const poly=(pad,w,col,alpha)=>{
        ctx.globalAlpha=alpha*al;ctx.fillStyle=col;ctx.beginPath();
        ctx.moveTo(ox,oy-w);ctx.lineTo(gx1,cyb-sh-pad);ctx.lineTo(gx0,cyb-sh-pad);ctx.lineTo(gx0,cyb+sh+pad);ctx.lineTo(gx1,cyb+sh+pad);ctx.lineTo(ox,oy+w);ctx.closePath();ctx.fill();
      };
      ctx.save();
      ctx.fillStyle='rgba(255,240,170,'+(0.5*al)+')';
      for(let r=r0;r<=r0+1;r++)for(let c=0;c<DGRID_COLS;c++)ctx.fillRect(tileX(c),tileY(r),TW,TH);
      poly(10,10,'#ffd24a',0.45);poly(0,6,'#fff0a0',0.85);poly(-sh*0.5,3,'#ffffff',0.95);
      ctx.restore();
    }
  }else if(a.mode==='sword'){
    a.cells.forEach((q,i)=>{
      const t=a.t-i*KB_SW_STAG;if(t<0)return;
      const cx=dCellCX(q.c),cy=dCellCY(q.r),hy=tileY(q.r)-22;
      if(t<KB_SW_HOVER){   // 光でうまれる（！はなし）
        const k=Math.min(1,t/0.28);
        const g=ctx.createRadialGradient(cx,hy,1,cx,hy,34);
        g.addColorStop(0,'rgba(255,250,200,'+(0.9*(1-0.4*k))+')');g.addColorStop(1,'rgba(255,215,90,0)');
        ctx.fillStyle=g;ctx.fillRect(cx-36,hy-36,72,72);
        kbSword(cx,hy+Math.sin(t*14)*1.5,0.55+0.2*k,k);
        for(let j=0;j<4;j++){const ang=j*1.57+t*6,d=(1-((t*2+j*0.25)%1))*26;uR(Math.round((cx+Math.cos(ang)*d)/U),Math.round((hy+Math.sin(ang)*d)/U),2,2,'#fff6c0');}
      }else if(t<KB_SW_HOVER+KB_SW_FALL){   // すぐ落ちる
        const k=(t-KB_SW_HOVER)/KB_SW_FALL,y=lerp(hy,cy+6,k*k);
        kbSword(cx,y-16,0.75,0.3);kbSword(cx,y,0.75,1);
      }else{   // ささって きえる
        const k=Math.min(1,(t-KB_SW_HOVER-KB_SW_FALL)/0.25);
        ctx.fillStyle='rgba(255,215,90,'+(0.55*(1-k))+')';ctx.fillRect(tileX(q.c),tileY(q.r),TW,TH);
        kbSword(cx,cy+6,0.75,1-k);
      }
    });
  }
}

/* 個別攻撃の一覧（敵データの pattern と対応） */
const SPECIAL_ATK={
  golem: {spawn:spawnGolemSlam, upd:updateGolemAtk},
  bat:   {spawn:spawnBatDive,   upd:updateBatAtk},
  ghost: {spawn:spawnGhostHaunt,upd:updateGhostAtk},
  knight:{spawn:spawnKnightCombo,upd:updateKnightAtk},
  wizard:{spawn:spawnWizardWave,upd:updateWizardAtk},
  boss:  {spawn:spawnBossAct,   upd:updateBossAtk},
  kumatia:{spawn:spawnKumaAct,  upd:updateKumaAtk},
  bakeboom:{spawn:spawnBakeboom, upd:updateBakeboomAtk},
  kubigari:{spawn:spawnKubiAct, upd:updateKubiAtk},
};

/* ========== スライムLv3〜：スライムマス ==========
   Lv3以上のスライムは、戦闘のはじめに プレイヤーのマス(横2×縦3)のうち1マスを「スライム状態」にする（スライム2匹なら合計2マス）。
   スライムマスに立っているとき、そこから別のマスへ動こうとすると、ゆっくりしか動けない。攻撃の間隔も少しだけ短くなる。 */
const SLIME_LV_MIN=3;            // このレベル以上のスライムが使う
const SLIME_CELLS_EACH=1;        // 1匹あたりのスライムマスの数
const SLIME_MOVE_COOL=0.35;      // スライムマスから出るときの、つぎに動けるまでの時間（ふつうは0.16）
const SLIME_SLOW_TIME=0.6;       // ゆっくり動く時間（秒）
const SLIME_SLOW_K=3.5;          // ゆっくり動くときの速さ（ふつうは20）
const SLIME_ATK_RATE=0.9;        // 攻撃の間隔（1より小さいほど速い）
function isSlimeFoe(f){return !!f&&!f.dead&&!f.isBoss&&!(f.def&&f.def.mid)&&f.def&&f.def.shape==='slime'&&(f.def.lv||1)>=SLIME_LV_MIN;}
function isSlimeCell(c,r){return !!battle.slimeCells&&battle.slimeCells.some(q=>q.c===c&&q.r===r);}
function setupSlimeCells(){
  battle.slimeCells=[];battle.slowT=0;
  const n=aliveFoes().filter(isSlimeFoe).length;
  if(!n)return;
  const pool=[];
  for(let c=0;c<DGRID_COLS;c++)for(let r=0;r<DGRID_ROWS;r++)pool.push({c,r});
  pool.sort(()=>Math.random()-0.5);
  battle.slimeCells=pool.slice(0,Math.min(pool.length,n*SLIME_CELLS_EACH));
}
function slimeAtkRate(){return aliveFoes().some(isSlimeFoe)?SLIME_ATK_RATE:1;}

/* ========== 回避フェーズ ========== */
function startDodge(){
  DODGE_DUR=(battle.enemy&&(battle.enemy.isBoss||battle.enemy.def.kubigari))?12.0:(battle.enemy&&battle.enemy.def.mid)?10.0:8.0;
  battle.bossPhase=bossAwake()?2:1;battle.bossBag=[];battle.bossLast=null;
  if(bossAwake())battle.bossAwoke=true;
  battle.phase='dodge';battle.t=0;battle.dodgeT=0;
  battle.pcol=1;battle.prow=1;
  battle.ppx=dCellCX(1);battle.ppy=dCellCY(1);
  battle.pTargetX=battle.ppx;battle.pTargetY=battle.ppy;
  battle.moveCool=0;
  battle.attacks=[];
  battle.kumaMode=Math.random()<0.5?'icicle':'sword';   // クマティア：この回避フェーズは、つらら か 氷剣 のどちらかだけをずっと使う
  battle.spawnN=1.6*slimeAtkRate();setupSlimeCells();
  { const sp=battle.enemyDef&&battle.enemyDef.pattern;battle.spawnT=(sp&&SPECIAL_ATK[sp])?(sp==='golem'?0.2:0.3):1.6; }
  battle.enemyPose=null;battle.fx=[];
  for(const f of battle.foes)f.pose=null;
  battle.invuln=0;battle.hits=0;
  battle.guardHeld=false;battle.guardStartT=-999;battle.guardReleaseT=-999;
  flushStars();
  battle.parryFlash=0;battle.spPop=null;
}
function pickAttackCells(atkCells,targetBias){
  const total=atkCells;
  const cells=[];
  const used=new Set();
  if(Math.random()<targetBias){
    cells.push({c:battle.pcol,r:battle.prow});
    used.add(battle.pcol+','+battle.prow);
    let guard=0;
    while(cells.length<total&&guard++<20){
      const base=cells[(Math.random()*cells.length)|0];
      const nc=clamp(base.c+((Math.random()<0.5?-1:1)),0,DGRID_COLS-1);
      const nr=clamp(base.r+((Math.random()<0.5?-1:1)),0,2);
      const k=nc+','+nr;
      if(used.has(k))continue;
      used.add(k);cells.push({c:nc,r:nr});
    }
  }else{
    const pool=[];
    for(let r=0;r<DGRID_ROWS;r++)for(let c=0;c<DGRID_COLS;c++)pool.push({c,r});
    pool.sort(()=>Math.random()-0.5);
    for(let i=0;i<Math.min(total,pool.length);i++){
      cells.push(pool[i]);
      used.add(pool[i].c+','+pool[i].r);
    }
  }
  return cells;
}
function spawnAttackWave(n){
  const def=battle.enemyDef;
  const atkCells=def.atkCells||1;
  const targetBias=def.targetBias||0.3;
  const totalCells=Math.min(3,atkCells*n);
  const cells=pickAttackCells(totalCells,targetBias);
  const useFromRight=(Math.random()<0.4);
  const projs=cells.map(cell=>{
    const hm=foeHome(battle.enemy);
    const ox=useFromRight?(W+40):hm.x;
    const oy=useFromRight?dCellCY(cell.r):hm.y-10;
    return {x:ox,y:oy,ox,oy,tx:dCellCX(cell.c),ty:dCellCY(cell.r)};
  });
  battle.attacks.push({
    cells,projs,
    phase:'warn',t:0,
    hitApplied:false,seed:Math.random()*6,
  });
}
function updateDodge(dt){
  battle.dodgeT+=dt;
  battle.moveCool=Math.max(0,battle.moveCool-dt);

  const guardKey=!!(down['KeyX']||down['Space']);
  if((hit['KeyX']||hit['Space'])&&!battle.guardHeld){
    battle.guardHeld=true;battle.guardStartT=battle.dodgeT;
  }
  if(!guardKey&&battle.guardHeld){
    battle.guardHeld=false;battle.guardReleaseT=battle.dodgeT;
  }

  if(!battle.guardHeld&&battle.moveCool<=0){
    let dx=0,dy=0;
    if(down['ArrowLeft']||down['KeyA'])dx=-1;
    else if(down['ArrowRight']||down['KeyD'])dx=1;
    else if(down['ArrowUp']||down['KeyW'])dy=-1;
    else if(down['ArrowDown']||down['KeyS'])dy=1;
    if(dx||dy){
      const nc=clamp(battle.pcol+dx,0,DGRID_COLS-1);
      const nr=clamp(battle.prow+dy,0,DGRID_ROWS-1);
      if(nc!==battle.pcol||nr!==battle.prow){
        const slimy=isSlimeCell(battle.pcol,battle.prow);   // スライムマスから出ようとしている
        battle.pcol=nc;battle.prow=nr;
        battle.pTargetX=dCellCX(nc);battle.pTargetY=dCellCY(nr);
        battle.moveCool=slimy?SLIME_MOVE_COOL:0.16;
        if(slimy)battle.slowT=SLIME_SLOW_TIME;
      }
    }
  }
  if(battle.slowT>0)battle.slowT-=dt;
  const k=Math.min(1,dt*(battle.slowT>0?SLIME_SLOW_K:20));
  battle.ppx=lerp(battle.ppx,battle.pTargetX,k);
  battle.ppy=lerp(battle.ppy,battle.pTargetY,k);

  if(battle.invuln>0)battle.invuln-=dt;

  battle.enemyPose=null;
  if(battle.duo)for(const f of battle.foes)f.pose=null;
  for(const f of battle.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=260*dt;f.life-=dt;}
  battle.fx=battle.fx.filter(f=>f.life>0);

  battle.spawnT-=dt;
  const pat=battle.enemyDef.pattern;
  if(battle.duo){
    // 同時バトル：敵ごとに自分の攻撃パターンを使う（ナイト＋スライムのように、ちがう敵の組み合わせにも対応）
    const al=aliveFoes();
    const sps=al.filter(f=>f.def.pattern&&SPECIAL_ATK[f.def.pattern]);
    const nor=al.filter(f=>!(f.def.pattern&&SPECIAL_ATK[f.def.pattern]));
    if(sps.length){
      // 体はひとつなので、前の技が終わってから次を出す（もどってくる衝撃波(passive)は待たない）
      const busy=battle.attacks.some(a=>a.kind&&!a.passive);
      if(!busy&&battle.spawnT<=0){
        const R=DODGE_DUR-battle.dodgeT;
        for(const f of sps)asFoe(f,()=>SPECIAL_ATK[f.def.pattern].spawn(R));
      }
    }
    if(nor.length){
      battle.spawnN=(battle.spawnN===undefined?1.6:battle.spawnN)-dt;
      if(battle.spawnN<=0){
        const prog=battle.dodgeT/DODGE_DUR;
        battle.spawnN=Math.max(1.05,1.65-prog*0.55)*slimeAtkRate();
        for(const f of nor)asFoe(f,()=>spawnAttackWave(1));
      }
    }
  }else if(pat&&SPECIAL_ATK[pat]){
    // 体はひとつなので、前の技が終わってから次を出す（残り時間を渡して、間に合わない技は出さない）
    const busy=battle.attacks.some(a=>a.kind&&!a.passive);   // もどってくる衝撃波(passive)は待たない
    if(!busy&&battle.spawnT<=0){
      const R=DODGE_DUR-battle.dodgeT;
      SPECIAL_ATK[pat].spawn(R);
    }
  }else if(battle.spawnT<=0){
    const prog=battle.dodgeT/DODGE_DUR;
    const base=1.65-prog*0.55;
    battle.spawnT=Math.max(1.05,base)*slimeAtkRate();
    spawnAttackWave(1);
  }

  for(const a of battle.attacks){
    if(a.kind){
      const pe=battle.enemy;
      if(a.foe){battle.enemy=a.foe;battle.enemyPose=null;}
      SPECIAL_ATK[a.kind].upd(a,dt);
      if(a.foe){a.foe.pose=battle.enemyPose;battle.enemyPose=null;battle.enemy=pe;}
      if(battle.phase==='lose')return;continue;}
    a.t+=dt;
    if(a.phase==='warn'){
      if(a.t>=D_WARN_DUR){a.phase='fly';a.t=0;}
    }else if(a.phase==='fly'){
      const tt=Math.min(1,a.t/D_FLY_DUR);
      const e=tt*tt*0.4+tt*0.6;
      for(const p of a.projs){
        p.x=p.ox+(p.tx-p.ox)*e;
        p.y=p.oy+(p.ty-p.oy)*e;
      }
      if(a.t>=D_FLY_DUR){
        a.phase='hit';a.t=0;
        if(!a.hitApplied){
          a.hitApplied=true;
          // 視覚位置ベース判定
          const visCol=battle.ppx>=(dCellCX(0)+dCellCX(1))/2?1:0;
          let visRow=0,bd=1e9;
          for(let rr=0;rr<DGRID_ROWS;rr++){const dd=Math.abs(battle.ppy-dCellCY(rr));if(dd<bd){bd=dd;visRow=rr;}}
          let hitCell=null;
          for(const cell of a.cells){
            if(visCol===cell.c&&visRow===cell.r){hitCell=cell;break;}
          }
          if(hitCell){
            {const pe=battle.enemy;if(a.foe)battle.enemy=a.foe;tryHitPlayer(hitCell,1);battle.enemy=pe;}
            if(battle.phase==='lose')return;
          }
        }
      }
    }else if(a.phase==='hit'){
      if(a.t>=D_HIT_DUR)a.dead=true;
    }
  }
  battle.attacks=battle.attacks.filter(a=>!a.dead);

  if(battle.dodgeT>=DODGE_DUR&&battle.phase==='dodge')endDodge();
}

function uR(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x*U,y*U,w*U,h*U);}
function uBox(x,y,w,h,c){uR(x,y,w,1,c);uR(x,y+h-1,w,1,c);uR(x,y+1,1,h-2,c);uR(x+w-1,y+1,1,h-2,c);}

/* テキスト → しきい値でドット化したスプライト */
function textSprite(str,size,color,outline){
  const key=str+'|'+size+'|'+color+'|'+(outline||'');
  if(TS[key])return TS[key];
  const pad=outline?2:1;
  const m=document.createElement('canvas');
  let mc=m.getContext('2d');
  const font='bold '+size+'px '+PIXFONT;
  mc.font=font;
  const w=Math.ceil(mc.measureText(str).width)+pad*2;
  const h=Math.ceil(size*1.3)+pad*2;
  m.width=w;m.height=h;
  mc=m.getContext('2d',{willReadFrequently:true});
  mc.font=font;mc.textBaseline='middle';mc.fillStyle='#fff';
  const out=document.createElement('canvas');out.width=w;out.height=h;
  const oc=out.getContext('2d');
  const od=oc.createImageData(w,h);
  let sd=null;
  if(outline){
    mc.lineWidth=3;mc.lineJoin='round';mc.strokeStyle='#fff';
    mc.strokeText(str,pad,h/2+1);mc.fillText(str,pad,h/2+1);
    sd=mc.getImageData(0,0,w,h).data;
    mc.clearRect(0,0,w,h);
  }
  mc.fillText(str,pad,h/2+1);
  const fd=mc.getImageData(0,0,w,h).data;
  const hex=v=>{if(v.length===4)v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];};
  const c1=hex(color),c2=outline?hex(outline):null;
  for(let i=0;i<w*h;i++){
    if(fd[i*4+3]>110){od.data[i*4]=c1[0];od.data[i*4+1]=c1[1];od.data[i*4+2]=c1[2];od.data[i*4+3]=255;}
    else if(sd&&sd[i*4+3]>110){od.data[i*4]=c2[0];od.data[i*4+1]=c2[1];od.data[i*4+2]=c2[2];od.data[i*4+3]=255;}
  }
  oc.putImageData(od,0,0);
  return TS[key]={c:out,w,h};
}
const UOFF={};
function uText(str,x,y,size,color,align,outline){
  const fs=size*U;
  ctx.save();
  ctx.font=fs+'px '+PIXFONT;
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const w=ctx.measureText(str).width;
  // フォントごとの縦ずれを補正：基準文字の見た目の中心を y に合わせる
  let off=UOFF[fs];
  if(off===undefined){
    const m=ctx.measureText('あ8');
    off=(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
    if(!isFinite(off)||off<=0)off=fs*0.36;
    UOFF[fs]=off;
  }
  let dx=x*U;
  if(align==='center')dx-=w/2;else if(align==='right')dx-=w;
  const cy=(y+size*0.62-0.6)*U+off;
  if(outline){
    ctx.lineJoin='round';ctx.lineWidth=Math.max(3,fs*0.28);ctx.strokeStyle=outline;
    ctx.strokeText(str,dx,cy);
  }
  ctx.fillStyle=color||'#fff';
  ctx.fillText(str,dx,cy);
  ctx.restore();
  return w/U;
}

/* 文字マップ → スプライト（自動で白フチ） */
const SPR={};
function mapSprite(key,rows,pal,outline){
  if(SPR[key])return SPR[key];
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const o=outline?1:0;
  const c=document.createElement('canvas');c.width=w+o*2;c.height=h+o*2;
  const g=c.getContext('2d');
  const on=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&rows[y][x]&&rows[y][x]!=='.'&&rows[y][x]!==' ';
  if(outline){
    g.fillStyle='#fff';
    for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){
      if(on(x,y))continue;
      if(on(x-1,y)||on(x+1,y)||on(x,y-1)||on(x,y+1))g.fillRect(x+o,y+o,1,1);
    }
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(on(x,y)){g.fillStyle=pal[rows[y][x]]||'#fff';g.fillRect(x+o,y+o,1,1);}
  }
  return SPR[key]=c;
}
function uSpr(s,x,y){ctx.imageSmoothingEnabled=false;ctx.drawImage(s,x*U,y*U,s.width*U,s.height*U);}

function lerpCol(a,b,t){
  const h=v=>[parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16)];

  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';

function menuMain(i){
  if(battle.phase!=='command'||battle.sub!==0)return;
  if(i===0){battle.sub=2;battle.itemIdx=0;battle.scroll=0;}
  else if(i===1)tryRun();

}
function itemKeys(){return Object.keys(player.items).filter(k=>player.items[k]>0&&ITEM_DB[k]&&ITEM_DB[k].kind!=='medal');}   // 戦闘でも使える どうぐ
function keyItemKeys(){return Object.keys(player.items).filter(k=>player.items[k]>0&&ITEM_DB[k]&&ITEM_DB[k].kind==='medal');}   // ダンジョン専用
function pickMove(i){
  if(battle.phase!=='command'||battle.sub!==1)return;
  battle.moveIdx=i;
  const name=player.moves[i];
  const cost=moveSp(name);
  if(player.sp>=cost){
    const al=aliveFoes();
    const mv=MOVE_DB[name];
    if(al.length>1&&!mv.all&&!mv.randTarget){battle.pendingMove=i;battle.targetIdx=al[0].slot;battle.sub=4;return;}   // ねらう敵を えらぶ
    if(al.length)setTarget(mv.randTarget?al[(Math.random()*al.length)|0]:al[0]);   // シャイニングは ランダムな敵
    player.sp-=cost;startAttack(name);
  }
  else battle.floats.push({x:480,y:330,text:'SPが たりない！',color:'#ff8a8a',life:1.0,vy:-30});
}
function confirmTarget(){
  if(battle.phase!=='command'||battle.sub!==4)return;
  const f=battle.foes[battle.targetIdx];
  if(!f||f.dead)return;
  const name=player.moves[battle.pendingMove],cost=moveSp(name);
  if(player.sp<cost){battle.sub=1;return;}
  setTarget(f);
  battle.sub=0;
  player.sp-=cost;startAttack(name);
}
